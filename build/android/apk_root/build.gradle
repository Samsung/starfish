buildscript {
    dependencies {
        classpath "com.google.gms:google-services:3.0.0"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'com.samsung.android.galaxy'

galaxy {
    artifact {
        baseName = 'LightweightWebEngine'
        version {
            packageID = 'LightweightWebEngine'
            type = 5
            number = '1.0.0.16'
        }
    }
    analysis {
        cqaEnabled true
        coverage {
            classExclusion = '**/*Activity.class'
        }
    }
}

apply from: 'lwe.gradle'
