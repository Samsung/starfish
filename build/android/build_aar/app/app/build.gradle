buildscript {
    dependencies {
        project.ext.set('apiCode', ((project.hasProperty('API'))?API:'G28.1'))
        if (apiCode.startsWith('G') || apiCode.startsWith('L')) {
            project.ext.set('apiCodeNum', Float.parseFloat(apiCode[1..-1]))
            if (apiCodeNum >= 28.0F) {
                classpath "com.android.tools.build:gradle:3.0.+"
            } else if (apiCodeNum >= 25.0F) {
                classpath "com.android.tools.build:gradle:2.3.+"
            } else if (apiCodeNum > 24.2F && apiCodeNum <= 24.3F) {
                classpath "com.android.tools.build:gradle:2.2.+"
            } else if (apiCodeNum >= 24.0F && apiCodeNum <= 24.2F) {
                classpath "com.android.tools.build:gradle:2.1.+"
            }
            if (apiCode.startsWith('G')) {
                classpath "spde.build:sep-global-pack:" + apiCodeNum + ".+"
            } else if (apiCode.startsWith('L')) {
                classpath "spde.build:sep-local-pack:" + apiCodeNum + ".+"
            }
            classpath "spde.build:sep-galaxy-pack:" + apiCodeNum + ".+"
            classpath "spde.build:sep-galaxy-plugin:" + apiCodeNum + ".+"
        } else {
            project.ext.set('apiCodeNum', Float.parseFloat(apiCode))
            if (apiCodeNum == 19F) {
                classpath "com.android.tools.build:gradle:0.12.+"
            } else if (apiCodeNum == 21.1F) {
                classpath "com.android.tools.build:gradle:0.13.+"
            } else if (apiCodeNum >= 21.2F && apiCodeNum <= 22.2F) {
                classpath "com.android.tools.build:gradle:1.0.+"
            } else if (apiCodeNum >= 22.3F && apiCodeNum < 23.0F) {
                classpath "com.android.tools.build:gradle:1.2.+"
            } else if (apiCodeNum >= 23.0F && apiCodeNum < 24.0F) {
                classpath "com.android.tools.build:gradle:1.3.+"
            } else if (apiCodeNum >= 24.0F) {
                classpath "com.android.tools.build:gradle:2.1.+"
            }
            classpath "spde.build:sdl-pack:" + apiCodeNum + ".+"
            classpath "spde.build:galaxy-pack:" + apiCodeNum + ".+"
            classpath "spde.build:galaxy-plugin:" + apiCodeNum + ".+"
        }
    }
}

//apply plugin: 'com.android.application'
apply plugin: 'com.android.library'
ext.archivesBaseName = "LightweightWebEngine"
apply plugin: 'galaxy'
star.cqa.enabled = false
 
star.packageID = "LightWeightWebEngine"
star.version.type = 2
star.version.major = 1
star.version.minor = 0
star.version.patch = 0
star.version.revision = 1
  
apply from: 'sec/common.gradle'

android {
    lintOptions {
        abortOnError false
    }
    compileSdkVersion 28
    defaultConfig {
//        applicationId "com.samsung.android.mobileservice.lwe"
        minSdkVersion 28
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-fexceptions"
            }
        }
        ndk {
            abiFilters "armeabi-v7a"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.platform
            debuggable = true
            jniDebuggable true
            renderscriptDebuggable true
        }
        release {
            signingConfig signingConfigs.platform
            debuggable = false
            if (apiCodeNum <= 21.1F) {
                runProguard true
            } else {
                minifyEnabled false
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    sourceSets {
        main {
            java {
                srcDir '../../../../../src/public/bridge/android/java'
            }
        }
    }
     libraryVariants.all { variant ->
         variant.outputs.all { output ->
             if (outputFile != null && outputFileName.endsWith('.aar')) {
                 outputFileName = "lightweight-web-engine.aar"
             }
         }
     }
}