name: Build Starfish (dynamic loader)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR Number'
        default: 'master'
        required: true
        type: string
      thirdparty_key:
        description: 'squash_thirdparty cache id (starfish-thirdparty-<key> under BART''s starfish-ci-cache/, see tool/ci/lib_submodule_cache.sh)'
        required: true
        type: string

jobs:
  build_x64:
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Clean workspace
        run: |
            git clean -xdf
      # squash_thirdparty already published (or found already published)
      # this exact submodule content as a tarball on BART (this org's
      # internal Artifactory instance) before this job's `needs:` let it
      # start -- reachable directly from every runner pool here, no git
      # blob-size chunking, no Actions cache (unsupported on this GHES
      # instance) or artifact reuse (slow/unreliable here). See
      # tool/ci/lib_submodule_cache.sh for the mechanism.
      - name: Fetch thirdparty submodule cache
        shell: bash
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: |
          source tool/ci/lib_submodule_cache.sh
          submodule_cache_fetch "${{ inputs.thirdparty_key }}" cache.tar.gz thirdparty.tar.gz
      - name: Extract thirdparty submodules
        run: tar xzf thirdparty.tar.gz
      - name: Verify thirdparty submodules were restored
        run: |
          test -f third_party/escargot/CMakeLists.txt || (echo "::error::third_party/escargot missing after cache restore -- check squash_thirdparty's cache push" && exit 1)
          test -f binding_generator/scripts/starfish_code_generator.py || (echo "::error::binding_generator missing after cache restore -- check squash_thirdparty's cache push" && exit 1)
      - name: Configuration
        run: |
          cmake CMakeLists.txt -Buv_cairo_gl/debug -G Ninja -DTARGETNAME=Starfish \
            -DDOCKER=1 \
            -DCMAKE_BUILD_TYPE=Debug -DBACKEND=uv_cairo_gl \
            -DENABLE_DYNAMIC_LOADER=1 -DSHELL=x11 \
            -DWORKER=1 -DSHARED_WORKER=1 -DSERVICE_WORKER=1
      - name: Build
        run: |
          ninja -C uv_cairo_gl/debug starfish.executable \
            starfish.sharedworker.executable starfish.serviceworker.executable
      - name: Execution test
        run: xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/runner/execution_test.py
      - name: UWE loader test
        run: xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/runner/uwe_loader_test.py
      - name: UWE Worker loader test
        run: xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/runner/uwe_worker_loader_test.py
