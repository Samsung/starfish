name: Build Starfish (serviceworker)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR Number'
        default: 'master'
        required: true
        type: string

jobs:
  build_x64_serivce_worker:
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:20.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        target: [executable, serviceworker.executable, sharedworker.executable]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          repository: mh-byun/starfish_window_build
          ref: ${{ inputs.pr_number }}
      - name: Clean workspace
        run: |
            git clean -xdf
      - name: Configuration
        run: |
          cmake CMakeLists.txt -Buv_cairo_gl/release -G Ninja -DTARGETNAME=Starfish \
            -DHOST=linux -DARCH=x64 -DDOCKER=1 \
            -DMODE=release -DBACKEND=uv_cairo_gl -DSHELL=glfw\
            -DSHARED_WORKER=1 -DSERVICE_WORKER=1
      - name: Build
        run: ninja -C uv_cairo_gl/release starfish.${{ matrix.target }}
