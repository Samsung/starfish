name: Build Starfish

on: [pull_request_target]

jobs:
  build_x64_serivce_worker:
    runs-on: [ legacy-rat6 ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:20.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        backend: [glfw_cairo_gl]
        target: [executable, serviceworker.executable, sharedworker.executable]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: "recursive"
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish
      - name: Reset Submodule
        run: git submodule foreach --recursive git reset --hard
      - name: Configuration
        run: |
          cmake CMakeLists.txt -B${{ matrix.backend }}/release -G Ninja -DTARGETNAME=Starfish \
            -DHOST=linux -DARCH=x64 -DDOCKER=1 \
            -DMODE=release -DBACKEND=${{ matrix.backend }} \
            -DSHARED_WORKER=1 -DSERVICE_WORKER=1
      - name: Build
        run: ninja -C ${{ matrix.backend }}/release starfish.${{ matrix.target }}
