name: Build Starfish (minor port)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR Number'
        default: 'master'
        required: true
        type: string


jobs:
  build_x64_x11_debug_wasm:
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:20.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    # Set reasonable timeout value.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          repository: mh-byun/starfish_window_build
          ref: ${{ inputs.pr_number }}
      - name: Clean workspace
        run: |
            git clean -xdf
      - name: Build Starfish
        run: |
            cmake CMakeLists.txt -DMODE=debug -DBACKEND=uv_cairo_gl -DSHELL=x11 -DDOCKER=1 -DENABLE_WASM=1 -G Ninja
            ninja starfish.executable

  build_x64_x11_release:
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:20.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    # Set reasonable timeout value.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          repository: mh-byun/starfish_window_build
          ref: ${{ inputs.pr_number }}
      - name: Clean workspace
        run: |
            git clean -xdf
      - name: Build Starfish
        run: |
            cmake CMakeLists.txt -DMODE=release -DBACKEND=uv_cairo_gl -DSHELL=x11 -DDOCKER=1 -G Ninja
            ninja starfish.executable
      - name: Run crash test
        run: |
            xvfb-run -s '-screen 0 1920x1080x24' -a ./Starfish https://github.com/Samsung/escargot --crash-test --disable-console 1>/dev/null || exit 1
            xvfb-run -s '-screen 0 1920x1080x24' -a ./Starfish https://github.com/Samsung/escargot --crash-test --disable-console 1>/dev/null || exit 1
            xvfb-run -s '-screen 0 1920x1080x24' -a ./Starfish https://github.com/Samsung/escargot --crash-test --disable-console 1>/dev/null || exit 1

  x64_x11_webcontainer:
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:20.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    # Set reasonable timeout value.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          repository: mh-byun/starfish_window_build
          ref: ${{ inputs.pr_number }}
      - name: Clean workspace
        run: |
            git clean -xdf
      - name: Build Starfish
        run: |
            cmake CMakeLists.txt -DMODE=debug -DBACKEND=glib_cairo_gl -DSHELL=x11_webcontainer -DDOCKER=1 -G Ninja
            ninja starfish.executable
            xvfb-run -s '-screen 0 1920x1080x24' -a ./Starfish https://github.com/Samsung/escargot --crash-test --disable-console || exit 1
  x64_glib_headless:
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:20.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    # Set reasonable timeout value.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          repository: mh-byun/starfish_window_build
          ref: ${{ inputs.pr_number }}
      - name: Clean workspace
        run: |
            git clean -xdf
      - name: Build Starfish
        run: |
            cmake CMakeLists.txt -DMODE=debug -DBACKEND=glib_headless -DSHELL=glib_headless -DDOCKER=1 -G Ninja
            ninja starfish.executable
            ./Starfish https://github.com/Samsung/escargot --crash-test --disable-console || exit 1

  test_api_record_replay:
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:20.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: true
          repository: mh-byun/starfish_window_build
          ref: ${{ inputs.pr_number }}
      - name: Clean workspace
        run: git clean -xdf
      - name: Build (glib_headless + ENABLE_TEST)
        run: |
            cmake CMakeLists.txt \
              -DMODE=debug -DBACKEND=glib_headless -DSHELL=glib_headless \
              -DDOCKER=1 -DENABLE_TEST=1 -G Ninja
            ninja starfish.executable

      - name: Unit tests (Google Test — APIRecorderTest + APIReplayerParserTest)
        run: |
            ./Starfish unit-test || exit 1

      - name: Integration — env var recording
        run: |
            rm -f /tmp/repro.jsonl
            STARFISH_API_RECORD=/tmp/repro.jsonl \
              ./Starfish about:blank --disable-console --timeout=3 || exit 1
            test -s /tmp/repro.jsonl \
              || (echo "ERROR: recording file not created" && exit 1)
            grep -q '"type":"header"' /tmp/repro.jsonl \
              || (echo "ERROR: header event missing" && exit 1)
            grep -q '"type":"LoadURL"' /tmp/repro.jsonl \
              || (echo "ERROR: LoadURL event missing" && exit 1)
            echo "Recording OK — $(wc -l < /tmp/repro.jsonl) events"

      - name: Integration — file trigger recording
        run: |
            rm -f /tmp/repro_trigger.jsonl /tmp/starfish_api_record
            echo "/tmp/repro_trigger.jsonl" > /tmp/starfish_api_record
            ./Starfish about:blank --disable-console --timeout=3 || exit 1
            rm -f /tmp/starfish_api_record
            test -s /tmp/repro_trigger.jsonl \
              || (echo "ERROR: trigger recording file not created" && exit 1)
            echo "File-trigger recording OK"

      - name: Integration — no-permission trigger file does not crash
        run: |
            rm -f /tmp/starfish_api_record
            # Non-existent trigger — must not crash
            ./Starfish about:blank --disable-console --timeout=2 || exit 1
            # Unreadable trigger file — must not crash
            echo "/tmp/repro_noperm.jsonl" > /tmp/starfish_api_record
            chmod 000 /tmp/starfish_api_record
            ./Starfish about:blank --disable-console --timeout=2 || exit 1
            chmod 644 /tmp/starfish_api_record
            rm -f /tmp/starfish_api_record
            echo "No-permission graceful handling OK"

      - name: Integration — replay subcommand
        run: |
            STARFISH_API_RECORD=/tmp/repro_replay.jsonl \
              ./Starfish about:blank --disable-console --timeout=3 || exit 1
            ./Starfish replay /tmp/repro_replay.jsonl --timeout=5 || exit 1
            echo "Replay OK"

  cross_aarch64_x11_glib_cairo_gl:
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-cross-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          repository: mh-byun/starfish_window_build
          ref: ${{ inputs.pr_number }}
      - name: Clean workspace
        run: |
            git clean -xdf
      - name: Cross build (aarch64)
        env:
          S: /opt/sysroot/aarch64
          T: aarch64-linux-gnu
        run: |
            export CC=$T-gcc CXX=$T-g++ LD=$T-ld AR=$T-ar RANLIB=$T-ranlib STRIP=$T-strip
            export CFLAGS=" --sysroot=$S -I$S/usr/lib/$T/glib-2.0/include -I$S/usr/include/$T"
            export CXXFLAGS="$CFLAGS"
            export LDFLAGS="--sysroot=$S"
            export PKG_CONFIG_LIBDIR="$S/usr/lib/$T/pkgconfig:$S/usr/share/pkgconfig"
            export PKG_CONFIG_SYSROOT_DIR="$S"
            cmake CMakeLists.txt -G Ninja -DTARGETNAME=Starfish \
              -DMODE=release -DHOST=linux -DARCH=aarch64 -DBACKEND=glib_cairo_gl -DSHELL=x11 -DDOCKER=1 -DWEBGL=0 \
              -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=$T-gcc -DCMAKE_CXX_COMPILER=$T-g++ \
              -DCMAKE_SYSROOT=$S -DCMAKE_FIND_ROOT_PATH=$S \
              -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
              -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
              -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
            ninja starfish.executable

  cross_arm32_x11_glib_cairo_gl:
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-cross-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          repository: mh-byun/starfish_window_build
          ref: ${{ inputs.pr_number }}
      - name: Clean workspace
        run: |
            git clean -xdf
      - name: Cross build (arm32)
        env:
          S: /opt/sysroot/arm
          T: arm-linux-gnueabihf
        run: |
            export CC=$T-gcc CXX=$T-g++ LD=$T-ld AR=$T-ar RANLIB=$T-ranlib STRIP=$T-strip
            export CFLAGS="--sysroot=$S -I$S/usr/lib/$T/glib-2.0/include -I$S/usr/include/$T"
            export CXXFLAGS="$CFLAGS"
            export LDFLAGS="--sysroot=$S"
            export PKG_CONFIG_LIBDIR="$S/usr/lib/$T/pkgconfig:$S/usr/share/pkgconfig"
            export PKG_CONFIG_SYSROOT_DIR="$S"
            cmake CMakeLists.txt -G Ninja -DTARGETNAME=Starfish \
              -DMODE=release -DHOST=linux -DARCH=arm -DBACKEND=glib_cairo_gl -DSHELL=x11 -DDOCKER=1 -DWEBGL=0 \
              -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm \
              -DCMAKE_C_COMPILER=$T-gcc -DCMAKE_CXX_COMPILER=$T-g++ \
              -DCMAKE_SYSROOT=$S -DCMAKE_FIND_ROOT_PATH=$S \
              -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
              -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
              -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
            ninja starfish.executable

  cross_x86_x11_glib_cairo_gl:
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-cross-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          repository: mh-byun/starfish_window_build
          ref: ${{ inputs.pr_number }}
      - name: Clean workspace
        run: |
            git clean -xdf
      - name: Cross build (x86)
        env:
          S: /opt/sysroot/x86
          T: i386-linux-gnu
        run: |
            export CC=i686-linux-gnu-gcc CXX=i686-linux-gnu-g++ LD=i686-linux-gnu-ld AR=i686-linux-gnu-ar RANLIB=i686-linux-gnu-ranlib STRIP=i686-linux-gnu-strip
            export CFLAGS="-msse2 --sysroot=$S -I$S/usr/lib/$T/glib-2.0/include -I$S/usr/include/$T"
            export CXXFLAGS="$CFLAGS"
            export LDFLAGS="--sysroot=$S"
            export PKG_CONFIG_LIBDIR="$S/usr/lib/$T/pkgconfig:$S/usr/share/pkgconfig"
            export PKG_CONFIG_SYSROOT_DIR="$S"
            cmake CMakeLists.txt -G Ninja -DTARGETNAME=Starfish \
              -DMODE=release -DHOST=linux -DARCH=x86 -DBACKEND=glib_cairo_gl -DSHELL=x11 -DDOCKER=1 -DWEBGL=0 \
              -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=x86 \
              -DCMAKE_C_COMPILER=i686-linux-gnu-gcc -DCMAKE_CXX_COMPILER=i686-linux-gnu-g++ \
              -DCMAKE_SYSROOT=$S -DCMAKE_FIND_ROOT_PATH=$S \
              -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
              -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
              -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
            ninja starfish.executable
