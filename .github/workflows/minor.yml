  test_api_record_replay:
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    timeout-minutes: 30

    steps:
      # The mh-byun/starfish_window_build repo this used to check out (with
      # submodules: true) had no .gitmodules of its own (excluded by
      # prepare_source_without_thirdparty.sh's rsync filter), so that flag
      # was already a no-op -- the deploy key here was dead weight even
      # before this switch. Now that this checks out the real starfish repo
      # directly (which DOES have .gitmodules), submodules: true would try
      # to fetch every real submodule and fail: this runner pool has no
      # proxy/deploy-key path to github.sec.samsung.net (same host-key
      # mismatch other jobs hit before switching to squash_thirdparty's
      # cache). submodules: false + cache restore, same as every other job
      # in this file.
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Clean workspace
        run: git clean -xdf
      # squash_thirdparty already published (or found already published)
      # this exact submodule content as a tarball on BART before this
      # job's `needs:` let it start. See tool/ci/lib_submodule_cache.sh for
      # the mechanism.
      - name: Fetch thirdparty submodule cache
        shell: bash
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: |
          source tool/ci/lib_submodule_cache.sh
          submodule_cache_fetch "${{ inputs.thirdparty_key }}" cache.tar.gz thirdparty.tar.gz
      - name: Extract thirdparty submodules
        run: tar xzf thirdparty.tar.gz
      - name: Verify thirdparty submodules were restored
        run: |
          test -f third_party/escargot/CMakeLists.txt || (echo "::error::third_party/escargot missing after cache restore -- check squash_thirdparty's cache push" && exit 1)
          test -f binding_generator/scripts/starfish_code_generator.py || (echo "::error::binding_generator missing after cache restore -- check squash_thirdparty's cache push" && exit 1)
      - name: Build (glib_headless + ENABLE_TEST)
        run: |
            cmake CMakeLists.txt \
              -DCMAKE_BUILD_TYPE=Debug -DBACKEND=glib_headless -DSHELL=glib_headless \
              -DDOCKER=1 -DENABLE_TEST=1 -G Ninja
            ninja starfish.executable

      - name: Unit tests (Google Test — APIRecorderTest + APIReplayerParserTest)
        run: |
            ./Starfish unit-test || exit 1

      - name: Integration — env var recording
        run: |
            rm -f /tmp/repro.jsonl
            STARFISH_API_RECORD=/tmp/repro.jsonl \
              ./Starfish about:blank --disable-console --timeout=3 || exit 1
            test -s /tmp/repro.jsonl \
              || (echo "ERROR: recording file not created" && exit 1)
            grep -q '"type":"header"' /tmp/repro.jsonl \
              || (echo "ERROR: header event missing" && exit 1)
            grep -q '"type":"LoadURL"' /tmp/repro.jsonl \
              || (echo "ERROR: LoadURL event missing" && exit 1)
            echo "Recording OK — $(wc -l < /tmp/repro.jsonl) events"

      - name: Integration — file trigger recording
        run: |
            rm -f /tmp/repro_trigger.jsonl /tmp/starfish_api_record
            echo "/tmp/repro_trigger.jsonl" > /tmp/starfish_api_record
            ./Starfish about:blank --disable-console --timeout=3 || exit 1
            rm -f /tmp/starfish_api_record
            test -s /tmp/repro_trigger.jsonl \
              || (echo "ERROR: trigger recording file not created" && exit 1)
            echo "File-trigger recording OK"

      - name: Integration — no-permission trigger file does not crash
        run: |
            rm -f /tmp/starfish_api_record
            # Non-existent trigger — must not crash
            ./Starfish about:blank --disable-console --timeout=2 || exit 1
            # Unreadable trigger file — must not crash
            echo "/tmp/repro_noperm.jsonl" > /tmp/starfish_api_record
            chmod 000 /tmp/starfish_api_record
            ./Starfish about:blank --disable-console --timeout=2 || exit 1
            chmod 644 /tmp/starfish_api_record
            rm -f /tmp/starfish_api_record
            echo "No-permission graceful handling OK"

      - name: Integration — replay subcommand
        run: |
            STARFISH_API_RECORD=/tmp/repro_replay.jsonl \
              ./Starfish about:blank --disable-console --timeout=3 || exit 1
            ./Starfish replay /tmp/repro_replay.jsonl --timeout=5 || exit 1
            echo "Replay OK"

