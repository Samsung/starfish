name: Run PR

on: [pull_request_target]

jobs:
  check_source:
    runs-on: [ runner-type1 ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Set reasonable timeout value.
    timeout-minutes: 30

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check tidy
        run: ./tool/check_tidy.py

  squash_thirdparty:
    needs: check_source
    runs-on: [ runner-type1 ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Update submodules with proxy
        run: |
            export https_proxy=http://10.112.1.184:8080
            export http_proxy=http://10.112.1.184:8080
            git config --global http.sslVerify false
            git config --global --add safe.directory /__w/starfish/starfish
            git config submodule.third_party/wpt.update none
            git submodule update --init binding_generator third_party
            cd third_party/escargot
            git submodule update --init third_party
            cd third_party/walrus
            git submodule update --init third_party/sljit
            cd ../../../../
            git config --unset submodule.third_party/wpt.update

      - name: Add safe directory
        run: |
              mkdir -p /__w/starfish/lwe_rel_tmp
              git config --global --add safe.directory /__w/starfish/lwe_rel_tmp

      - name: Reset Submodule
        run: git submodule foreach --recursive git reset --hard

      - name: Make source for Windows
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_SSH_KEY }}
        run: |
              # NOTE: the container runs with HOME=/github/home, but the ssh
              # client resolves the default identity path (~/.ssh/id_rsa) from
              # the passwd home of the running user (root -> /root), NOT from
              # $HOME. Writing to $HOME/.ssh would leave the key where ssh never
              # looks, causing "Permission denied (publickey)". Write to an
              # explicit path and point git at it via GIT_SSH_COMMAND.
              KEY_FILE=/root/.ssh/id_rsa
              install -m 700 -d /root/.ssh
              printf '%s\n' "$DEPLOY_KEY" > "$KEY_FILE"
              chmod 600 "$KEY_FILE"
              export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git config --global user.name "github-actions[bot]"
              tool/release/prepare_source_without_thirdparty.sh
              cd ../lwe_rel_tmp
              git remote add origin git@github.sec.samsung.net:mh-byun/starfish_window_build.git
              git fetch origin
              git push origin HEAD:${{ github.event.pull_request.number }} -f
              cd ../starfish
              rm -rf ../lwe_rel_tmp
              rm -f "$KEY_FILE"

  x64_test:
    needs: [ squash_thirdparty ]
    uses: ./.github/workflows/x64_test.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  x64_test_clang:
    needs: [ squash_thirdparty ]
    uses: ./.github/workflows/x64_test_clang.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  windows:
    needs: [ squash_thirdparty ]
    uses: ./.github/workflows/windows.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  worker:
    needs: [ squash_thirdparty ]
    uses: ./.github/workflows/worker.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  gl_backend:
    needs: [ squash_thirdparty ]
    uses: ./.github/workflows/gl_backend.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  dynamic_loader:
    needs: [ squash_thirdparty ]
    uses: ./.github/workflows/dynamic_loader.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  minor_port:
    needs: [ squash_thirdparty ]
    uses: ./.github/workflows/minor.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
