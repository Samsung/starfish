name: Run PR

on:
    push:
      branches:
        - 'main'
        - 'ci_work'

jobs:
  build_latest_commit:
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:20.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    strategy:
      matrix:
        options: ["-DWEBGL=1 -DWORKER=1 -DIDB=1"]

    # Set reasonable timeout value.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: "recursive"

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Clean workspace
        run: |
            git clean -xdf
      - name: Build Starfish
        run: |
          cmake CMakeLists.txt -G Ninja -DDOCKER=1 \
            -DMODE=debug -DBACKEND=uv_cairo_gl -DSHELL=glfw -DENABLE_DYNAMIC_LOADER=1 \
            ${{ matrix.options }}
          ninja starfish.executable

      - name: Leave comment
        if: ${{ failure() }}
        uses: CODE-Actions/github-script@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Please check the build status.'
            })
