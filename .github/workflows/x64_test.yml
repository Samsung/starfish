name: Build Starfish (x64 test)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR Number'
        default: 'main'
        required: true
        type: string
      thirdparty_key:
        description: 'squash_thirdparty cache id (starfish-thirdparty-<key> under BART''s starfish-ci-cache/, see tool/ci/lib_submodule_cache.sh)'
        required: true
        type: string

jobs:
  build_x64:
    runs-on:  [ code-linux, code-2xlarge ]
    # runs-on: [ runner-type2 ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    strategy:
      matrix:
        options: ["-DWEBGL=1 -DWORKER=1 -DIDB=1 -DUSE_FFMPEG_MEDIA_PLAYER=1 -DWEBCRYPTO=1 -DAUDIO_WORKLET=1"]

    # Set reasonable timeout value.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Clean workspace
        run: |
            git clean -xdf
      # squash_thirdparty already published (or found already published)
      # this exact submodule content as a tarball on BART (this org's
      # internal Artifactory instance) before this job's `needs:` let it
      # start -- reachable directly from every runner pool here, no git
      # blob-size chunking, no Actions cache (unsupported on this GHES
      # instance) or artifact reuse (slow/unreliable here). See
      # tool/ci/lib_submodule_cache.sh for the mechanism.
      - name: Fetch thirdparty submodule cache
        shell: bash
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: |
          source tool/ci/lib_submodule_cache.sh
          submodule_cache_fetch "${{ inputs.thirdparty_key }}" cache.tar.gz thirdparty.tar.gz
      - name: Extract thirdparty submodules
        run: tar xzf thirdparty.tar.gz
      - name: Verify thirdparty submodules were restored
        run: |
          test -f third_party/escargot/CMakeLists.txt || (echo "::error::third_party/escargot missing after cache restore -- check squash_thirdparty's cache push" && exit 1)
          test -f binding_generator/scripts/starfish_code_generator.py || (echo "::error::binding_generator missing after cache restore -- check squash_thirdparty's cache push" && exit 1)
      - name: Build Starfish
        run: |
          cmake CMakeLists.txt -G Ninja -DDOCKER=1 \
            -DCMAKE_BUILD_TYPE=Debug -DBACKEND=glib_cairo_gl -DSHELL=x11 -DENABLE_DYNAMIC_LOADER=1 \
            ${{ matrix.options }}
          ninja starfish.executable
      - name: Test impl unload and fresh restart
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/impl_unload_test.py --impl out/debug/lib/liblightweight-web-engine-impl.so
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/impl_unload_test.py --impl out/debug/lib/liblightweight-web-engine-impl.so --incremental
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/impl_unload_test.py --impl out/debug/lib/liblightweight-web-engine-impl.so --host-thread
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/impl_unload_test.py --impl out/debug/lib/liblightweight-web-engine-impl.so --host-thread --incremental
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/impl_unload_test.py --impl out/debug/lib/liblightweight-web-engine-impl.so --api out/debug/lib/liblightweight-web-engine.so
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/impl_unload_test.py --impl out/debug/lib/liblightweight-web-engine-impl.so --api out/debug/lib/liblightweight-web-engine.so --incremental
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/impl_unload_test.py --impl out/debug/lib/liblightweight-web-engine-impl.so --api out/debug/lib/liblightweight-web-engine.so --host-thread
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/impl_unload_test.py --impl out/debug/lib/liblightweight-web-engine-impl.so --api out/debug/lib/liblightweight-web-engine.so --host-thread --incremental
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/impl_unload_test.py --impl out/debug/lib/liblightweight-web-engine-impl.so --api out/debug/lib/liblightweight-web-engine.so --legacy
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/impl_unload_test.py --impl out/debug/lib/liblightweight-web-engine-impl.so --api out/debug/lib/liblightweight-web-engine.so --wait-for-worker --cycles 1
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/impl_unload_test.py --impl out/debug/lib/liblightweight-web-engine-impl.so --api out/debug/lib/liblightweight-web-engine.so --host-thread --wait-for-worker --cycles 1
      - uses: CODE-Actions/upload-artifact@v2
        with:
          name: starfish-x64_gcc_debug
          path: |
            ./out/debug/bin/lightweight-web-engine
            ./out/debug/lib/*.so
            ./build.ninja
            ./rules.ninja

      - name: Leave comment
        if: ${{ failure() }}
        uses: CODE-Actions/github-script@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Please check the build status.'
            })

  test_unit_test:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      # allow failure due to x11 server bug
      - name: Run unit_test
        uses: CODE-Actions/nick-fields-retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: xvfb-run -s '-screen 0 1920x1080x24' -a ./Starfish unit-test || exit 1

  test_internal_test:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          mkdir -p ~/.fonts
          cp /root/workspace/Ahem.ttf ~/.fonts
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      - name: Build image diff tool
        run: |
          cmake build/test -G Ninja
          ninja install_pixel_test_dep

      # The image-compared tests live in the tests/pixel submodule.
      - name: Checkout tests/pixel submodule
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_tests_pixel.sh

      - name: Run internal_test
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/runner/test_runner.py internal_test || exit 1

      - name: Run file-origin and WebGL security regressions
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/runner/product_security_test.py --browser out/debug/bin/lightweight-web-engine --allow-test-hooks

      # Web Audio output through an isolated PulseAudio null sink; no audio
      # hardware is used. The test skips itself when pulseaudio, pactl or
      # parec is not installed in the image. FFmpeg-only Web Audio checks
      # under tool/webaudio/ stay manual (see README.md).
      - name: Run Web Audio media output test
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/webaudio/test_media_output.py -v || exit 1

      # Web Audio API checks that no WPT on this build gates. Loopback HTTP
      # server only; PULSE_SERVER points at a missing socket, so no audio
      # device is opened.
      - name: Run Web Audio API probes
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 tool/webaudio/test_api_probes.py -v || exit 1

  # Build once for both WebGL test jobs; other suites keep Debug artifacts.
  # See docs/khronos_webgl.md for the conformance lists and result bridge.
  build_khronos_webgl:
    timeout-minutes: 30
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Fetch thirdparty submodule cache
        shell: bash
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: |
          source tool/ci/lib_submodule_cache.sh
          submodule_cache_fetch "${{ inputs.thirdparty_key }}" cache.tar.gz thirdparty.tar.gz

      - name: Extract thirdparty submodules
        run: tar xzf thirdparty.tar.gz

      - name: Build Release Starfish with Wasm JIT
        timeout-minutes: 30
        run: |
          cmake -S . -B out/webgl-ci -G Ninja -DDOCKER=1 \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_TEST=1 -DBACKEND=glib_cairo_gl -DSHELL=x11 \
            -DENABLE_DYNAMIC_LOADER=1 -DWEBGL=1 -DENABLE_WASM=1 -DWALRUS_JIT=ON \
            -DWORKER=1 -DIDB=1 -DUSE_FFMPEG_MEDIA_PLAYER=1 -DAUDIO_WORKLET=1 -DWEBCRYPTO=1
          cmake --build out/webgl-ci --target starfish.executable --parallel

      - name: Package WebGL Release artifact
        run: |
          tar czf starfish-x64_gcc_webgl_release.tar.gz \
            out/webgl-ci/bin/lightweight-web-engine out/webgl-ci/lib/*.so*

      - uses: CODE-Actions/upload-artifact@v2
        with:
          name: starfish-x64_gcc_webgl_release
          path: starfish-x64_gcc_webgl_release.tar.gz

  test_khronos_webgl:
    needs: build_khronos_webgl
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_webgl_release

      - name: Extract WebGL Release artifact
        run: tar xzf starfish-x64_gcc_webgl_release.tar.gz

      - name: Checkout WebGL conformance submodule
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_webgl.sh

      - name: Run khronos_conformance_test
        timeout-minutes: 60
        env:
          STARFISH_BIN: ./out/webgl-ci/bin/lightweight-web-engine
          LP_NUM_THREADS: "4"
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/runner/test_runner.py khronos_conformance_test --khronos-jobs 8 || exit 1

  test_khronos_deqp:
    needs: build_khronos_webgl
    timeout-minutes: 60
    runs-on: [ self-hosted, linux ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_webgl_release

      - name: Extract WebGL Release artifact
        run: tar xzf starfish-x64_gcc_webgl_release.tar.gz

      - name: Checkout WebGL conformance submodule
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_webgl.sh

      - name: Show dEQP CPU capacity
        run: |
          nproc
          lscpu

      - name: Run khronos_deqp_test
        timeout-minutes: 60
        env:
          STARFISH_BIN: ./out/webgl-ci/bin/lightweight-web-engine
          LP_NUM_THREADS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/runner/test_runner.py khronos_deqp_test --khronos-jobs "$(nproc)" || exit 1

  # Browser-vendor test suites (test_runner.py webkit_test, blink_test,
  # gecko_test), served unmodified out of the third_party/webkit, blink and
  # gecko submodules -- see docs/webkit_layouttests.md, docs/blink_web_tests.md
  # and docs/gecko_tests.md. Each submodule is a sparse checkout
  # (tool/<vendor>/fetch.sh), restored through its own cache like
  # third_party/webgl (tool/ci/cache_vendor_tests.sh).
  test_webkit_layouttests:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Checkout WebKit LayoutTests submodule
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_vendor_tests.sh webkit

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          mkdir -p ~/.fonts
          cp /root/workspace/Ahem.ttf ~/.fonts
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      # The suite's reftests compare screenshots like wpt_serve_reftest.
      - name: Build image diff tool
        run: |
          cmake build/test -G Ninja
          ninja install_pixel_test_dep

      - name: Run webkit_test
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/runner/test_runner.py webkit_test || exit 1

  test_blink_web_tests:
    needs: build_x64
    timeout-minutes: 90
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Checkout Blink web tests submodule
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_vendor_tests.sh blink

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          mkdir -p ~/.fonts
          cp /root/workspace/Ahem.ttf ~/.fonts
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      # The suite's reftests compare screenshots like wpt_serve_reftest.
      - name: Build image diff tool
        run: |
          cmake build/test -G Ninja
          ninja install_pixel_test_dep

      - name: Run blink_test
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/runner/test_runner.py blink_test || exit 1

  test_gecko_tests:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Checkout Gecko tests submodule
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_vendor_tests.sh gecko

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          mkdir -p ~/.fonts
          cp /root/workspace/Ahem.ttf ~/.fonts
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      # The suite's reftests compare screenshots like wpt_serve_reftest.
      - name: Build image diff tool
        run: |
          cmake build/test -G Ninja
          ninja install_pixel_test_dep

      - name: Run gecko_test
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/runner/test_runner.py gecko_test || exit 1

  test_wpt_serve_testharness_and_crashtest:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      # Cached separately from the rest of third_party (~940MB, and most
      # other jobs never need it) -- see tool/ci/cache_wpt.sh and
      # worker.yml's "Checkout Testcase.." step for why this replaced a
      # plain `git submodule update third_party/wpt` here.
      - name: Checkout WPT submodule
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_wpt.sh

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      - name: Setup WPT hosts
        run: python3 third_party/wpt/wpt make-hosts-file | tee -a /etc/hosts

      - name: Run wpt_serve_testharness
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 ./tool/runner/test_runner.py wpt_serve_testharness || exit 1

      - name: Run wpt_serve_crashtest
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 ./tool/runner/test_runner.py wpt_serve_crashtest || exit 1

  test_wpt_serve_reftest:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      # Cached separately from the rest of third_party (~940MB, and most
      # other jobs never need it) -- see tool/ci/cache_wpt.sh and
      # worker.yml's "Checkout Testcase.." step for why this replaced a
      # plain `git submodule update third_party/wpt` here.
      - name: Checkout WPT submodule
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_wpt.sh

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          mkdir -p ~/.fonts
          cp /root/workspace/Ahem.ttf ~/.fonts
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      - name: Build image diff tool
        run: |
          cmake build/test -G Ninja
          ninja install_pixel_test_dep

      - name: Setup WPT hosts
        run: python3 third_party/wpt/wpt make-hosts-file | tee -a /etc/hosts

      - name: Run wpt_serve_reftest
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 ./tool/runner/test_runner.py wpt_serve_reftest || exit 1
