name: Build Starfish (x64 test)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR Number'
        default: 'master'
        required: true
        type: string
      thirdparty_key:
        description: 'squash_thirdparty cache id (starfish-thirdparty-<key> under BART''s starfish-ci-cache/, see tool/ci/lib_submodule_cache.sh)'
        required: true
        type: string

jobs:
  build_x64:
    runs-on:  [ code-linux, code-2xlarge ]
    # runs-on: [ runner-type2 ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    strategy:
      matrix:
        options: ["-DWEBGL=1 -DWORKER=1 -DIDB=1"]

    # Set reasonable timeout value.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Clean workspace
        run: |
            git clean -xdf
      # squash_thirdparty already published (or found already published)
      # this exact submodule content as a tarball on BART (this org's
      # internal Artifactory instance) before this job's `needs:` let it
      # start -- reachable directly from every runner pool here, no git
      # blob-size chunking, no Actions cache (unsupported on this GHES
      # instance) or artifact reuse (slow/unreliable here). See
      # tool/ci/lib_submodule_cache.sh for the mechanism.
      - name: Fetch thirdparty submodule cache
        shell: bash
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: |
          source tool/ci/lib_submodule_cache.sh
          submodule_cache_fetch "${{ inputs.thirdparty_key }}" cache.tar.gz thirdparty.tar.gz
      - name: Extract thirdparty submodules
        run: tar xzf thirdparty.tar.gz
      - name: Verify thirdparty submodules were restored
        run: |
          test -f third_party/escargot/CMakeLists.txt || (echo "::error::third_party/escargot missing after cache restore -- check squash_thirdparty's cache push" && exit 1)
          test -f binding_generator/scripts/starfish_code_generator.py || (echo "::error::binding_generator missing after cache restore -- check squash_thirdparty's cache push" && exit 1)
      - name: Build Starfish
        run: |
          cmake CMakeLists.txt -G Ninja -DDOCKER=1 \
            -DCMAKE_BUILD_TYPE=Debug -DBACKEND=glib_cairo_gl -DSHELL=x11 -DENABLE_DYNAMIC_LOADER=1 \
            ${{ matrix.options }}
          ninja starfish.executable
      - uses: CODE-Actions/upload-artifact@v2
        with:
          name: starfish-x64_gcc_debug
          path: |
            ./out/debug/bin/lightweight-web-engine
            ./out/debug/lib/*.so
            ./build.ninja
            ./rules.ninja

      - name: Leave comment
        if: ${{ failure() }}
        uses: CODE-Actions/github-script@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Please check the build status.'
            })

  test_unit_test:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      # allow failure due to x11 server bug
      - name: Run unit_test
        uses: CODE-Actions/nick-fields-retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: xvfb-run -s '-screen 0 1920x1080x24' -a ./Starfish unit-test || exit 1

  test_internal_test:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Checkout Testcase..
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_SSH_KEY }}
        run: |
          # ssh resolves ~/.ssh from the passwd home (root -> /root), not $HOME
          # (the runner sets HOME=/github/home); write the key where ssh looks.
          install -m 700 -d /root/.ssh
          printf '%s\n' "$DEPLOY_KEY" > /root/.ssh/id_rsa
          chmod 600 /root/.ssh/id_rsa
          git submodule init
          git submodule update test

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          mkdir -p ~/.fonts
          cp /root/workspace/Ahem.ttf ~/.fonts
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      - name: Build image diff tool
        run: |
          cmake build/test -G Ninja
          ninja install_pixel_test_dep

      - name: Run internal_test
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/runner/test_runner.py internal_test || exit 1

  test_reftest_all:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ runner-type3 ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      # Deliberately not CODE-Actions/checkout: its own internal auth-setup
      # step runs `git submodule foreach --recursive` unconditionally
      # (regardless of `submodules: false`), and this runner pool reuses its
      # on-disk workspace across jobs -- a workspace whose local HEAD is
      # stuck on an old commit with a broken gitlink/.gitmodules pairing
      # made that internal step fail outright before this job's own steps
      # ever ran (confirmed on a real run: "fatal: No url found for
      # submodule path 'third_party/windows/cairo' in .gitmodules"), even
      # though this job never asks for any submodule content itself. Take
      # the source tree from squash_thirdparty's plain artifact instead --
      # no checkout, nothing for that bug to run against. See pr_ci.yml's
      # "Publish this checkout as a source artifact" step.
      - name: Clean workspace
        run: find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Download source artifact
        uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-source

      - name: Extract source
        run: tar xzf starfish-source.tar.gz

      # test/ is the one submodule this job still needs; cloned directly
      # from .gitmodules' recorded URL + the pin squash_thirdparty recorded
      # alongside the tree, not via `git submodule` (which needs a real
      # superproject .git this checkout deliberately no longer has).
      - name: Checkout Testcase..
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_SSH_KEY }}
        run: |
          # ssh resolves ~/.ssh from the passwd home (root -> /root), not $HOME
          # (the runner sets HOME=/github/home); write the key where ssh looks.
          install -m 700 -d /root/.ssh
          printf '%s\n' "$DEPLOY_KEY" > /root/.ssh/id_rsa
          chmod 600 /root/.ssh/id_rsa
          # A plain `git clone` only transfers commits reachable from the
          # remote's currently-advertised branches/tags -- if test/'s pinned
          # commit isn't a current branch tip any more (this is a live
          # test-case repo, rebased/force-pushed often), that misses it
          # outright ("fatal: reference is not a tree", confirmed on a real
          # run). `git submodule update` never had this problem because it
          # fetches the exact pinned SHA directly, which most git hosts
          # (including this one, evidently, since that's how this job
          # worked before) allow even for a non-tip commit. Do the same
          # fetch-by-SHA here instead of clone-then-checkout.
          url=$(git config -f .gitmodules --get submodule.test.url)
          sha=$(cat test.pin.sha)
          git init -q test
          git -C test remote add origin "$url"
          git -C test fetch --depth 1 origin "$sha"
          git -C test checkout FETCH_HEAD

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          mkdir -p ~/.fonts
          cp /root/workspace/Ahem.ttf ~/.fonts
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      - name: Build image diff tool
        run: |
          cmake build/test -G Ninja
          ninja install_pixel_test_dep

      - name: Run reftest_all
        env:
          LP_NUM_THREADS: "4"
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/runner/test_runner.py reftest_all || exit 1

  test_wpt_serve_testharness_and_crashtest:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      # Cached separately from the rest of third_party (~940MB, and most
      # other jobs never need it) -- see tool/ci/cache_wpt.sh and
      # worker.yml's "Checkout Testcase.." step for why this replaced a
      # plain `git submodule update third_party/wpt` here.
      - name: Checkout WPT submodule
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_wpt.sh

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      - name: Setup WPT hosts
        run: python3 third_party/wpt/wpt make-hosts-file | tee -a /etc/hosts

      - name: Run wpt_serve_testharness
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 ./tool/runner/test_runner.py wpt_serve_testharness || exit 1

      - name: Run wpt_serve_crashtest
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 ./tool/runner/test_runner.py wpt_serve_crashtest || exit 1

  test_wpt_serve_reftest:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      # Cached separately from the rest of third_party (~940MB, and most
      # other jobs never need it) -- see tool/ci/cache_wpt.sh and
      # worker.yml's "Checkout Testcase.." step for why this replaced a
      # plain `git submodule update third_party/wpt` here.
      - name: Checkout WPT submodule
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_wpt.sh

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          mkdir -p ~/.fonts
          cp /root/workspace/Ahem.ttf ~/.fonts
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      - name: Build image diff tool
        run: |
          cmake build/test -G Ninja
          ninja install_pixel_test_dep

      - name: Setup WPT hosts
        run: python3 third_party/wpt/wpt make-hosts-file | tee -a /etc/hosts

      - name: Run wpt_serve_reftest
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 ./tool/runner/test_runner.py wpt_serve_reftest || exit 1
