name: Build Starfish (x64 test)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR Number'
        default: 'master'
        required: true
        type: string

jobs:
  build_x64:
    runs-on:  [ code-linux, code-2xlarge ]
    # runs-on: [ runner-type2 ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    strategy:
      matrix:
        options: ["-DWEBGL=1 -DWORKER=1 -DIDB=1"]

    # Set reasonable timeout value.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          repository: mh-byun/starfish_window_build
          ref: ${{ inputs.pr_number }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Clean workspace
        run: |
            git clean -xdf
      - name: Build Starfish
        run: |
          cmake CMakeLists.txt -G Ninja -DDOCKER=1 \
            -DMODE=debug -DBACKEND=glib_cairo_gl -DSHELL=x11 -DENABLE_DYNAMIC_LOADER=1 \
            ${{ matrix.options }}
          ninja starfish.executable
      - uses: CODE-Actions/upload-artifact@v2
        with:
          name: starfish-x64_gcc_debug
          path: |
            ./out/debug/bin/lightweight-web-engine
            ./out/debug/lib/*.so
            ./build.ninja
            ./rules.ninja

      - name: Leave comment
        if: ${{ failure() }}
        uses: CODE-Actions/github-script@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Please check the build status.'
            })

  test_unit_test:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      # allow failure due to x11 server bug
      - name: Run unit_test
        uses: CODE-Actions/nick-fields-retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: xvfb-run -s '-screen 0 1920x1080x24' -a ./Starfish unit-test || exit 1

  test_internal_test:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Checkout Testcase..
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_SSH_KEY }}
        run: |
          # ssh resolves ~/.ssh from the passwd home (root -> /root), not $HOME
          # (the runner sets HOME=/github/home); write the key where ssh looks.
          install -m 700 -d /root/.ssh
          printf '%s\n' "$DEPLOY_KEY" > /root/.ssh/id_rsa
          chmod 600 /root/.ssh/id_rsa
          git submodule init
          git submodule update test

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          mkdir -p ~/.fonts
          cp /root/workspace/Ahem.ttf ~/.fonts
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      - name: Build image diff tool
        run: |
          cmake build/test -G Ninja
          ninja install_pixel_test_dep

      - name: Run internal_test
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/test_runner.py internal_test || exit 1

  test_reftest_all:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ runner-type3 ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Checkout Testcase..
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_SSH_KEY }}
        run: |
          # ssh resolves ~/.ssh from the passwd home (root -> /root), not $HOME
          # (the runner sets HOME=/github/home); write the key where ssh looks.
          install -m 700 -d /root/.ssh
          printf '%s\n' "$DEPLOY_KEY" > /root/.ssh/id_rsa
          chmod 600 /root/.ssh/id_rsa
          git submodule init
          git submodule update test

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          mkdir -p ~/.fonts
          cp /root/workspace/Ahem.ttf ~/.fonts
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      - name: Build image diff tool
        run: |
          cmake build/test -G Ninja
          ninja install_pixel_test_dep

      - name: Run reftest_all
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a ./tool/test_runner.py reftest_all || exit 1

  test_wpt_serve_testharness_and_crashtest:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Checkout WPT submodule
        run: |
          git submodule init
          git submodule update third_party/wpt

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      - name: Setup WPT hosts
        run: python3 third_party/wpt/wpt make-hosts-file | tee -a /etc/hosts

      - name: Run wpt_serve_testharness
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 ./tool/test_runner.py wpt_serve_testharness || exit 1

      - name: Run wpt_serve_crashtest
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 ./tool/test_runner.py wpt_serve_crashtest || exit 1

  test_wpt_serve_reftest:
    needs: build_x64
    timeout-minutes: 60
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Checkout WPT submodule
        run: |
          git submodule init
          git submodule update third_party/wpt

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_gcc_debug

      - name: Prepare Test
        run: |
          mkdir -p ~/.fonts
          cp /root/workspace/Ahem.ttf ~/.fonts
          chmod a+x $PWD/out/debug/bin/lightweight-web-engine
          ln -s -f $PWD/out/debug/bin/lightweight-web-engine Starfish
          ln -s $PWD/out/debug/lib/libnanomsg.so ./out/debug/lib/libnanomsg.so.5
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.1.1
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.1.1
          ln -s $PWD/out/debug/lib/libcrypto.so ./out/debug/lib/libcrypto.so.3
          ln -s $PWD/out/debug/lib/libssl.so ./out/debug/lib/libssl.so.3

      - name: Build image diff tool
        run: |
          cmake build/test -G Ninja
          ninja install_pixel_test_dep

      - name: Setup WPT hosts
        run: python3 third_party/wpt/wpt make-hosts-file | tee -a /etc/hosts

      - name: Run wpt_serve_reftest
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a python3 ./tool/test_runner.py wpt_serve_reftest || exit 1
