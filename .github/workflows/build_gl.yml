name: Build Starfish (backend_gl)

on: [pull_request_target]

jobs:
  build_x64:
    runs-on: [legacy-rat6]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:20.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        mode: [debug]
        backend: [efl_cairo_gl,x11_cairo_gl]
        target: [executable]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: "recursive"
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish
      - name: Configuration
        run: |
          cmake CMakeLists.txt -G Ninja -DTARGETNAME=Starfish \
            -DHOST=linux -DARCH=x64 -DDOCKER=1 \
            -DMODE=${{ matrix.mode }} -DBACKEND=${{ matrix.backend }}
      - name: Build
        run: ninja starfish.${{ matrix.target }}
