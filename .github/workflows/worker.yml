name: Build Starfish (worker)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR Number'
        default: 'master'
        required: true
        type: string
      thirdparty_key:
        description: 'squash_thirdparty cache id (starfish-thirdparty-<key> under BART''s starfish-ci-cache/, see tool/ci/lib_submodule_cache.sh)'
        required: true
        type: string

jobs:
  build_x64_workers:
    # After the firewall registraion is done, a code runner should also be added to test work.
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    strategy:
        fail-fast: false
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Clean workspace
        run: |
            git clean -xdf
      # squash_thirdparty already published (or found already published)
      # this exact submodule content as a branch on the "sub" GHES remote
      # before this job's `needs:` let it start -- a plain git branch every
      # runner can reach directly (same GHES host, no proxy needed), not a
      # GitHub Actions artifact (cross-run artifact reuse turned out slow/
      # unreliable here) or Actions cache (unsupported on this GHES
      # instance). See tool/ci/lib_submodule_cache.sh for the mechanism.
      - name: Fetch thirdparty submodule cache
        shell: bash
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: |
          source tool/ci/lib_submodule_cache.sh
          submodule_cache_fetch "${{ inputs.thirdparty_key }}" cache.tar.gz thirdparty.tar.gz
      - name: Extract thirdparty submodules
        run: tar xzf thirdparty.tar.gz
      - name: Verify thirdparty submodules were restored
        run: |
          test -f third_party/escargot/CMakeLists.txt || (echo "::error::third_party/escargot missing after cache restore -- check squash_thirdparty's cache push" && exit 1)
          test -f binding_generator/scripts/starfish_code_generator.py || (echo "::error::binding_generator missing after cache restore -- check squash_thirdparty's cache push" && exit 1)
      - name: Configuration
        run: |
            cmake CMakeLists.txt -Buv_cairo_gl/debug -G Ninja -DTARGETNAME=Starfish \
            -DDOCKER=1 \
            -DCMAKE_BUILD_TYPE=Debug -DBACKEND=uv_cairo_gl -DSHELL=x11 \
            -DWORKER=1 -DSHARED_WORKER=1 -DSERVICE_WORKER=1
      - name: Build Starfish
        run: ninja -C uv_cairo_gl/debug starfish.executable
      - name: Build SharedWorker
        run: ninja -C uv_cairo_gl/debug starfish.sharedworker.executable
      - name: Build ServiceWorker
        run: ninja -C uv_cairo_gl/debug starfish.serviceworker.executable

      - uses: CODE-Actions/upload-artifact@v2
        with:
          name: starfish-x64_x11_worker
          path: |
            ./uv_cairo_gl/debug/bin/*
            ./uv_cairo_gl/debug/lib/*
            ./build.ninja
            ./rules.ninja

  test:
    needs: build_x64_workers
    timeout-minutes: 60
    # After the firewall registraion is done, a code runner should also be added to test work.
    runs-on:  [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout source..
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      # wpt is ~940MB and this network drops mid-fetch often enough that a
      # live clone here, every run, isn't worth it -- cached separately from
      # the rest of third_party (see tool/ci/cache_wpt.sh for why it's its
      # own cache lane). Also sidesteps a real gotcha this used to hit: a
      # plain `git submodule update third_party/wpt` here could silently
      # no-op (exit 0, nothing fetched) if squash_thirdparty's own checkout
      # left `submodule.third_party/wpt.update none` set locally and this
      # self-hosted runner reused that same on-disk workspace -- confirmed
      # on a real run ("wpt serve failed: no wpt checkout ... (missing
      # ./wpt)" despite this step reporting success). Restoring from our own
      # cache branch instead of live `git submodule update` avoids that
      # whole class of bug, not just this one instance of it.
      - name: Checkout Testcase..
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_wpt.sh

      - uses: CODE-Actions/download-artifact@v2
        with:
          name: starfish-x64_x11_worker

      - name: Prepare Test
        run: |
            chmod a+x $PWD/uv_cairo_gl/debug/bin/Starfish
            chmod a+x $PWD/uv_cairo_gl/debug/bin/Starfish-sharedworker
            chmod a+x $PWD/uv_cairo_gl/debug/bin/Starfish-serviceworker
            ln -s -f $PWD/uv_cairo_gl/debug/bin/Starfish Starfish
            ln -s -f $PWD/uv_cairo_gl/debug/bin/Starfish-sharedworker Starfish-sharedworker
            ln -s -f $PWD/uv_cairo_gl/debug/bin/Starfish-serviceworker Starfish-serviceworker
            python3 third_party/wpt/wpt make-hosts-file | tee -a /etc/hosts

      - name: Run SharedWorker WPT
        run: |
            xvfb-run -s '-screen 0 1920x1080x24' -a python3 ./tool/runner/test_runner.py wpt_serve_testharness_worker || exit 1

      - name: Run ServiceWorker WPT
        run: |
            xvfb-run -s '-screen 0 1920x1080x24' -a python3 ./tool/runner/test_runner.py wpt_serve_testharness_serviceworker || exit 1
