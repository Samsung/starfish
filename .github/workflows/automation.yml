name: Automation

on:
  workflow_call:
    inputs:
      thirdparty_key:
        description: 'squash_thirdparty cache id (starfish-thirdparty-<key> under BART''s starfish-ci-cache/, see tool/ci/lib_submodule_cache.sh)'
        required: true
        type: string

jobs:
  cdp:
    runs-on: [ code-linux, code-2xlarge ]
    container:
      image: lws-docker-local.bart.sec.samsung.net/starfish-build:24.04
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user root
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: CODE-Actions/checkout@v2
        with:
          submodules: false
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add safe directory
        run: git config --global --add safe.directory /__w/starfish/starfish

      - name: Fetch thirdparty submodules
        shell: bash
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: |
          source tool/ci/lib_submodule_cache.sh
          submodule_cache_fetch "${{ inputs.thirdparty_key }}" cache.tar.gz thirdparty.tar.gz
          tar xzf thirdparty.tar.gz

      # Chromium's tests for the CDP behavior layer are in the sparse
      # third_party/blink checkout.
      - name: Checkout third_party/blink submodule
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
        run: ./tool/ci/cache_vendor_tests.sh blink

      - name: Build
        run: |
          cmake CMakeLists.txt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBACKEND=glib_headless -DSHELL=glib_headless \
            -DHEADLESS_ACCURATE_LAYOUT=1 -DSTARFISH_ENABLE_CDP=1 -DCLI=1
          ninja starfish.executable starfish.cli.executable starfish.cli.unit_test

      - name: Run CDP tests
        run: |
          python3 tool/cdp_test/run.py all \
            --starfish $PWD/out/release/bin/lightweight-web-engine --worker

      - name: Run CLI unit tests
        run: $PWD/out/release/bin/lightweight-web-engine-cli-unit-test

      - name: Run CLI integration tests
        run: |
          python3 tool/cli_test/run_cli_test.py \
            --binary $PWD/out/release/bin/lightweight-web-engine-cli

      # A regular x11 build runs headless at run time: the CLI starts its
      # engine with --headless. xvfb only serves the tests that start the
      # engine themselves without that flag.
      - name: Build x11 for run-time headless
        run: |
          cmake -S . -B out/x11 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBACKEND=glib_cairo_gl -DSHELL=x11 \
            -DSTARFISH_ENABLE_CDP=1 -DCLI=1 -DWEBGL=1
          ninja -C out/x11 starfish.executable starfish.cli.executable

      - name: Run CDP tests on run-time headless
        run: |
          python3 tool/cdp_test/run.py all \
            --starfish $PWD/out/x11/bin/lightweight-web-engine --worker

      - name: Run CLI integration tests on run-time headless
        run: |
          xvfb-run -s '-screen 0 1920x1080x24' -a \
            python3 tool/cli_test/run_cli_test.py \
            --binary $PWD/out/x11/bin/lightweight-web-engine-cli
