# CORTEX-A15
%_vd_cfg_core_type           CORTEX-A15

# chip vendor
# SOC / NOVATEK / NXP / EMUL
%_vd_cfg_chip_vendor         SOC

# panel types, separated by the panel resolution
# 8K / UHD / FHD
%_vd_cfg_panel_resolution    UHD

# composition of partition map
# 8g / 4g / 8g4g / 16g8g
%_vd_cfg_partition_map       tv_8g


# PRODUCT CONFIGS ##############################################################

# product types of vd biz dept.
# TV / WALL / LFD / IWB / AUDIO(Speaker)
%_vd_cfg_product_type        TV

# sub product type (requested by bokyun.kwon(SBOX), invlim(AI_SOUNDBAR))
# NONE / SBOX / AI_SOUNDBAR
%_vd_cfg_sub_product_type    NONE

# to distinguish SMART type (requested by seok.j.jeong)
# FULL_SMART / ENTRY_SMART / NON_SMART
%_vd_cfg_platform_type       FULL_SMART

# resolution of OSD
# 1920x1080
%_vd_cfg_osd_resolution      1920x1080

# Partition map version (requested by demon.lee)
# 1 : Tizen5.0
# 2 : 2020 New TV(4GB) - single RO partition
# 3 : 2020 New B2B
# 4 : 2020 New TV(8GB/16GB) - no single RO partition
%_vd_cfg_partition_map_version  4


# FEATURES #####################################################################

# to check whether it supports vr360 feature or not (requested by jj0913.lee)
# y / n
%_vd_cfg_vr360               y

# enable or disable cma feature (requested by beomho.seo)
# y / n
%_vd_cfg_support_cma         y

# support ambient system manager (requested by yj84.jang)
# y / n
%_vd_cfg_ambient_sysmgr      y

# SP Driver config option (requested by k_m.lee)
# 2019 ...
%_vd_cfg_driver_config       2020


# ETC ##########################################################################

# provides the name of repository
%_vd_cfg_target_repository   %{_repository}

# Platform Licensing or not (requested by dhee777.kim)
# y / n
%_vd_cfg_licensing           n

# UX Theme (requested by taeweon.kim)
# 2K/DARK_THEME ...
%_vd_cfg_ux_theme            2K/DARK_THEME

# Downloadable UX Theme (requested by yh_46.kim)
# NONE ...
%_vd_cfg_ux_theme_ext        NONE

# Force uninstallation of rpm(s)
%_vd_cfg_prohibit_installation  ''

