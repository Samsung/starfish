################################################################################
# OBS Project config for Tizen:TV
#
# RE contacts:
#
#
# vim: set syntax=spec:
################################################################################

Patterntype: rpm-md comps
Release: <CI_CNT>.<B_CNT>
Support: build
Support: build-compare build-mkbaselibs

############################# conflicts resolution #############################

Prefer: util-linux
Prefer: tizen-release-profile_tv
Prefer: terminfo-base-full

# Set a preference for ambiguous libs to use *-64bit libs
#     *-64bit libs on 32bit build environment are required for .Net build (e.g., coreclr, corefx)
#     But when building 64bit target, they could make 'have choice' error with original libs in 64bit repository.
#     e.g., libstdc++ and libstdc++-64bit provides same libs. It's ambiguous to choose appropriate one.
#     Owner : Jiyoung Yun (jy910.yun@samsung.com)
#     libopenssl11 : Dongsun Lee (ds73.lee@samsung.com)
Prefer: libgcc libstdc++ libunwind libuuid zlib libopenssl libopenssl11

# Added by sh47.jang (2nd/Mar/2016)
Prefer: securestorage-client-devel
# Added by deokyang.jin (17th/May/2016)
Prefer: boost-license
# Added by jintae.son (3rd/Apr/2018)
Prefer: elementary

############################# profile definition ###############################

%define profile tv
%define _with_tizen 1

# For classifying debug/release mode
Macros:
%tizen_build_devel_mode 1
:Macros

# %release_name and %tizen_full_version are used in platform/upstream/tizen-release
Macros:
%profile tv
%release_name Tizen6/TV

%tizen_version_major 6
%tizen_version_minor 5
%tizen_version_patch 0

%tizen_version %{tizen_version_major}.%{tizen_version_minor}
%tizen_full_version %{tizen_version}.%{tizen_version_patch}
%tizen %tizen_version
%vendor tizen
%_vendor tizen
%_with_tizen 1

%__spec_check_pre exit 0
%run_check_section 0
%opensuse_bs 1
%_default_patch_fuzz   2
%_binary_payload w5.gzdio
:Macros

########################### display system selection ###########################
# selection of the display system
# this selection is done for each repository
#
# flags combinations:
# |----------------------------------------------------
# | wayland |  x  | meaning
# |----------------------------------------------------
# |         |  1  | pure X11 platform(no wayland)
# |   1     |     | pure wayland platform (no X11)
# |   1     |  1  | wayland but X compatibility
# |         |     | no X and no wayland
# |----------------------------------------------------
#
# Owner: Stephane <stephane.desneux@open.eurogiciel.org>

%define _with_wayland 1
Macros:
%_with_wayland 1
:Macros

################################### RDP flag ###################################
# enable/disable RDP (remote desktop protocol) for wayland
# flag: _with_rdp, used in repositories
# Affects: weston, freerdp
# Owner: Manuel <manuel.bachmann@open.eurogiciel.org>

%define _with_rdp 1
Macros:
%_with_rdp 1
:Macros

############################### mesa activation ################################

%define _with_mesa 1
Macros:
%_with_mesa 1
:Macros

%ifarch %arm armv7l aarch64
Substitute: mesa-devel pkgconfig(glesv2)
%endif

#################################### coregl ####################################

%ifarch %arm aarch64
Prefer: coregl coregl-devel
Prefer: libwayland-egl libwayland-egl-devel
Substitute: mesa-libGLESv2 coregl
Substitute: mesa-libEGL coregl
%endif

################################ Activate KDBUS ################################
# This configuration flag enables the support of KDBUS and Cynara-based Dbus Policy

%define _with_kdbus 1
%define _with_dbuspolicy 1
Macros:
%_with_kdbus 1
%_with_dbuspolicy 1
:Macros

############################# wayland repositories #############################

Substitute: pkgconfig(gles20)  pkgconfig(egl) pkgconfig(glesv2)
Substitute: pkgconfig(gles11)  pkgconfig(egl) pkgconfig(glesv1) pkgconfig(gl)

############################## misc config flags ###############################

# Macro used to handle bluetooth popups without syspopup/bt-syspopup which needs OSP .
# In IVI, this macro permits to address bluetooth notifications (using C API) to notification-service daemon.
# Then homescreen is supposed to deal with those notifications and display relevant popups.
# Affects: bluetooth-frwk
# Owner: Corentin Lecouvey <corentin.lecouvey@open.eurogiciel.org>

Macros:
%_with_bluetooth_frwk_libnotification 1
:Macros

# This build macro controls whether the OS uses
# legacy nfc-manager or neard enabled nfc-manager-neard. If enabled,
# nfc-manager-neard is used. Affects: nfc CAPI, emulator-plugin-nfc
# Owner: Arron Wang <arron.wang@intel.com>

Macros:
%_with_neard_nfc 1
:Macros

# Uses mobile-specific Samsung patches for PulseAudio. Tizen Mobile needs
# Tizen Mobile is compiled with this option.
# Owner: Ismo Puustinen <ismo.puustinen@intel.com>

%define _with_pulseaudio_samsung_policy 1
Macros:
%_with_pulseaudio_samsung_policy 1
:Macros

# Activate introspection
# This is needed on GuPNP to build Rygel correctly in IVI
# Impacts potentially packages that use gobject-introspection
# Owner: Mikko <mikko.ylinen@intel.com>

Macros:
%_with_introspection 1
:Macros

################################# build config #################################

%define gcc_version 90
Macros:
%gcc_version 90
:Macros

################################### targets ####################################

%ifarch i586
Target: i686-tizen-linux
%endif
%ifarch armv7hl
Target: armv7hl-tizen-linux
%endif
%ifarch armv7l
Target: armv7l-tizen-linux
%endif
%ifarch aarch64
Target: aarch64-tizen-linux
%endif

################################# cross build ##################################

%define build_hostarch x86_64
Macros:
%build_hostarch x86_64
:Macros

%ifarch %arm armv7l aarch64
Hostarch: x86_64
# cross build support for the build hosts
Preinstall: qemu-linux-user-%{build_hostarch}-cross
Runscripts: qemu-linux-user-%{build_hostarch}-cross
Keep: qemu-linux-user-%{build_hostarch}-cross
%endif

%ifarch armv7l
Preinstall: qemu-accel-%{build_hostarch}-armv7l
Runscripts: qemu-accel-%{build_hostarch}-armv7l
Preinstall: libmount libblkid libuuid
%endif

%ifarch aarch64
Preinstall: qemu-accel-%{build_hostarch}-aarch64
Runscripts: qemu-accel-%{build_hostarch}-aarch64
Preinstall: libmount libblkid libuuid
%endif

Substitute: python-accel-armv7l-cross-arm python-accel-%{build_hostarch}-armv7l
Substitute: python-accel-aarch64-cross-aarch64 python-accel-%{build_hostarch}-aarch64

Substitute: clang-accel-armv7l-cross-arm clang-accel-%{build_hostarch}-armv7l
Substitute: clang-accel-aarch64-cross-aarch64 clang-accel-%{build_hostarch}-aarch64

%ifarch %arm armv7l aarch64
%define speedpython 1
Macros:
%speedpython 1
:Macros
%endif

%if %speedpython
%ifarch armv7l
Macros:
%en_speedpython BuildRequires: python-accel-%{build_hostarch}-armv7l
%no_speedpython BuildRequires: -python-accel-%{build_hostarch}-armv7l
:Macros
%endif
%ifarch aarch64
Macros:
%en_speedpython BuildRequires: python-accel-%{build_hostarch}-aarch64
%no_speedpython BuildRequires: -python-accel-%{build_hostarch}-aarch64
:Macros
%endif
%endif

##################### exports for different architectures ######################

ExportFilter: \.armv7l\.rpm$ armv7l
ExportFilter: \.aarch64\.rpm$ aarch64
ExportFilter: \.i586\.rpm$ i586
ExportFilter: \.x86_64\.rpm$ x86_64

############################### buildroot config ###############################

