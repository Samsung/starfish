########## compilation flags ##########
%define __global_cflags -O2 -g2 -pipe -Wall -Wp,-D_FORTIFY_SOURCE=2 -fexceptions -fstack-protector-strong -Wformat-security -fmessage-length=0 -Wl,-z,relro,--as-needed

Optflags: armv7l %{__global_cflags} --param=ssp-buffer-size=4 -mcpu=cortex-a53 -mtune=cortex-a53 -march=armv8-a+crc -mlittle-endian -mfpu=neon-vfpv4 -mfloat-abi=softfp -mthumb -Wp,-D__SOFTFP__ -Wl,-O1 -Wl,--hash-style=gnu -Wa,-mimplicit-it=thumb
Optflags: aarch64 %{__global_cflags} -feliminate-unused-debug-types -Wformat -march=armv8-a+fp+simd+crc+crypto -mtune=cortex-a57.cortex-a53
Optflags: i686 %{__global_cflags} -feliminate-unused-debug-types --param=ssp-buffer-size=4 -fdiagnostics-color=never -m32 -march=i686 -mtune=i686 -msse4.2 -mfpmath=sse -fasynchronous-unwind-tables -fno-omit-frame-pointer
Optflags: x86_64 %{__global_cflags} -feliminate-unused-debug-types --param=ssp-buffer-size=4 -fdiagnostics-color=never -m64 -march=corei7 -msse4.2 -mtune=corei7-avx -mfpmath=sse -fasynchronous-unwind-tables -fno-omit-frame-pointer

############################# profile specific for normalization ##############################
%define _repository KantS

Macros:
%_repository KantS

# Define VD specific definitions
%__vd_cflags -O2 -Wall -Wcast-align -Wcast-qual -Werror -Wextra -Wno-unused-parameter -Wshadow -Wwrite-strings -fno-common -fno-omit-frame-pointer -fno-optimize-sibling-calls -fno-strict-aliasing -fsigned-char -fstrict-overflow -Wno-ignored-qualifiers -Wno-array-bounds -Wno-empty-body -Wno-cast-qual
%__vd_cxxflags -O2 -Wall -Wcast-align -Wcast-qual -Werror -Wextra -Wnon-virtual-dtor -Wno-unused-parameter -Wshadow -Wwrite-strings -fno-omit-frame-pointer -fno-optimize-sibling-calls -fno-strict-aliasing -fsigned-char -fstrict-overflow -Wno-ignored-qualifiers -Wno-c++0x-compat -Wno-array-bounds -Wno-empty-body -Wno-cast-qual

# BUILD THREAD OPTION
%_smp_mflags -j8
%_use_customized_job 1

%gcc_flag -DGCC62

%tizen_profile_name tv

# Disable rpm strip for debug(Requested by jihun32.jung, 16/05/09)
%_rpm_strip_option --strip-debug

# Macro for VD C# API packages(Requested by heesong.kim, 16/07/01, updated 16/12/15)
%mono_assembly_path    /usr/lib/assembly

################################################################################
# Build config for Tizen:TV - Substitute model-config
# SIE team
# zubei@samsung.com, er12.cho@samsung.com, engr.kin@samsung.com

# chip
# CHIP_KANTM / CHIP_KANTS / CHIP_KANTSU / CHIP_HAWKA
%_vd_cfg_chip                CHIP_KANTS

# core type (requested by zoobe2.park)
# CORTEX-A15 / CORTEX-A9 / CORTEX-A7
%_vd_cfg_core_type           CORTEX-A15

# resolution of OSD
# 1920x1080
%_vd_cfg_osd_resolution      1920x1080

# panel types, separated by the panel resolution
# UHD / FHD
%_vd_cfg_panel_resolution    FHD

# product types of vd biz dept.
# TV / HTV / LFD / IWB / AV / AUDIO
%_vd_cfg_product_type        TV

# to check whether it supports vr360 feature or not (requested by jj0913.lee)
# y / n
%_vd_cfg_vr360               n

# to prevent new ux exposal, before CEShow all image sent to outside must be built with %{_vd_cfg_hide_ux} == y
# y / n
%_vd_cfg_hide_ux             n

# to pack welcome movies properly, it needs to check flash size (requested by kilsoo.choi)
# representative size of the repository is set
# 2g / 4g / 8g / 16g
%_vd_cfg_flash_size          4g

## year of production (this is not available)
#%_vd_cfg_product_year        2018

# to distinguish SMART type (requested by seok.j.jeong)
# FULL_SMART / ENTRY_SMART
%_vd_cfg_platform_type       ENTRY_SMART

# chip vendor
# SOC / NOVATEK / MSTAR / EMUL
%_vd_cfg_chip_vendor         NOVATEK

# chip revision (requested by sh921.kim)
# 0(default) / 1 / 2 ...
%_vd_cfg_chip_revision       0

# provides the name of repository
%_vd_cfg_target_repository   %{_repository}

# px feature
# y / n
%_vd_cfg_px                  y

# enable or disable cma feature (requested by beomho.seo)
# y / n
%_vd_cfg_support_cma         y

# support ambient system manager (requested by yj84.jang)
# y / n
%_vd_cfg_ambient_sysmgr      n

# B2B Option TV (requested by jh7906.song)
# y / n
%_vd_cfg_Hotel_B2B           n
