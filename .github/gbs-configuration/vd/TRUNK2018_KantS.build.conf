############################# conflicts resolution #############################

Prefer: util-linux
Prefer: mono-wcf
Prefer: monodoc
Prefer: mono-extras
Prefer: mono-web
Prefer: mono-data
Prefer: mono-mvc
Prefer: mono-winforms
Prefer: mono-data-sqlite
Prefer: tizen-release-profile_tv
Prefer: terminfo-base-full
#Added by sh47.jang (16/03/02)
Prefer: securestorage-client-devel
#Added by deokyang.jin (16/05/17)
Prefer: boost-license
#Added by sh47.jang (16/06/02)
Prefer: libopenssl
#Added by heesong.kim (16/06/23)
Prefer: mono-compiler mono-core mono-data-oracle mono-data-sqlite mono-data mono-extras mono-locale-extras mono-mvc
Prefer: mono-nunit mono-reactive-winforms mono-reactive mono-wcf mono-web mono-winforms mono-winfx monodoc
