image: 10.113.64.54:5000/starfish/starfish:latest
build:
  stage: build
  tags:
    - main_build
  before_script:
    - ./tool/check_tidy.py -p src > error_report; if ! cat error_report | grep 'total suggestion files:\s0'; then cat error_report; exit 1; elif ! cat error_report | grep 'total errors:\s0'; then cat error_report; exit 1; fi
    - rm -f .git/index.lock
    - rm -f .git/modules/test/index.lock
    - rm -f .git/modules/third_party/escargot/index.lock
    - git submodule deinit -f .
    - git submodule init
    - git submodule update
    - ./build_third_party.sh
  script:
    #- make x64.exe.debug -j
    #- strip StarFish
    #- strip out/x64/exe/debug/StarFish
    - GYP_GENERATORS=ninja gyp build.gyp --toplevel-dir=`pwd` --depth=0 -Dcomponent=executable
    - ninja -C out/debug starfish.x64.debug
    - ninja -C out/release starfish.x64.release
    - cp out/debug/StarFish.x64.debug StarFish
    - cp -ar out/debug/lib lib
    - strip StarFish
  artifacts:
    paths:
      - StarFish
      - lib

# run tests using the binary built before

test_internal_test1:
  stage: test
  before_script:
    - rm -f .git/index.lock
    - rm -f .git/modules/test/index.lock
    - rm -f .git/modules/third_party/escargot/index.lock
    - git submodule deinit -f .
    - git submodule init
    - git submodule update
    - make install_pixel_test_dep
    - make internal_test_gitlab_prerequisite div=5
  script:
    - xvfb-run -s "-screen 0 1920x1080x24" -a make internal_test_part1 | tee prepush_test_result; if cat prepush_test_result |grep 'FAIL' > /dev/null; then  exit 1; fi
  dependencies:
  - build

