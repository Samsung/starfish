build:
  stage: build
  tags:
    - main_build
  before_script:
    - git submodule deinit -f .
    - git submodule init
    - git submodule update
    - ./build_third_party.sh
  script:
    - make x64.exe.release -j
  artifacts:
    paths:
      - StarFish
      - out/x64/exe/release/StarFish
      - third_party/libav/out/linux/x64/release/libavformat/libavformat.so.56
      - third_party/libav/out/linux/x64/release/libavcodec/libavcodec.so.56
      - third_party/libav/out/linux/x64/release/libavutil/libavutil.so.54
      #- out/

# run tests using the binary built before

test_internal_test_fast1:
  stage: test
  before_script:
    - git submodule deinit -f .
    - git submodule init
    - git submodule update
    - make install_pixel_test_dep
    - make internal_test_gitlab_prerequisite div=4
    - mkdir -p xvfb-tmp.fbdir
    - Xvfb :99 -screen 0 1920x1080x24 -fbdir ./xvfb-tmp.fbdir &
    - export DISPLAY=:99
  after_script:
    - unset DISPLAY
    - rm -rf ./xvfb-tmp.fbdir
    - killall Xvfb
  script:
    - make internal_test_fast | tee prepush_test_result; if cat prepush_test_result |grep 'FAIL' > /dev/null; then  exit 1; fi
    - make internal_test_part1 | tee prepush_test_result; if cat prepush_test_result |grep 'FAIL' > /dev/null; then  exit 1; fi
  dependencies:
  - build

