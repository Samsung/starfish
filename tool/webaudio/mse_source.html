<!doctype html>
<meta charset="utf-8">
<title>MSE PCM routing to Web Audio</title>
<video id="media"></video>
<script>
// Serve beside tone.mp4 generated by test_mse_source.py. This page also runs
// unchanged in a browser supporting MSE, AAC and Web Audio.
let failures = 0;
function check(condition, message) {
    console.assert(condition, message);
    if (!condition) {
        failures++;
        console.log('MSE_PCM_FAIL ' + message);
    }
}
function testEnd() {
    console.log(failures ? 'MSE_PCM_FAILED' : 'MSE_PCM_PASS');
}
function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
function event(target, type) {
    return new Promise(resolve => target.addEventListener(type, resolve,
                                                         {once: true}));
}
async function run() {
    const media = document.getElementById('media');
    const context = new AudioContext();
    const late = location.search.indexOf('late') !== -1;
    let source;
    if (!late) source = context.createMediaElementSource(media);
    const analyser = context.createAnalyser();
    analyser.fftSize = 1024;
    const gain = context.createGain();
    gain.connect(analyser).connect(context.destination);
    if (source) source.connect(gain);
    const samples = new Float32Array(analyser.fftSize);
    function rms() {
        analyser.getFloatTimeDomainData(samples);
        let total = 0;
        for (const value of samples) total += value * value;
        return Math.sqrt(total / samples.length);
    }
    async function level() {
        let total = 0;
        for (let i = 0; i < 8; i++) {
            await wait(40);
            total += rms();
        }
        return total / 8;
    }
    const mse = new MediaSource();
    const opened = event(mse, 'sourceopen');
    media.src = URL.createObjectURL(mse);
    await opened;
    const response = await fetch('tone.mp4');
    const bytes = await response.arrayBuffer();
    const buffer = mse.addSourceBuffer('audio/mp4; codecs="mp4a.40.2"');
    const appended = event(buffer, 'updateend');
    buffer.appendBuffer(bytes);
    await appended;
    mse.endOfStream();
    await context.resume();
    await media.play();
    if (late) {
        await wait(400);
        source = context.createMediaElementSource(media);
        source.connect(gain);
    }
    // A late attachment starts retaining future decoded chunks; let the
    // player's existing decode-lookahead window pass before comparing levels.
    await wait(late ? 650 : 250);
    const full = await level();
    console.log('MSE_PCM_FULL ' + full);
    check(full > 0.02, 'decoded MSE audio reaches the graph');
    media.volume = 0.25;
    await wait(150);
    const quarter = await level();
    console.log('MSE_PCM_QUARTER ' + quarter);
    check(quarter > full * 0.15 && quarter < full * 0.35,
          'media volume scales graph PCM');
    media.muted = true;
    await wait(150);
    check(await level() < 0.0001, 'muted media produces silence');
    media.muted = false;
    media.volume = 1;
    gain.gain.value = 0;
    await wait(150);
    check(await level() < 0.0001, 'graph gain controls MSE output');
    gain.gain.value = 1;
    await wait(150);
    check(await level() > 0.02, 'PCM continues beyond the decode lookahead');
    media.pause();
    await wait(150);
    check(await level() < 0.0001, 'paused media produces silence');
    const sought = event(media, 'seeked');
    media.currentTime = 1;
    await sought;
    await media.play();
    await wait(250);
    check(await level() > 0.02, 'PCM resumes after a backward seek');
    media.pause();
    await context.close();
    testEnd();
}
run().catch(error => {
    check(false, String(error));
    testEnd();
});
</script>
