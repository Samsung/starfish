<!doctype html>
<meta charset="utf-8">
<title>Web Audio API probes</title>
<script>
// Served by test_api_probes.py; the query string picks one group. Each
// failed check prints API_PROBE_FAIL, then the page prints API_PROBE_PASS or
// API_PROBE_FAILED. This page also runs unchanged in a browser.
let failures = 0;
function check(condition, message) {
    console.assert(condition, message);
    if (!condition) {
        failures++;
        console.log('API_PROBE_FAIL ' + message);
    }
}
function throwsType(fn, message) {
    try {
        fn();
    } catch (e) {
        check(e instanceof TypeError, message + ': threw ' + e);
        return;
    }
    check(false, message + ': did not throw');
}
function finish() {
    console.log(failures ? 'API_PROBE_FAILED' : 'API_PROBE_PASS');
    if (typeof testEnd === 'function') testEnd(!failures);
}
// test_api_probes.py answers this request by limiting the browser's address
// space (RLIMIT_AS) to what it uses at that moment plus a margin it picks
// per group. Elsewhere the request fails and nothing is limited.
async function limitAddressSpace() {
    try {
        await fetch('/address-space-limit');
    } catch (e) {
    }
}

const groups = {
    // WebIDL rejects SharedArrayBuffer views without [AllowShared], which no
    // Web Audio operation has.
    'shared-views': async () => {
        if (typeof SharedArrayBuffer !== 'function') {
            console.log('API_PROBE_SKIP SharedArrayBuffer is unavailable');
            return;
        }
        const context = new OfflineAudioContext(1, 128, 8000);
        const f32 = () => new Float32Array(new SharedArrayBuffer(64));
        const u8 = () => new Uint8Array(new SharedArrayBuffer(64));
        const buffer = new AudioBuffer({length: 16, sampleRate: 8000});
        const analyser = context.createAnalyser();
        const plain = (n) => new Float32Array(n);
        throwsType(() => buffer.copyFromChannel(f32(), 0), 'copyFromChannel');
        // Argument conversion comes before the channel range check.
        throwsType(() => buffer.copyFromChannel(f32(), 5),
                   'copyFromChannel with a bad channel');
        throwsType(() => buffer.copyToChannel(f32(), 0), 'copyToChannel');
        throwsType(() => analyser.getFloatFrequencyData(f32()),
                   'getFloatFrequencyData');
        throwsType(() => analyser.getByteFrequencyData(u8()),
                   'getByteFrequencyData');
        throwsType(() => analyser.getFloatTimeDomainData(f32()),
                   'getFloatTimeDomainData');
        throwsType(() => analyser.getByteTimeDomainData(u8()),
                   'getByteTimeDomainData');
        throwsType(() => context.createBiquadFilter().getFrequencyResponse(
                       plain(4), f32(), plain(4)),
                   'BiquadFilterNode.getFrequencyResponse');
        throwsType(() => context.createIIRFilter([1], [1]).getFrequencyResponse(
                       f32(), plain(16), plain(16)),
                   'IIRFilterNode.getFrequencyResponse');
        throwsType(() => { context.createWaveShaper().curve = f32(); },
                   'WaveShaperNode.curve');
        const copy = plain(16);
        buffer.copyToChannel(plain(16).fill(2), 0);
        buffer.copyFromChannel(copy, 0);
        check(copy[3] === 2, 'unshared views are still accepted');
    },

    'media-element-source': async () => {
        check(MediaElementAudioSourceNode.length === 2,
              'MediaElementAudioSourceNode.length is 2');
        const context = new AudioContext();
        const audio = document.createElement('audio');
        const node = new MediaElementAudioSourceNode(context,
                                                     {mediaElement: audio});
        check(node.mediaElement === audio, 'mediaElement is the element');
        check(node.numberOfInputs === 0 && node.numberOfOutputs === 1,
              'no inputs, one output');
        let error = null;
        try {
            new MediaElementAudioSourceNode(context, {mediaElement: audio});
        } catch (e) {
            error = e;
        }
        check(error && error.name === 'InvalidStateError',
              'a second source for the element throws InvalidStateError');
        throwsType(() => new MediaElementAudioSourceNode(context, {}),
                   'missing mediaElement');
        throwsType(() => MediaElementAudioSourceNode(
                       context, {mediaElement: document.createElement('audio')}),
                   'call without new');
        throwsType(() => new MediaElementAudioSourceNode(
                       new OfflineAudioContext(1, 1, 8000),
                       {mediaElement: document.createElement('audio')}),
                   'OfflineAudioContext is not an AudioContext');
        await context.close();
    },

    // A looped source with a negative rate enters its loop on the first
    // frame; a start time between two frames must not change that.
    'reverse-loop': async () => {
        const sampleRate = 8000;
        const cases = [
            // [label, when (frames), offset, loopStart, loopEnd (seconds)]
            ['whole buffer, integer start', 10, 0, 0, 0],
            ['whole buffer, start 10.5', 10.5, 0, 0, 0],
            ['loop [64,192), offset clamped to loopStart, start 10.5', 10.5,
             0, 64 / sampleRate, 192 / sampleRate],
            ['loop [64,192), offset at loopStart, start 10.25', 10.25,
             64 / sampleRate, 64 / sampleRate, 192 / sampleRate],
        ];
        for (const [label, when, offset, loopStart, loopEnd] of cases) {
            const context = new OfflineAudioContext(1, 1024, sampleRate);
            const buffer = new AudioBuffer({length: 256, sampleRate});
            buffer.getChannelData(0).fill(1);
            const source = new AudioBufferSourceNode(context, {
                buffer, loop: true, loopStart, loopEnd, playbackRate: -1});
            source.connect(context.destination);
            let ended = false;
            source.onended = () => { ended = true; };
            source.start(when / sampleRate, offset);
            const data = (await context.startRendering()).getChannelData(0);
            check(data.subarray(Math.ceil(when)).every((v) => v !== 0),
                  label + ': the looped source keeps sounding');
            check(!ended, label + ': the looped source does not end');
        }
    },

    // Scheduled sources use the exact start and stop times. At 44100 Hz,
    // (90 / 44100) * 44100 rounds above 90, so rounding to frames would
    // start or stop at frame 91.
    'exact-times': async () => {
        const sampleRate = 44100;
        const frame = 90;
        const when = frame / sampleRate;
        const context = new OfflineAudioContext(6, 256, sampleRate);
        const merger = new ChannelMergerNode(context, {numberOfInputs: 6});
        merger.connect(context.destination);
        const ones = new AudioBuffer({length: 256, sampleRate});
        ones.getChannelData(0).fill(1);
        const cosine = context.createPeriodicWave([0, 1], [0, 0]);
        const sources = [
            new AudioBufferSourceNode(context, {buffer: ones}),
            new AudioBufferSourceNode(context, {buffer: ones}),
            new ConstantSourceNode(context),
            new ConstantSourceNode(context),
            new OscillatorNode(context, {periodicWave: cosine, frequency: 100}),
            new OscillatorNode(context, {periodicWave: cosine, frequency: 100}),
        ];
        sources.forEach((source, i) => {
            source.connect(merger, 0, i);
            if (i % 2) {
                source.start(0);
                source.stop(when);
            } else {
                source.start(when);
            }
        });
        const rendered = await context.startRendering();
        const names = ['AudioBufferSourceNode', 'ConstantSourceNode',
                       'OscillatorNode'];
        names.forEach((name, n) => {
            const started = rendered.getChannelData(2 * n);
            const stopped = rendered.getChannelData(2 * n + 1);
            check(started[frame - 1] === 0 && started[frame] !== 0,
                  name + ' started at ' + frame + '/sampleRate plays from ' +
                  'frame ' + frame);
            check(stopped[frame - 1] !== 0 && stopped[frame] === 0,
                  name + ' stopped at ' + frame + '/sampleRate is silent ' +
                  'from frame ' + frame);
        });
    },

    // createScriptProcessor() validation and the fixed channel settings,
    // and a node with no input: its output lags by 2 * bufferSize frames.
    'script-processor': async () => {
        const context = new OfflineAudioContext(1, 4096, 8000);
        const indexSizeError = (fn, message) => {
            let error = null;
            try {
                fn();
            } catch (e) {
                error = e;
            }
            check(error && error.name === 'IndexSizeError',
                  message + ' throws IndexSizeError');
        };
        indexSizeError(() => context.createScriptProcessor(100),
                       'bufferSize 100');
        indexSizeError(() => context.createScriptProcessor(0, 0, 0),
                       'zero input and output channels');
        indexSizeError(() => context.createScriptProcessor(0, 33, 1),
                       '33 input channels');
        const defaults = context.createScriptProcessor();
        check(defaults.bufferSize === 1024, 'bufferSize 0 selects 1024');
        check(defaults.channelCount === 2 &&
                  defaults.channelCountMode === 'explicit',
              'channelCount is numberOfInputChannels, mode explicit');
        let error = null;
        try {
            defaults.channelCount = 1;
        } catch (e) {
            error = e;
        }
        check(error && error.name === 'NotSupportedError',
              'channelCount cannot change');
        const node = context.createScriptProcessor(256, 0, 1);
        node.connect(context.destination);
        let events = 0;
        node.onaudioprocess = (event) => {
            events++;
            event.outputBuffer.getChannelData(0).fill(0.25);
        };
        const data = (await context.startRendering()).getChannelData(0);
        check(events === 16, '16 events for 4096 frames: ' + events);
        check(data[511] === 0 && data[512] === 0.25 && data[4095] === 0.25,
              'output starts 512 frames late');

        // playbackTime is in the context's time coordinates: a node created
        // at a suspend at frame 2048 first plays its output at frame
        // 2048 + 2 * 1024. A listener added with addEventListener() while
        // the node is connected but has had none still gets events.
        const late = new OfflineAudioContext(1, 8192, 8000);
        let firstTime = null;
        let inputChannels = null;
        let unlistened = null;
        let listenedEvents = 0;
        let firstListenedTime = null;
        late.suspend(2048 / 8000).then(() => {
            const node = late.createScriptProcessor(1024, 3, 1);
            node.connect(late.destination);
            node.onaudioprocess = (event) => {
                if (firstTime === null) {
                    firstTime = event.playbackTime;
                    inputChannels = event.inputBuffer.numberOfChannels;
                }
            };
            unlistened = late.createScriptProcessor(256, 1, 1);
            unlistened.connect(late.destination);
            late.suspend(4096 / 8000).then(() => {
                unlistened.addEventListener('audioprocess', (event) => {
                    listenedEvents++;
                    if (firstListenedTime === null) {
                        firstListenedTime = event.playbackTime;
                    }
                });
                late.resume();
            });
            late.resume();
        });
        await late.startRendering();
        check(firstTime === (2048 + 2 * 1024) / 8000,
              'playbackTime is in context time: ' + firstTime);
        check(inputChannels === 3, 'inputBuffer has numberOfInputChannels');
        // Blocks that completed with no listener are not delivered late.
        check(listenedEvents === 16 && firstListenedTime === (4096 + 512) / 8000,
              'a listener added later with addEventListener() gets the ' +
                  'events of later blocks: ' + listenedEvents + ' from ' +
                  firstListenedTime);

        const input = new AudioBuffer({length: 1, sampleRate: 8000});
        const output = new AudioBuffer({length: 1, sampleRate: 8000});
        const event = new AudioProcessingEvent(
            'audioprocess',
            {playbackTime: 1.5, inputBuffer: input, outputBuffer: output});
        check(event.type === 'audioprocess' && event.playbackTime === 1.5 &&
                  event.inputBuffer === input &&
                  event.outputBuffer === output,
              'AudioProcessingEvent constructor keeps its members');
        throwsType(() => new AudioProcessingEvent(
                       'audioprocess', {playbackTime: 0, inputBuffer: input}),
                   'AudioProcessingEvent without outputBuffer');
        throwsType(() => new ScriptProcessorNode(), 'new ScriptProcessorNode');
    },

    // renderSizeHint: the ConvolverNode reproduces its impulse response
    // with any quantum; a DelayNode renders the same with a quantum longer
    // or shorter than the default.
    'render-quantum': async () => {
        const sampleRate = 48000;
        const response = new AudioBuffer({length: 300, sampleRate});
        const responseData = response.getChannelData(0);
        for (let i = 0; i < responseData.length; i++) {
            responseData[i] = (i % 7) / 7 - 0.5;
        }
        const impulse = new AudioBuffer({length: 1, sampleRate});
        impulse.getChannelData(0)[0] = 1;
        for (const quantum of [128, 256, 100]) {
            const context = new OfflineAudioContext(
                {length: 1024, sampleRate, renderSizeHint: quantum});
            check(context.renderQuantumSize === quantum,
                  'renderQuantumSize is ' + quantum);
            const source = new AudioBufferSourceNode(context, {buffer: impulse});
            const convolver = new ConvolverNode(
                context, {buffer: response, disableNormalization: true});
            source.connect(convolver).connect(context.destination);
            source.start();
            const data = (await context.startRendering()).getChannelData(0);
            // The spec has no extra latency. Starfish's convolver adds 128
            // frames for a quantum that is not a multiple of its 128-frame
            // partitions (a documented deviation), so accept either.
            const latency = data[0] ? 0 : data.findIndex((v) => v !== 0);
            let error = 0;
            for (let i = 0; i < responseData.length; i++) {
                error = Math.max(error,
                                 Math.abs(data[i + latency] - responseData[i]));
            }
            check(error < 1e-5 && (latency === 0 ||
                                   (latency === 128 && quantum % 128)),
                  'ConvolverNode with a ' + quantum + '-frame quantum ' +
                  'reproduces its response (latency ' + latency + ', ' +
                  'error ' + error + ')');
        }
        const delayed = [];
        for (const quantum of [128, 1024]) {
            const context = new OfflineAudioContext(
                {length: 2048, sampleRate, renderSizeHint: quantum});
            const source = new AudioBufferSourceNode(context, {buffer: impulse});
            const delay = new DelayNode(context, {delayTime: 240 / sampleRate});
            source.connect(delay).connect(context.destination);
            source.start();
            delayed.push((await context.startRendering()).getChannelData(0));
        }
        check(Math.abs(delayed[1][240] - 1) < 1e-4 &&
                  delayed[1].every((v, i) => v === delayed[0][i]),
              'DelayNode output with a 1024-frame quantum equals the ' +
              '128-frame one');
        // A quantum below 128 frames, rendered far past the delay line's
        // length, so the ring wraps many times.
        const rendered = [];
        for (const quantum of [128, 100]) {
            const context = new OfflineAudioContext(
                {length: sampleRate, sampleRate, renderSizeHint: quantum});
            const source = new ConstantSourceNode(context, {offset: 0.5});
            const delay = new DelayNode(
                context, {maxDelayTime: 0.01, delayTime: 0.005});
            source.connect(delay).connect(context.destination);
            source.start();
            rendered.push((await context.startRendering()).getChannelData(0));
        }
        check(rendered[1][sampleRate - 1] === 0.5 &&
                  rendered[1].every((v, i) => v === rendered[0][i]),
              'DelayNode output with a 100-frame quantum equals the ' +
              '128-frame one over 1 s');
    },

    // A context constructor from a document that is not fully active throws
    // InvalidStateError before it checks the options' values; WebIDL type
    // errors in the options come first.
    'detached-document': async () => {
        const frame = document.createElement('iframe');
        document.documentElement.appendChild(frame);
        const frameWindow = frame.contentWindow;
        frame.remove();
        const name = (fn) => {
            try {
                fn();
            } catch (e) {
                return e.name;
            }
            return 'no exception';
        };
        check(name(() => new frameWindow.AudioContext({renderSizeHint: 0})) ===
                  'InvalidStateError',
              'AudioContext with a bad hint in a detached document');
        check(name(() => new frameWindow.OfflineAudioContext(
                  {length: 1, sampleRate: 8000, renderSizeHint: 0})) ===
                  'InvalidStateError',
              'OfflineAudioContext with a bad hint in a detached document');
        const typeErrors = [
            [() => new frameWindow.AudioContext({renderSizeHint: 'bogus'}),
             'detached AudioContext, renderSizeHint string'],
            [() => new frameWindow.AudioContext({latencyHint: 'bogus'}),
             'detached AudioContext, latencyHint string'],
            [() => new frameWindow.OfflineAudioContext(
                 {length: 1, sampleRate: 8000, renderSizeHint: 'bogus'}),
             'detached OfflineAudioContext, renderSizeHint string'],
            [() => new OfflineAudioContext(
                 {length: 1, sampleRate: 1, renderSizeHint: 'bogus'}),
             'OfflineAudioContext, bad sampleRate and renderSizeHint string'],
            [() => new AudioContext({sampleRate: 1, renderSizeHint: 'bogus'}),
             'AudioContext, bad sampleRate and renderSizeHint string'],
        ];
        for (const [fn, label] of typeErrors) {
            const thrown = name(fn);
            check(thrown === 'TypeError', label + ': ' + thrown);
        }
    },

    // https://webaudio.github.io/web-audio-api/#dictdef-constantsourceoptions
    // ConstantSourceOptions has no channel members, so they are ignored.
    'source-options': async () => {
        const context = new OfflineAudioContext(1, 128, 8000);
        let node = null;
        try {
            node = new ConstantSourceNode(context, {channelCount: 0});
        } catch (e) {
            check(false, 'ConstantSourceNode with channelCount 0 threw ' + e);
        }
        check(!node || node.channelCount === 2,
              'ConstantSourceNode channelCount stays 2');
        // The constructor reports its own errors instead of aborting.
        let thrown = 'no exception';
        try {
            new AudioBufferSourceNode(context, {detune: Infinity});
        } catch (e) {
            thrown = e.name;
        }
        check(thrown !== 'no exception',
              'AudioBufferSourceNode with a non-finite detune throws');
    },

    // https://webaudio.github.io/web-audio-api/#acquire-the-content
    // Acquiring a buffer with a detached channel array gives no content: an
    // AudioBufferSourceNode plays nothing, a ConvolverNode renders silence
    // and a ScriptProcessorNode outputs silence for that event. Each graph
    // also runs without that detach and must then be audible.
    // ArrayBuffer.prototype.transfer() detaches; postMessage() transfer does
    // not yet, which keeps WPT transferred-buffer-output.html tracked.
    'detached-channel': async () => {
        const filled = (detached) => {
            const buffer = new AudioBuffer({length: 1024, sampleRate: 8000});
            const samples = buffer.getChannelData(0);
            samples.fill(1);
            if (detached) {
                samples.buffer.transfer();
                const length = buffer.getChannelData(0).length;
                check(length === 0, 'getChannelData() after the channel ' +
                                        'was detached: length ' + length);
                const copy = new Float32Array(4);
                buffer.copyFromChannel(copy, 0);
                check(copy.every((sample) => sample === 0),
                      'copyFromChannel() from a detached channel: ' + copy);
            }
            return buffer;
        };
        const audible = async (build) => {
            const context = new OfflineAudioContext(1, 2048, 8000);
            build(context);
            const data = (await context.startRendering()).getChannelData(0);
            return data.some((sample) => sample !== 0);
        };
        const graphs = {
            'start()': (context, detached) => {
                const source = new AudioBufferSourceNode(
                    context, {buffer: filled(detached)});
                source.connect(context.destination);
                source.start();
            },
            'buffer set after start()': (context, detached) => {
                const source = new AudioBufferSourceNode(context);
                source.connect(context.destination);
                source.start();
                source.buffer = filled(detached);
            },
            'ConvolverNode': (context, detached) => {
                const source = new ConstantSourceNode(context);
                const convolver = new ConvolverNode(
                    context, {disableNormalization: true});
                convolver.buffer = filled(detached);
                source.connect(convolver).connect(context.destination);
                source.start();
            },
            // Otherwise only the first two events detach, which covers both
            // output buffers of a double-buffering implementation; later
            // events must still be heard.
            'ScriptProcessorNode': (context, detached) => {
                const node = context.createScriptProcessor(256, 0, 1);
                node.connect(context.destination);
                let events = 0;
                node.onaudioprocess = (event) => {
                    const output = event.outputBuffer.getChannelData(0);
                    output.fill(1);
                    if (detached || events++ < 2) {
                        output.buffer.transfer();
                    }
                };
            },
        };
        for (const [label, build] of Object.entries(graphs)) {
            check(await audible((context) => build(context, false)),
                  label + ': audible without a detached channel');
            check(!await audible((context) => build(context, true)),
                  label + ': silent with a detached channel');
        }
        // A detached inputBuffer channel, or an outputBuffer channel detached
        // after its event, must not leave later events empty.
        const context = new OfflineAudioContext(1, 2048, 8000);
        const source = new ConstantSourceNode(context);
        const node = context.createScriptProcessor(256, 1, 1);
        source.connect(node).connect(context.destination);
        source.start();
        const inputs = [];
        const outputs = [];
        let previous = null;
        node.onaudioprocess = (event) => {
            const input = event.inputBuffer.getChannelData(0);
            const output = event.outputBuffer.getChannelData(0);
            inputs.push(input.every((sample) => sample === 1) ? input.length
                                                               : 'wrong');
            outputs.push(output.length);
            if (inputs.length <= 2) {
                input.buffer.transfer();
            }
            if (previous && outputs.length <= 3) {
                previous.getChannelData(0).buffer.transfer();
            }
            previous = event.outputBuffer;
        };
        await context.startRendering();
        check(inputs.length > 3 &&
                  inputs.every((length) => length === 256),
              'inputBuffer after a detach: ' + inputs);
        check(outputs.every((length) => length === 256),
              'outputBuffer after a later detach: ' + outputs);
    },

    // https://webidl.spec.whatwg.org/#dfn-attribute-getter
    // Attribute accessors are named "get <name>" and "set <name>". The
    // idlharness test that checks this stays tracked for other reasons.
    'accessor-names': async () => {
        const descriptor = Object.getOwnPropertyDescriptor(
            AudioNode.prototype, 'channelCount');
        check(descriptor.get.name === 'get channelCount',
              'getter name: ' + descriptor.get.name);
        check(descriptor.set.name === 'set channelCount',
              'setter name: ' + descriptor.set.name);
    },

    // Once the graph is built, test_api_probes.py leaves 4 GB of address
    // space, with the largest render quantum, where one channel of a bus is
    // 18 MB. A failed channel count change throws
    // NotSupportedError, keeps the old value and leaves a silent context
    // instead of rendering half-resized buses.
    'oom-channel-count': async () => {
        const context = new OfflineAudioContext({
            numberOfChannels: 1, length: 1, sampleRate: 768000,
            renderSizeHint: 4608000});
        const source = new ConstantSourceNode(context, {offset: 0.5});
        const first = new GainNode(
            context, {channelCountMode: 'explicit', channelCount: 1});
        source.connect(first);
        // Max-mode gains follow their input, so 32 channels resize two
        // 590 MB buses per node, more than the limit allows.
        let last = first;
        for (let i = 0; i < 16; i++) {
            last = last.connect(new GainNode(context));
        }
        last.connect(context.destination);
        await limitAddressSpace();
        source.start();
        const rendering = context.startRendering();
        let thrown = 'no exception';
        try {
            first.channelCount = 32;
        } catch (e) {
            thrown = e.name;
        }
        check(thrown === 'NotSupportedError',
              'channelCount = 32 out of memory: ' + thrown);
        check(first.channelCount === 1,
              'channelCount after the failure: ' + first.channelCount);
        const rendered = (await rendering).getChannelData(0);
        check(rendered.every((v) => v === 0),
              'renders silence after the failure');
    },

    // Once the context exists, test_api_probes.py leaves 0.5 GB of address
    // space: a 32-input ChannelMergerNode's 1.2 GB of buses cannot be
    // allocated, so its factory and constructor throw NotSupportedError,
    // and the context remains usable. One failed allocation, not an
    // exhausted process.
    'oom-node-creation': async () => {
        const context = new OfflineAudioContext({
            numberOfChannels: 1, length: 1, sampleRate: 768000,
            renderSizeHint: 4608000});
        await limitAddressSpace();
        const name = (fn) => {
            try {
                fn();
            } catch (e) {
                return e.name;
            }
            return 'no exception';
        };
        let thrown = name(() => context.createChannelMerger(32));
        check(thrown === 'NotSupportedError', 'createChannelMerger: ' + thrown);
        thrown = name(() => new ChannelMergerNode(
            context, {numberOfInputs: 32}));
        check(thrown === 'NotSupportedError',
              'new ChannelMergerNode: ' + thrown);
        thrown = name(() => new GainNode(context));
        check(thrown === 'no exception',
              'a small node afterwards: ' + thrown);
    },

    // AudioWorkletNode construction paths the webaudio WPT reaches only
    // together with process(): parameterData conversion, processorerror
    // from the processor constructor and from options that cannot be
    // deserialized in the worklet, and the pending construction data.
    'audio-worklet-node': async () => {
        if (typeof AudioWorkletNode !== 'function') {
            console.log('API_PROBE_SKIP built without AUDIO_WORKLET=1');
            return;
        }
        const context = new OfflineAudioContext(1, 128, 8000);
        const source = `
            let direct = 'no exception';
            try {
                new AudioWorkletProcessor();
            } catch (e) {
                direct = e.name;
            }
            registerProcessor('echo', class extends AudioWorkletProcessor {
                static get parameterDescriptors() {
                    return [{name: 'x', defaultValue: 1, minValue: 0,
                             maxValue: 2, automationRate: 'k-rate'}];
                }
                constructor(options) {
                    super();
                    this.port.postMessage({direct, options});
                }
            });
            registerProcessor('throws', class extends AudioWorkletProcessor {
                constructor() {
                    throw new Error('constructor failed');
                }
            });`;
        await context.audioWorklet.addModule(URL.createObjectURL(
            new Blob([source], {type: 'application/javascript'})));

        const node = new AudioWorkletNode(context, 'echo', {
            parameterData: {x: 0.5, unknown: 3},
            processorOptions: {list: [1, 2]},
        });
        const x = node.parameters.get('x');
        check(node.parameters.size === 1 && x instanceof AudioParam,
              'parameters holds the descriptor\'s AudioParam');
        check(x.value === 0.5 && x.defaultValue === 1 && x.maxValue === 2 &&
                  x.automationRate === 'k-rate',
              'AudioParam from the descriptor and parameterData');
        const message = await new Promise((resolve) => {
            node.port.onmessage = (e) => resolve(e.data);
        });
        check(message.direct === 'TypeError',
              'new AudioWorkletProcessor() outside a node construction: ' +
                  message.direct);
        check(JSON.stringify(message.options) ===
                  '{"numberOfInputs":1,"numberOfOutputs":1,' +
                  '"parameterData":{"x":0.5,"unknown":3},' +
                  '"processorOptions":{"list":[1,2]}}',
              'processor options: ' + JSON.stringify(message.options));

        // The options object is a dictionary conversion (CreateDataProperty):
        // an Object.prototype setter does not run.
        let setterRan = false;
        Object.defineProperty(Object.prototype, 'numberOfInputs', {
            set() {
                setterRan = true;
            },
            configurable: true,
        });
        let intercepted;
        try {
            intercepted = new AudioWorkletNode(context, 'echo');
        } finally {
            delete Object.prototype.numberOfInputs;
        }
        const received = await new Promise((resolve) => {
            intercepted.port.onmessage = (e) => resolve(e.data);
        });
        check(!setterRan && received.options.numberOfInputs === 1,
              'options with an Object.prototype setter: ' +
                  JSON.stringify(received.options));

        let thrown = 'no exception';
        try {
            new AudioWorkletNode(context, 'echo', {parameterData: {x: NaN}});
        } catch (e) {
            thrown = e.name;
        }
        check(thrown === 'TypeError', 'non-finite parameterData: ' + thrown);

        const processorError = (node) => new Promise((resolve) => {
            node.onprocessorerror = resolve;
        });
        const failed = await processorError(
            new AudioWorkletNode(context, 'throws'));
        check(failed instanceof ErrorEvent && failed.lineno > 0 &&
                  failed.message.includes('constructor failed'),
              'processorerror from the constructor: ' + failed.message +
                  ' at line ' + failed.lineno);
        const notCloned = await processorError(new AudioWorkletNode(
            context, 'echo', {processorOptions: {blob: new Blob([])}}));
        check(notCloned instanceof ErrorEvent,
              'processorerror for options a worklet cannot deserialize');

        // When a parameter array changes length, the output channel arrays
        // keep their identity.
        const ramp = new OfflineAudioContext(1, 1024, 8000);
        await ramp.audioWorklet.addModule(URL.createObjectURL(new Blob([`
            registerProcessor('reuse', class extends AudioWorkletProcessor {
                static get parameterDescriptors() {
                    return [{name: 'x', defaultValue: 0}];
                }
                process(inputs, outputs, parameters) {
                    const length = parameters.x.length;
                    if (this.length !== undefined && length !== this.length) {
                        this.port.postMessage({
                            lengths: this.length + '->' + length,
                            sameChannel: outputs[0][0] === this.channel,
                        });
                    }
                    this.length = length;
                    this.channel = outputs[0][0];
                    return true;
                }
            });`], {type: 'application/javascript'})));
        const reuse = new AudioWorkletNode(ramp, 'reuse');
        const level = reuse.parameters.get('x');
        level.setValueAtTime(0, 0);
        level.linearRampToValueAtTime(1, 384 / 8000);
        reuse.connect(ramp.destination);
        const changed = new Promise((resolve) => {
            reuse.port.onmessage = (e) => resolve(e.data);
        });
        await ramp.startRendering();
        const change = await changed;
        check(change.lengths === '128->1' && change.sameChannel,
              'output arrays after a parameter length change: ' +
                  JSON.stringify(change));
    },

    // Main-thread rendering: a graph slower than real time underruns
    // instead of starving the page's tasks.
    'audio-worklet-slow-render': async () => {
        if (typeof AudioWorkletNode !== 'function') {
            console.log('API_PROBE_SKIP built without AUDIO_WORKLET=1');
            return;
        }
        const context = new AudioContext();
        // Each process() call takes two quanta of real time.
        const busy = 2 * 1000 * context.renderQuantumSize / context.sampleRate;
        await context.audioWorklet.addModule(URL.createObjectURL(new Blob([`
            registerProcessor('slow', class extends AudioWorkletProcessor {
                constructor() {
                    super();
                    this.calls = 0;
                    this.port.onmessage = () => this.port.postMessage(this.calls);
                }
                process() {
                    this.calls++;
                    const end = Date.now() + ${busy};
                    while (Date.now() < end) {}
                    return true;
                }
            });`], {type: 'application/javascript'})));
        const node = new AudioWorkletNode(context, 'slow');
        node.connect(context.destination);
        await context.resume();
        const start = performance.now();
        await new Promise((resolve) => {
            let ticks = 0;
            const id = setInterval(() => {
                if (++ticks === 3) {
                    clearInterval(id);
                    resolve();
                }
            }, 300);
        });
        const elapsed = performance.now() - start;
        check(elapsed < 2000, 'three 300 ms intervals took ' + elapsed + ' ms');
        const calls = await new Promise((resolve) => {
            node.port.onmessage = (e) => resolve(e.data);
            node.port.postMessage('');
        });
        check(calls > 0, 'process() calls: ' + calls);
        await context.close();
    },

    // A constructor that throws leaves a real-time context on its render
    // thread, where currentTime advances while the main thread is busy.
    'audio-worklet-failed-node': async () => {
        if (typeof AudioWorkletNode !== 'function') {
            console.log('API_PROBE_SKIP built without AUDIO_WORKLET=1');
            return;
        }
        const context = new AudioContext();
        await context.audioWorklet.addModule(URL.createObjectURL(new Blob([`
            registerProcessor('p', class extends AudioWorkletProcessor {
                process() {
                    return true;
                }
            });`], {type: 'application/javascript'})));
        await context.resume();
        const failures = [
            [{channelCount: 0}, 'NotSupportedError'],
            [{processorOptions: {f() {}}}, 'DataCloneError'],
        ];
        for (const [options, expected] of failures) {
            let thrown = 'no exception';
            try {
                new AudioWorkletNode(context, 'p', options);
            } catch (e) {
                thrown = e.name;
            }
            check(thrown === expected,
                  'AudioWorkletNode expecting ' + expected + ': ' + thrown);
        }
        await new Promise((resolve) => setTimeout(resolve, 100));
        const start = context.currentTime;
        const end = performance.now() + 300;
        while (performance.now() < end) {}
        const advanced = context.currentTime - start;
        check(advanced > 0.1,
              'currentTime during a 300 ms busy loop: +' + advanced);
        await context.close();
    },

    // https://html.spec.whatwg.org/multipage/structured-data.html#structuredserializewithtransfer
    'structured-clone-transfer': async () => {
        const name = (fn) => {
            try {
                fn();
            } catch (e) {
                return e.name;
            }
            return 'no exception';
        };
        const buffer = new ArrayBuffer(8);
        const channel = new MessageChannel();
        const rejected = [
            [() => structuredClone(1, {transfer: [{}]}), 'a plain object'],
            [() => structuredClone(1, {transfer: [new Uint8Array(1)]}),
             'a typed array'],
            [() => structuredClone(1, {transfer: [buffer, buffer]}),
             'an ArrayBuffer listed twice'],
            [() => channel.port1.postMessage(1, [channel.port2, channel.port2]),
             'a MessagePort listed twice'],
            [() => postMessage(1, '*', [window]), 'a Window'],
        ];
        for (const [fn, label] of rejected) {
            const thrown = name(fn);
            check(thrown === 'DataCloneError', 'transfer of ' + label + ': ' +
                                                   thrown);
        }
        const moved = new MessageChannel();
        let thrown = name(() => postMessage(1, '*', [moved.port1]));
        check(thrown === 'no exception', 'transfer of a MessagePort: ' + thrown);
        thrown = name(() => postMessage(1, '*', [moved.port1]));
        check(thrown === 'DataCloneError',
              'transfer of a transferred MessagePort: ' + thrown);
        thrown = name(() => structuredClone(buffer, {transfer: [buffer]}));
        check(thrown === 'no exception', 'transfer of an ArrayBuffer: ' + thrown);
    },

    // AudioWorkletGlobalScope, registerProcessor() and addModule() paths
    // the webaudio WPT does not reach.
    'audio-worklet': async () => {
        if (typeof AudioWorklet !== 'function') {
            console.log('API_PROBE_SKIP built without AUDIO_WORKLET=1');
            return;
        }
        const module = (text, type = 'application/javascript') =>
            URL.createObjectURL(new Blob([text], {type}));
        const rejection = async (promise) => {
            try {
                await promise;
            } catch (e) {
                return e instanceof DOMException ? e.name
                    : e instanceof SyntaxError ? 'SyntaxError (JS)' : '' + e;
            }
            return 'resolved';
        };
        const context = new OfflineAudioContext(1, 128, 8000);
        check(context.audioWorklet === context.audioWorklet,
              'audioWorklet is [SameObject]');
        const scope = `
            const result = {};
            result.globals = ['AudioWorkletGlobalScope', 'WorkletGlobalScope',
                              'MessagePort', 'MessageEvent', 'window', 'Blob']
                .map((name) => typeof globalThis[name]).join();
            result.values = [currentFrame, currentTime, sampleRate,
                             renderQuantumSize].join();
            result.errors = [];
            const attempt = (fn) => {
                try {
                    fn();
                    result.errors.push('none');
                } catch (e) {
                    result.errors.push(e.name);
                }
            };
            const params = (list) => class {
                static get parameterDescriptors() { return list; }
            };
            attempt(() => registerProcessor('a', {}));
            attempt(() => registerProcessor('', class {}));
            attempt(() => registerProcessor('b', () => {}));
            attempt(() => registerProcessor('c', params(4)));
            attempt(() => registerProcessor('d', params([{}])));
            attempt(() => registerProcessor('e', params([{name: 'x'},
                                                         {name: 'x'}])));
            attempt(() => registerProcessor('f', params([
                {name: 'x', defaultValue: 2, maxValue: 1}])));
            attempt(() => registerProcessor('ok', class {}));
            attempt(() => registerProcessor('ok', class {}));
            attempt(() => globalThis.registerProcessor('ok2', class {}));
            import('./x.js').then(() => 'resolved', (e) => e.name)
                .then((imported) => { result.imported = imported; });
            globalThis.runs = (globalThis.runs || 0) + 1;
            port.onmessage = () => {
                result.runs = globalThis.runs;
                port.postMessage(result);
            };`;
        const url = module(scope);
        await context.audioWorklet.addModule(url);
        await context.audioWorklet.addModule(url);
        const result = await new Promise((resolve) => {
            context.audioWorklet.port.onmessage = (e) => resolve(e.data);
            context.audioWorklet.port.postMessage('');
        });
        check(result.globals ===
                  'function,function,function,function,undefined,undefined',
              'worklet globals: ' + result.globals);
        check(result.values === '0,0,8000,128',
              'currentFrame, currentTime, sampleRate, renderQuantumSize: ' +
                  result.values);
        check(result.errors.join() ===
                  'TypeError,NotSupportedError,TypeError,TypeError,' +
                  'TypeError,NotSupportedError,InvalidStateError,none,' +
                  'NotSupportedError,none',
              'registerProcessor errors: ' + result.errors.join());
        check(result.imported === 'TypeError',
              'import() in a worklet: ' + result.imported);
        check(result.runs === 1,
              'a module added twice runs once: ' + result.runs);
        const failures = [
            [context.audioWorklet.addModule('http://invalid:123$'),
             'SyntaxError'],
            [context.audioWorklet.addModule('/missing-module.js'), 'AbortError'],
            [context.audioWorklet.addModule(module('0', 'text/plain')),
             'AbortError'],
            [context.audioWorklet.addModule(module('not js(')),
             'SyntaxError (JS)'],
            [context.audioWorklet.addModule(module('import "./a.js";')),
             'AbortError'],
            // Evaluation errors are reported, not rejected.
            [context.audioWorklet.addModule(module('throw 1;')), 'resolved'],
        ];
        for (const [promise, expected] of failures) {
            const outcome = await rejection(promise);
            check(outcome === expected,
                  'addModule: expected ' + expected + ', got ' + outcome);
        }

        // The fetch obeys the context's document: its CSP (script-src), and
        // it fails once the document is no longer fully active. The errors
        // come from the frame's realm, so only their names are compared.
        const outcomeName = async (promise) => {
            try {
                await promise;
            } catch (e) {
                return e.name;
            }
            return 'resolved';
        };
        const framed = async (policy) => {
            const frame = document.createElement('iframe');
            frame.srcdoc = '<meta http-equiv="Content-Security-Policy" ' +
                           'content="' + policy + '">';
            await new Promise((resolve) => {
                frame.onload = resolve;
                document.documentElement.appendChild(frame);
            });
            const framedContext =
                new frame.contentWindow.OfflineAudioContext(1, 128, 8000);
            const outcome = await outcomeName(
                framedContext.audioWorklet.addModule(module('')));
            frame.remove();
            return outcome;
        };
        let outcome = await framed("script-src 'none'");
        check(outcome === 'AbortError',
              'addModule blocked by script-src: ' + outcome);
        outcome = await framed('script-src blob:');
        check(outcome === 'resolved',
              'addModule allowed by script-src: ' + outcome);

        const frame = document.createElement('iframe');
        document.documentElement.appendChild(frame);
        const detached =
            new frame.contentWindow.OfflineAudioContext(1, 128, 8000);
        const loaded =
            new frame.contentWindow.OfflineAudioContext(1, 128, 8000);
        // Printed by the worklet realm, which test_api_probes.py reads.
        await loaded.audioWorklet.addModule(module(`
            registerProcessor('late', class extends AudioWorkletProcessor {
                constructor() {
                    super();
                    console.log('API_PROBE_FAIL processor constructed for ' +
                                'a detached document');
                }
            });`));
        frame.remove();
        try {
            new AudioWorkletNode(loaded, 'late');
        } catch (e) {
        }
        await new Promise((resolve) => setTimeout(resolve, 300));
        check(detached.audioWorklet.port === detached.audioWorklet.port,
              'audioWorklet.port of a detached document is [SameObject]');
        outcome = await outcomeName(
            detached.audioWorklet.addModule(module('')));
        check(outcome === 'AbortError',
              'addModule in a detached document: ' + outcome);
    },
};

const group = groups[location.search.substring(1)];
if (!group) {
    check(false, 'unknown group ' + location.search);
    finish();
} else {
    group().catch((e) => check(false, 'exception ' + e)).then(finish);
}
</script>
