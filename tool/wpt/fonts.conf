<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font set the WPT runners pin for Starfish (tool/wpt/scripts/wpt_reftest.py
  starfish_env): the CI image's fonts only, so a measurement on a developer
  machine with extra CJK or emoji fonts matches the gate. ~/.fonts holds
  Ahem and SamsungOne from `ninja install_pixel_test_dep`. The system
  conf.d rules are kept so generic families resolve the same way they do
  in CI (DejaVu under FC_LANG=en).
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>~/.fonts</dir>
  <cachedir prefix="xdg">starfish-wpt-fontconfig</cachedir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
</fontconfig>
