<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Basic JavaScript module example</title>
    <style>
      canvas {
        border: 1px solid black;
      }
    </style>
    <script>var count = 0;</script>
    <script type="module">
    testAssert(count == 1)

    import { testImport } from "./import.js"
    testAssert(testImport(3) == 6);

    testEnd()
    </script>
    <script>
    testAssert(count == 0);
    count++;
    </script>
