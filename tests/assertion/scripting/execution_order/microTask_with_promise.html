<script id='script2'>
    testAssert(count == 2);
    console.log(`#${count++} second script tag executed`);
    let t = {};
    function loadScript(src) {
        return new Promise((resolve, reject) => {
            t.resolve = resolve;
            t.reject = reject;

            queueMicrotask(() => {
                testAssert(count == 3);
                console.log(`#${count++} micro task executed in second script tag`);
            });

            let script = document.createElement('script');
            script.id = 'script3'
            script.setAttribute("type", "text/javascript");
            script.setAttribute("src", src);
            document.head.appendChild(script);

        });
    }

    let p = loadScript('./microTask_with_promise_js3.js')
        .then((message) => {
            testAssert(count == 4);
            console.log(`#${count++} promise resolved in second script tag`);
        })
        .catch((error) => {
            console.error(error);
        });

    t.resolve('resolve');

</script>
