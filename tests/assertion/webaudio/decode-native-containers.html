async function run() {
    const context = new OfflineAudioContext(1, 128, 48000);
    for (const fixture of fixtures) {
        const binary = atob(fixture.data);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const truncated = bytes.buffer.slice(0, 12);
        const pending = context.decodeAudioData(bytes.buffer);
        console.assert(bytes.byteLength === 0, fixture.name + ': input detaches');
        const audio = await pending;
        console.assert(audio.sampleRate === 48000, fixture.name + ': sample rate');
        console.assert(audio.numberOfChannels === 1, fixture.name + ': channels');
        console.assert(audio.length === fixture.frames, fixture.name + ': frame count');
        let energy = 0;
        for (const value of audio.getChannelData(0)) {
            console.assert(Number.isFinite(value), fixture.name + ': finite PCM');
            energy += value * value;
        }
        console.assert(energy > 1, fixture.name + ': decoded signal');
        try {
            await context.decodeAudioData(truncated);
            console.assert(false, fixture.name + ': truncated container rejects');
        } catch (error) {
            console.assert(error.name === 'EncodingError', fixture.name + ': ' + error);
        }
    }
}
run().catch(error => console.assert(false, String(error))).then(testEnd);
