<!doctype html>
<meta charset="utf-8">
<title>Media element PCM reaches an AudioWorklet input</title>
<link rel="help" href="https://webaudio.github.io/web-audio-api/#AudioNode-actively-processing">
<body>
<script>
if (typeof testEnd !== "function") {
    window.testEnd = function () {
        document.title = "Media element worklet input complete";
    };
}

// A MediaElementAudioSourceNode is actively processing while its element
// plays, so the AudioWorkletNode it feeds gets its channels (an inactive
// source would leave inputs[0] empty), and same-origin PCM is not silenced.
if (typeof AudioWorkletNode !== "function") {
    console.log("skip: built without AUDIO_WORKLET=1");
    testEnd();
} else {
    const sampleRate = 4096;
    const frames = sampleRate * 2;
    const bytes = new Uint8Array(44 + frames * 2);
    const view = new DataView(bytes.buffer);
    function tag(offset, value) {
        for (let i = 0; i < 4; ++i)
            bytes[offset + i] = value.charCodeAt(i);
    }
    tag(0, "RIFF");
    view.setUint32(4, bytes.length - 8, true);
    tag(8, "WAVE");
    tag(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    tag(36, "data");
    view.setUint32(40, frames * 2, true);
    for (let i = 0; i < frames; ++i)
        view.setInt16(44 + i * 2, 8192, true);

    // A data: module loads from a file:// page in browsers too; a blob:
    // one is refused there.
    const processor = `
        registerProcessor("probe", class extends AudioWorkletProcessor {
            process(inputs) {
                const input = inputs[0];
                let peak = 0;
                for (const channel of input)
                    for (const value of channel)
                        peak = Math.max(peak, Math.abs(value));
                if (!this.sent && peak > 0.1) {
                    this.sent = true;
                    this.port.postMessage({ channels: input.length, peak });
                }
                return true;
            }
        });`;
    const mediaURL = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
    const audio = document.createElement("audio");
    audio.loop = true;
    const context = new AudioContext();
    let finished = false;
    let timer;
    function finish() {
        if (finished)
            return;
        finished = true;
        clearTimeout(timer);
        audio.pause();
        context.close();
        URL.revokeObjectURL(mediaURL);
        testEnd();
    }
    timer = setTimeout(function () {
        console.assert(false, "media PCM must reach the AudioWorklet input");
        finish();
    }, 5000);
    context.audioWorklet.addModule(
        "data:application/javascript," + encodeURIComponent(processor)
    ).then(function () {
        const source = context.createMediaElementSource(audio);
        const probe = new AudioWorkletNode(context, "probe");
        source.connect(probe).connect(context.destination);
        probe.port.onmessage = function (event) {
            console.assert(event.data.channels > 0,
                           "a playing element's source feeds the input");
            console.assert(event.data.peak > 0.1,
                           "decoded PCM reaches the worklet");
            finish();
        };
        audio.addEventListener("error", function () {
            console.assert(false, "valid same-origin WAV must load");
            finish();
        });
        audio.src = mediaURL;
        return audio.play();
    }).catch(function (error) {
        console.assert(false, "setup must succeed: " + error);
        finish();
    });
}
</script>
</body>
