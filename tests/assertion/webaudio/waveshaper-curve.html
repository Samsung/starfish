<!doctype html>
<meta charset="utf-8">
<title>WaveShaperNode curve can be set only once</title>
<script>
if (typeof testEnd !== "function") {
    window.testEnd = function () {
        document.title = "Web Audio wave shaper complete";
    };
}

if (typeof OfflineAudioContext !== "function" ||
    typeof WaveShaperNode !== "function") {
    testEnd();
} else {
    const context = new OfflineAudioContext(1, 128, 48000);
    const shaper = new WaveShaperNode(context);
    shaper.curve = new Float32Array([1, 2, 3]);
    let threw = false;
    try {
        shaper.curve = new Float32Array([3, 2, 1]);
    } catch (error) {
        threw = error.name === "InvalidStateError";
    }
    console.assert(threw, "A non-null shaping curve can be assigned only once");
    testEnd();
}
</script>
