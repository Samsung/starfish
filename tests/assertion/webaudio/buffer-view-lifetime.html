<!doctype html>
<meta charset="utf-8">
<title>AudioBuffer channel views retain their storage</title>
<script>
if (typeof testEnd !== 'function') window.testEnd = () => {};
async function run() {
    const context = new OfflineAudioContext(1, 128, 48000);
    function makeView() {
        const buffer = context.createBuffer(1, 128, 48000);
        const view = buffer.getChannelData(0);
        view[0] = 0.25;
        view[127] = 0.75;
        return view;
    }
    const view = makeView();
    // Allocation pressure is useful but does not guarantee a GC cycle.
    for (let batch = 0; batch < 8; batch++) {
        const pressure = [];
        for (let i = 0; i < 128; i++) pressure.push(new Float32Array(4096));
        await new Promise(resolve => setTimeout(resolve, 0));
    }
    console.assert(view[0] === 0.25 && view[127] === 0.75,
                   'channel data survives dropping its AudioBuffer wrapper');
    view[0] = 0.5;
    const copy = context.createBuffer(1, 128, 48000);
    copy.copyToChannel(view, 0);
    const source = context.createBufferSource();
    source.buffer = copy;
    source.connect(context.destination);
    source.start();
    const rendered = await context.startRendering();
    console.assert(rendered.getChannelData(0)[0] === 0.5 &&
                   rendered.getChannelData(0)[127] === 0.75,
                   'retained view remains writable and usable as PCM');
}
run().catch(error => console.assert(false, String(error))).then(testEnd);
</script>
