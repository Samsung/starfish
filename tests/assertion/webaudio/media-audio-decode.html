<!doctype html>
<meta charset="utf-8">
<title>HTML audio resource is decoded before metadata</title>
<body>
<script>
if (typeof testEnd !== "function") {
    window.testEnd = function () {
        document.title = "HTML audio resource decode complete";
    };
}

const sampleRate = 4096;
const frameCount = 2048;
const bytes = new Uint8Array(44 + frameCount * 2);
const view = new DataView(bytes.buffer);
function tag(offset, value) {
    for (let i = 0; i < 4; ++i)
        bytes[offset + i] = value.charCodeAt(i);
}
tag(0, "RIFF");
view.setUint32(4, bytes.length - 8, true);
tag(8, "WAVE");
tag(12, "fmt ");
view.setUint32(16, 16, true);
view.setUint16(20, 1, true);
view.setUint16(22, 1, true);
view.setUint32(24, sampleRate, true);
view.setUint32(28, sampleRate * 2, true);
view.setUint16(32, 2, true);
view.setUint16(34, 16, true);
tag(36, "data");
view.setUint32(40, frameCount * 2, true);
for (let i = 0; i < frameCount; ++i)
    view.setInt16(44 + i * 2, 4096, true);

const audio = document.createElement("audio");
let finished = false;
function finish() {
    if (finished)
        return;
    finished = true;
    testEnd();
}
audio.addEventListener("loadedmetadata", function () {
    console.assert(audio.readyState >= 1,
                   "metadata follows successful decoding");
    console.assert(Math.abs(audio.duration - frameCount / sampleRate) < 0.001,
                   "decoded duration follows resampled PCM length");
    finish();
});
audio.addEventListener("error", function () {
    console.assert(false, "valid wave data must load");
    finish();
});
setTimeout(function () {
    console.assert(finished, "decode must finish");
    finish();
}, 5000);
audio.src = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
audio.load();
</script>
</body>
