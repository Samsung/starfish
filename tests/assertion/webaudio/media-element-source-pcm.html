<!doctype html>
<meta charset="utf-8">
<title>Media element PCM enters the Web Audio graph</title>
<body>
<script>
if (typeof testEnd !== "function") {
    window.testEnd = function () {
        document.title = "Media element PCM complete";
    };
}

const sampleRate = 4096;
const frames = sampleRate * 2;
const bytes = new Uint8Array(44 + frames * 2);
const view = new DataView(bytes.buffer);
function tag(offset, value) {
    for (let i = 0; i < 4; ++i)
        bytes[offset + i] = value.charCodeAt(i);
}
tag(0, "RIFF");
view.setUint32(4, bytes.length - 8, true);
tag(8, "WAVE");
tag(12, "fmt ");
view.setUint32(16, 16, true);
view.setUint16(20, 1, true);
view.setUint16(22, 1, true);
view.setUint32(24, sampleRate, true);
view.setUint32(28, sampleRate * 2, true);
view.setUint16(32, 2, true);
view.setUint16(34, 16, true);
tag(36, "data");
view.setUint32(40, frames * 2, true);
for (let i = 0; i < frames; ++i)
    view.setInt16(44 + i * 2, 8192, true);

const audio = document.createElement("audio");
const context = new AudioContext();
const analyser = context.createAnalyser();
analyser.fftSize = 256;
const source = context.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(context.destination);
const values = new Float32Array(256);
let finished = false;
function finish() {
    if (finished)
        return;
    finished = true;
    audio.pause();
    context.close();
    testEnd();
}
function peak() {
    analyser.getFloatTimeDomainData(values);
    let maximum = 0;
    for (const value of values)
        maximum = Math.max(maximum, Math.abs(value));
    return maximum;
}
audio.addEventListener("loadedmetadata", function () {
    audio.play().then(function () {
        setTimeout(function () {
            console.assert(peak() > 0.1, "decoded PCM reaches the graph");
            audio.volume = 0;
            setTimeout(function () {
                console.assert(peak() === 0, "volume zero silences source");
                audio.volume = 1;
                audio.muted = true;
                setTimeout(function () {
                    console.assert(peak() === 0, "muted silences source");
                    audio.muted = false;
                    setTimeout(function () {
                        console.assert(peak() > 0.1,
                               "unmuting restores PCM output");
                        finish();
                    }, 100);
                }, 100);
            }, 100);
        }, 100);
    }, function () {
        console.assert(false, "play must succeed");
        finish();
    });
});
audio.addEventListener("error", function () {
    console.assert(false, "valid same-origin WAV must load");
    finish();
});
setTimeout(function () {
    console.assert(finished, "source test must finish");
    finish();
}, 5000);
audio.src = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
audio.load();
</script>
</body>
