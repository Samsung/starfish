<!doctype html>
<meta charset="utf-8">
<title>Web Audio pending decode on document unload</title>
<body>
<script>
if (typeof testEnd !== "function") {
    window.testEnd = function () {
        document.title = "Web Audio pending decode on document unload complete";
    };
}

if (typeof AudioContext !== "function") {
    testEnd();
} else {
    const frame = document.createElement("iframe");
    frame.onload = function () {
        const child = frame.contentWindow;
        const context = new child.AudioContext();
        const promises = [];
        for (let i = 0; i < 4; i++) {
            const input = new child.ArrayBuffer(2 * 1024 * 1024);
            promises.push(new Promise(function (resolve) {
                context.decodeAudioData(input).then(
                    function () { resolve(false); },
                    function (error) {
                        resolve(error.name === "InvalidStateError");
                    });
            }));
        }
        frame.remove();
        Promise.all(promises).then(function (results) {
            console.assert(results.every(Boolean),
                           "unloading rejects pending decodes with InvalidStateError");
            testEnd();
        });
    };
    document.body.appendChild(frame);
}
</script>
</body>
