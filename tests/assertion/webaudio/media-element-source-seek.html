<!doctype html>
<meta charset="utf-8">
<title>Media element PCM follows seeks in the graph</title>
<link rel="help" href="https://webaudio.github.io/web-audio-api/#MediaElementAudioSourceNode">
<link rel="help" href="https://html.spec.whatwg.org/multipage/media.html#seeking">
<body>
<script src="resources/pcm-recorder.js"></script>
<script>
if (typeof testEnd !== "function") {
    window.testEnd = function () {
        document.title = "Media element seek complete";
    };
}

// The element seeks as it would unrouted: after a seek, the graph hears the
// media from the new position on and none of the audio queued for the old
// one, both for a seek while playing and one while paused. The media is a
// ramp, so every sample tells its media time.
const mediaRate = 22050;
const seconds = 2;
const mediaFrames = mediaRate * seconds;
const low = 0.1;
const high = 0.9;
function mediaTime(value) {
    return (value - low) / (high - low) * seconds;
}
const bytes = new Uint8Array(44 + mediaFrames * 2);
const view = new DataView(bytes.buffer);
function tag(offset, value) {
    for (let i = 0; i < 4; ++i)
        bytes[offset + i] = value.charCodeAt(i);
}
tag(0, "RIFF");
view.setUint32(4, bytes.length - 8, true);
tag(8, "WAVE");
tag(12, "fmt ");
view.setUint32(16, 16, true);
view.setUint16(20, 1, true);
view.setUint16(22, 1, true);
view.setUint32(24, mediaRate, true);
view.setUint32(28, mediaRate * 2, true);
view.setUint16(32, 2, true);
view.setUint16(34, 16, true);
tag(36, "data");
view.setUint32(40, mediaFrames * 2, true);
for (let i = 0; i < mediaFrames; ++i) {
    const value = low + (high - low) * i / mediaFrames;
    view.setInt16(44 + i * 2, Math.round(value * 32768), true);
}

const audio = document.createElement("audio");
const context = new AudioContext();
const source = context.createMediaElementSource(audio);
const blocks = [];
const mediaURL = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
let finished = false;
function finish() {
    if (finished)
        return;
    finished = true;
    audio.pause();
    context.close();
    URL.revokeObjectURL(mediaURL);
    testEnd();
}

const playingTarget = 1.2;
const pausedTarget = 0.3;
// The demuxer may land on the packet after the target (WAV lands on it).
const landing = 0.1;
let playStart = 0;
let playedBeforeSeek = 0;
let ends = 0;
function check() {
    // Runs of continuous ramp: a seek, a pause, a gap or a skip of one render
    // quantum starts a new one.
    let runs = [];
    let run = null;
    let silent = 0;
    for (const block of blocks) {
        for (const value of block) {
            if (Math.abs(value) <= low / 2) {
                ++silent;
                run = null;
                continue;
            }
            if (!run || Math.abs(value - run.last) > 0.0005) {
                run = { first: value, last: value, frames: 0, silenceBefore: silent };
                runs.push(run);
            }
            run.last = value;
            ++run.frames;
            silent = 0;
        }
    }
    // A resampler may ring for a few samples where the media starts or stops;
    // those samples belong to the gap before the next run.
    let carried = 0;
    runs = runs.filter(r => {
        if (r.frames < 64) {
            carried += r.silenceBefore + r.frames;
            return false;
        }
        r.silenceBefore += carried;
        carried = 0;
        return true;
    });
    console.log("runs " + runs.map(r => mediaTime(r.first).toFixed(4) + "-" +
        mediaTime(r.last).toFixed(4) + "/" + r.frames + "@" + r.silenceBefore).join(" ") +
        " playedBeforeSeek=" + playedBeforeSeek.toFixed(3));
    console.assert(ends === 1, "one ended event");
    console.assert(runs.length === 3,
                   "only the seeks and the pause interrupt the media PCM");
    if (runs.length === 3) {
        const rate = context.sampleRate;
        console.assert(mediaTime(runs[0].last) <= playedBeforeSeek + 0.08,
                       "no audio queued before a seek plays after it");
        console.assert(mediaTime(runs[1].first) >= playingTarget - 0.005 &&
                       mediaTime(runs[1].first) <= playingTarget + landing,
                       "a seek while playing resumes at its target");
        // WAV seeks land on the exact sample, so this holds trivially here;
        // media-element-source-video.html checks the gap fill mid-frame.
        console.assert(runs[1].silenceBefore / rate >=
                       mediaTime(runs[1].first) - playingTarget - 0.01,
                       "the media between the target and the first packet is silent, not skipped");
        console.assert(mediaTime(runs[2].first) >= pausedTarget - 0.005 &&
                       mediaTime(runs[2].first) <= pausedTarget + landing,
                       "a seek while paused resumes at its target, not where the pause held");
        console.assert(mediaTime(runs[2].last) >= seconds - 0.01,
                       "playback after the seeks reaches the end");
        // Loose: an element may adapt its rate to the output for a while.
        for (const r of runs) {
            const span = (mediaTime(r.last) - mediaTime(r.first)) * rate;
            console.assert(Math.abs(r.frames - span) <= span * 0.03 + 512,
                           "a run holds its media span once");
        }
    }
    finish();
}
let seeks = 0;
audio.addEventListener("seeked", function () {
    ++seeks;
    if (seeks === 1) {
        setTimeout(function () {
            audio.pause();
            audio.currentTime = pausedTarget;
        }, 200);
    } else if (seeks === 2) {
        setTimeout(function () {
            audio.play();
        }, 100);
    }
});
audio.addEventListener("ended", function () {
    ++ends;
    // Leave room for the recorder's latency.
    setTimeout(check, 300);
});
audio.addEventListener("error", function () {
    console.assert(false, "valid same-origin WAV must load");
    finish();
});
audio.addEventListener("loadedmetadata", function () {
    playStart = performance.now();
    audio.play().then(function () {
        setTimeout(function () {
            playedBeforeSeek = (performance.now() - playStart) / 1000;
            audio.currentTime = playingTarget;
        }, 400);
    }, function () {
        console.assert(false, "play must succeed");
        finish();
    });
}, { once: true });
setTimeout(function () {
    console.assert(finished, "seek test must finish");
    finish();
}, 10000);
recordPCM(context, source, blocks).then(function () {
    audio.src = mediaURL;
    audio.load();
}, function (error) {
    console.assert(false, "the recorder must start: " + error);
    finish();
});
</script>
</body>
