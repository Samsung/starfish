<!doctype html>
<meta charset="utf-8">
<title>Media element PCM reaches the graph without gaps</title>
<link rel="help" href="https://webaudio.github.io/web-audio-api/#MediaElementAudioSourceNode">
<body>
<script>
if (typeof testEnd !== "function") {
    window.testEnd = function () {
        document.title = "Media element continuity complete";
    };
}

// The element behaves as it would unrouted, so every frame it plays reaches
// the graph once, resampled to the context rate: no frame is lost at play(),
// pause(), resume or the end, and none is played twice.
const mediaRate = 22050;
const mediaFrames = mediaRate / 2;
const bytes = new Uint8Array(44 + mediaFrames * 2);
const view = new DataView(bytes.buffer);
function tag(offset, value) {
    for (let i = 0; i < 4; ++i)
        bytes[offset + i] = value.charCodeAt(i);
}
tag(0, "RIFF");
view.setUint32(4, bytes.length - 8, true);
tag(8, "WAVE");
tag(12, "fmt ");
view.setUint32(16, 16, true);
view.setUint16(20, 1, true);
view.setUint16(22, 1, true);
view.setUint32(24, mediaRate, true);
view.setUint32(28, mediaRate * 2, true);
view.setUint16(32, 2, true);
view.setUint16(34, 16, true);
tag(36, "data");
view.setUint32(40, mediaFrames * 2, true);
for (let i = 0; i < mediaFrames; ++i)
    view.setInt16(44 + i * 2, 8192, true);

const audio = document.createElement("audio");
const context = new AudioContext();
const source = context.createMediaElementSource(audio);
const processor = context.createScriptProcessor(2048, 1, 1);
source.connect(processor);
processor.connect(context.destination);
const blocks = [];
processor.onaudioprocess = function (event) {
    blocks.push(new Float32Array(event.inputBuffer.getChannelData(0)));
};
const mediaURL = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
let finished = false;
function finish() {
    if (finished)
        return;
    finished = true;
    processor.onaudioprocess = null;
    audio.pause();
    context.close();
    URL.revokeObjectURL(mediaURL);
    testEnd();
}
function check() {
    // Runs of audible frames: one before pause() and one after play().
    const edge = 64;
    let audible = 0;
    let runs = 0;
    let off = 0;
    let inRun = false;
    let run = [];
    let worst = 0;
    function closeRun() {
        for (let i = edge; i < run.length - edge; ++i)
            worst = Math.max(worst, Math.abs(run[i] - 0.25));
        run = [];
    }
    for (const block of blocks) {
        for (const value of block) {
            if (Math.abs(value) > 0.125) {
                ++audible;
                if (!inRun)
                    ++runs;
                inRun = true;
                run.push(value);
            } else if (inRun) {
                inRun = false;
                closeRun();
            }
        }
    }
    closeRun();
    const expected = context.sampleRate * mediaFrames / mediaRate;
    console.log("audible=" + audible + " expected=" + expected +
                " runs=" + runs + " worst=" + worst);
    console.assert(Math.abs(audible - expected) <= expected * 0.02,
                   "every media frame reaches the graph once");
    console.assert(runs === 2, "only pause() interrupts the media PCM");
    console.assert(worst < 0.02, "the PCM is the media's, resampled");
    finish();
}
audio.addEventListener("ended", function () {
    // Leave room for the processor's block latency.
    setTimeout(check, 300);
});
audio.addEventListener("error", function () {
    console.assert(false, "valid same-origin WAV must load");
    finish();
});
audio.addEventListener("loadedmetadata", function () {
    audio.play().then(function () {
        setTimeout(function () {
            audio.pause();
            setTimeout(function () {
                audio.play();
            }, 150);
        }, 150);
    }, function () {
        console.assert(false, "play must succeed");
        finish();
    });
});
setTimeout(function () {
    console.assert(finished, "continuity test must finish");
    finish();
}, 8000);
audio.src = mediaURL;
audio.load();
</script>
</body>
