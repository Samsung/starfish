<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            --test: 12px;
        }
    </style>
</head>

<body>
    <div>
        <div id="target">
        </div>
    </div>
</body>
<script>
    function testStart() {
        {
            testAssert(window.getComputedStyle(target).getPropertyValue("--test") == '12px');
        }
        testEnd();
    }
    testStart();
</script>
</html>
