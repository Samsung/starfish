<!DOCTYPE html>
<!-- Verify that position:fixed inside a buffered scroll container keeps its
     viewport-relative position after the container scrolls.
     Our change gives the fixed element its own graphics buffer so the compositor
     can place it independently of the scroll container's buffer.
     Two invariants are checked:
       (a) fixed element stays at its original screen position after scroll,
       (b) the scroll content beneath it has actually moved. -->
<html>
<head>
<style>
  body { margin: 0; background: white; }
  #scroller {
    width: 300px;
    height: 200px;
    overflow: auto;
    /* no border / shadow / background */
  }
  #fixed-el {
    position: fixed;
    top: 10px;
    left: 10px;
    width: 60px;
    height: 60px;
    background: rgb(0, 0, 255);
    z-index: 10;
  }
  #red-block  { width: 300px; height: 300px; background: rgb(255, 0, 0); }
  #trail      { width: 300px; height: 300px; }
</style>
</head>
<body>
<div id="scroller">
  <div id="red-block"></div>  <!-- scroll content y=0..300, red -->
  <div id="trail"></div>
  <div id="fixed-el"></div>   <!-- viewport-fixed blue, 10,10..70,70 -->
</div>
<script>
  // Step 1 — before scroll.
  //   (40,40): inside fixed-el → blue.
  //   (150,150): below fixed-el, scroll offset 0+150=150, in red block → red.
  screenShot("scroll-buf-opt-fixed-test-1_before.png", function() {
    var before = "scroll-buf-opt-fixed-test-1_before.png";
    testAssert(checkPixelColor(before, 40, 40,  0,   0, 255, 255, 4)); // fixed-el blue
    testAssert(checkPixelColor(before, 150, 150, 255, 0, 0, 255, 4)); // red content

    // Step 2 — scroll 250 px.
    //   (40,40): fixed-el must still be blue (did not follow scroll).
    //   (150,150): scroll offset 250+150=400 > 300 → past red block → white.
    document.getElementById("scroller").scrollTop = 250;

    screenShot("scroll-buf-opt-fixed-test-1_after.png", function() {
      var after = "scroll-buf-opt-fixed-test-1_after.png";
      testAssert(checkPixelColor(after, 40,  40,  0,   0, 255, 255, 4)); // fixed-el still blue
      testAssert(checkPixelColor(after, 150, 150, 255, 255, 255, 255, 4)); // scrolled past red
      testEnd();
    });
  });
</script>
</body>
</html>
