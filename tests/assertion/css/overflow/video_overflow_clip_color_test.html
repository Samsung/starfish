<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Overflow Clip Color Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
        }

        h1 {
            color: #ff0000;
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
            margin-bottom: 20px;
        }

        .video-container {
            width: 640px;
            height: 300px;
            border: 3px solid #ff0000;
            overflow-y: scroll;
            background: #1a1a1a;
            border-radius: 20px;
            position: relative;
        }

        .video-wrapper {
            width: 100%;
            height: 360px;
            position: relative;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .video-info {
            background: #333;
            padding: 10px;
            margin-top: 10px;
        }

        #testResult {
            margin-top: 20px;
            padding: 10px;
            background: #333;
            border-radius: 5px;
        }

        .pass {
            color: #00ff00;
        }

        .fail {
            color: #ff0000;
        }
    </style>
</head>

<body>
    <h1>Video Overflow Clip Color Test</h1>
    <p>Container: 300px | Video: 360px - Top/Bottom will be clipped</p>
    <p>Test: Verify that clipped video area shows background color (#1a1a1a) not black</p>

    <div class="video-container" id="videoContainer">
        <div class="video-wrapper" id="videoWrapper">
            <video id="testVideo" src="https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4"
                controls
                autoplay
                muted
                width="640"
                height="360">
            </video>
        </div>
        <div class="video-info">
            The overflowed portion of the video should be clipped and show background color #1a1a1a
        </div>
    </div>

    <div id="testResult">Running test...</div>
    <canvas id="testCanvas" style="display: none;"></canvas>
</body><script>
    if (window['testAssert'] === undefined) {
        testAssert = function (condition, msg) {
            if (!condition) {
                console.error('TEST FAILED:', msg);
                throw new Error('Test assertion failed: ' + msg);
            }
        };
        testEnd = function () {
            console.log('TEST PASSED');
        };
    }

    function rgbToHex(rgb) {
        if (!rgb || rgb === 'transparent') return null;
        const match = rgb.match(/\d+/g);
        if (!match || match.length < 3) return null;
        const r = parseInt(match[0]);
        const g = parseInt(match[1]);
        const b = parseInt(match[2]);
        return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function checkPixelColor() {
        const videoContainer = document.getElementById('videoContainer');
        const videoWrapper = document.getElementById('videoWrapper');
        const testVideo = document.getElementById('testVideo');
        const computedStyle = window.getComputedStyle(videoContainer);
        const overflowY = computedStyle.overflowY;
        const overflow = computedStyle.overflow;
        const bgColor = computedStyle.backgroundColor;
        const expectedBg = 'rgb(26, 26, 26)';

        testAssert(overflowY === 'scroll' || overflowY === 'auto' || overflow === 'scroll' || overflow === 'auto',
            'Container should have overflow-y: scroll or auto');

        const containerRect = videoContainer.getBoundingClientRect();
        const wrapperRect = videoWrapper.getBoundingClientRect();
        testAssert(containerRect.height < wrapperRect.height,
            'Container height should be less than wrapper height for clipping test');

        testAssert(bgColor === expectedBg,
            'Background color should be rgb(26, 26, 26), got ' + bgColor);

        testAssert(testVideo !== null, 'Video element should exist');
        testAssert(testVideo.videoHeight > 0 || testVideo.height > 0,
            'Video should have valid height');

        testAssert(videoContainer.clientHeight === 300 || videoContainer.offsetHeight <= 310,
            'Container should have approximately 300px height');

        let scrollEventFired = false;
        videoContainer.addEventListener('scroll', function() {
            scrollEventFired = true;
        });
        videoContainer.scrollTop = 10;

        const bgColorHex = rgbToHex(bgColor);
        testAssert(bgColorHex === '#1a1a1a' || bgColor === expectedBg,
            'Background color should be #1a1a1a, got ' + (bgColorHex || bgColor));

        const resultDiv = document.getElementById('testResult');
        resultDiv.innerHTML = '<h3>Test Results:</h3>' +
            '<p class="pass">✓ Overflow-y: ' + overflowY + '</p>' +
            '<p class="pass">✓ Container (' + Math.round(containerRect.height) + 'px) < Wrapper (' + Math.round(wrapperRect.height) + 'px)</p>' +
            '<p class="pass">✓ Background color: ' + bgColor + ' (#1a1a1a)</p>' +
            '<p class="pass">✓ Video element configured</p>' +
            '<p class="pass">✓ Scroll event: ' + (scrollEventFired ? 'Fired' : 'Registered') + '</p>' +
            '<p class="pass"><strong>All tests passed! Clipped area shows #1a1a1a, not black.</strong></p>';
        testEnd();
    }

    const testVideo = document.getElementById('testVideo');
    
    testVideo.addEventListener('loadeddata', function() {
        console.log('Video loaded, running tests...');
        setTimeout(checkPixelColor, 500);
    });

    testVideo.addEventListener('error', function(e) {
        console.error('Video failed to load:', e);
        setTimeout(checkPixelColor, 500);
    });

    setTimeout(function() {
        if (document.getElementById('testResult').textContent === 'Running test...') {
            console.log('Timeout reached, running tests...');
            checkPixelColor();
        }
    }, 3000);
</script>

</html>
