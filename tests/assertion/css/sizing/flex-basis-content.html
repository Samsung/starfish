<!doctype html>
<meta charset="utf-8">
<title>flex-basis: content sizes an item by its content</title>
<style>
  body { margin: 0; }
  .row { display: flex; width: 400px; }
  .column { display: flex; flex-direction: column; width: 100px; height: 400px; }
  .item { flex: 0 0 content; }
  .child { width: 50px; height: 20px; }
  #row-item { width: 300px; }
  #column-item { height: 300px; }
  #longhand { flex-basis: content; flex-grow: 0; width: 300px; }
</style>
<div class="row"><div id="row-item" class="item"><div class="child"></div></div></div>
<div class="column"><div id="column-item" class="item"><div class="child"></div></div></div>
<div class="row"><div id="longhand"><div class="child"></div></div></div>
<script>
if (typeof testEnd !== "function") {
  var passed = 0, failed = 0;
  var nativeAssert = console.assert.bind(console);
  console.assert = function (condition, message) {
    if (condition) passed++;
    else { failed++; nativeAssert(false, message); }
  };
  window.testEnd = function () {
    document.title = (failed ? "FAIL" : "PASS") + " (" + passed + " passed, " + failed + " failed)";
    console.log("[flex-basis-content] " + document.title);
  };
}

function size(id, width, height) {
  var r = document.getElementById(id).getBoundingClientRect();
  console.assert(r.width === width && r.height === height,
    id + " should be " + width + "x" + height + ", got " + r.width + "x" + r.height);
}

window.onload = function () {
  var basis = getComputedStyle(document.getElementById("row-item")).flexBasis;
  console.assert(basis === "content", "flex-basis should compute to content, got " + basis);
  // The content gives the main size; the specified one is not used.
  size("row-item", 50, 20);
  size("column-item", 100, 20);
  size("longhand", 50, 20);
  testEnd();
};
</script>
