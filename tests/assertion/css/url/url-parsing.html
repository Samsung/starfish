<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS URL parsing</title>
    <link rel="help" href="https://www.w3.org/TR/css-syntax-3/#consume-string-token">
    <link rel="help" href="https://www.w3.org/TR/css-syntax-3/#consume-url-token">
    <link rel="help" href="https://www.w3.org/TR/css-syntax-3/#consume-escaped-code-point">
    <link rel="help" href="https://www.w3.org/TR/css-syntax-3/#consume-function">
    <link rel="help" href="https://drafts.csswg.org/cssom/#dom-cssstyledeclaration-setproperty">
</head>
<body>
<pre id="result"></pre>
<script>
(function () {
    'use strict';

    var properties = [
        { name: 'backgroundImage', cssName: 'background-image' },
        { name: 'borderImageSource', cssName: 'border-image-source' }
    ];
    var total = 0;
    var failures = 0;

    function assertEqual(actual, expected, description) {
        total++;
        var matches = actual === expected;
        if (!matches) {
            failures++;
        }
        console.assert(matches, description + ': expected ' +
            JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
    }

    // At EOF, CSS Syntax returns both the string token and the function.
    // A parenthesis inside a quoted string is part of its value.
    var validCases = [
        { name: 'complete URL',
          input: 'url("foo.png")', expected: 'url("foo.png")' },
        { name: 'unquoted URL at EOF',
          input: 'url(foo.png', expected: 'url("foo.png")' },
        { name: 'closed string followed by whitespace at EOF',
          input: 'url("foo.png" ', expected: 'url("foo.png")' },
        { name: 'unclosed double-quoted string at EOF',
          input: 'url("foo.png', expected: 'url("foo.png")' },
        { name: 'unclosed single-quoted string at EOF',
          input: "url('foo.png", expected: 'url("foo.png")' },
        // An escaped EOF becomes U+FFFD in a URL token, but the trailing
        // backslash is ignored when consuming a quoted string token.
        { name: 'escaped EOF in an unquoted URL',
          input: 'url(foo\\', expected: 'url("foo\uFFFD")' },
        { name: 'escaped EOF in a double-quoted string',
          input: 'url("foo\\', expected: 'url("foo")' },
        { name: 'escaped EOF in a single-quoted string',
          input: "url('foo\\", expected: 'url("foo")' },
        { name: 'parenthesis in a double-quoted string',
          input: 'url("a)b.png")', expected: 'url("a)b.png")' },
        { name: 'parenthesis in a single-quoted string',
          input: "url('a)b.png')", expected: 'url("a)b.png")' }
    ];

    // An unescaped newline produces a bad string token, unlike EOF.
    var invalidCases = [
        { name: 'extra closing parenthesis', input: 'url("foo.png"))' },
        { name: 'whitespace inside an unquoted URL', input: 'url(foo bar)' },
        { name: 'unescaped newline inside a string', input: 'url("foo.png\n")' }
    ];

    properties.forEach(function (property) {
        validCases.forEach(function (testCase) {
            var style = document.createElement('div').style;
            style[property.name] = testCase.input;
            assertEqual(style[property.name], testCase.expected,
                property.cssName + ' setter: ' + testCase.name);

            var declaration = document.createElement('div').style;
            declaration.cssText = property.cssName + ': ' + testCase.input;
            assertEqual(declaration[property.name], testCase.expected,
                property.cssName + ' cssText: ' + testCase.name);
        });

        invalidCases.forEach(function (testCase) {
            ['', 'url("sentinel.png")'].forEach(function (previous) {
                var style = document.createElement('div').style;
                style[property.name] = previous;
                style[property.name] = testCase.input;
                assertEqual(style[property.name], previous,
                    property.cssName + ' preserves ' + JSON.stringify(previous) +
                    ': ' + testCase.name);
            });
        });
    });

    document.getElementById('result').textContent =
        (total - failures) + ' passed; ' + failures + ' failed.';
    document.title = (failures ? 'FAIL' : 'PASS') + ': CSS URL parsing';
    if (typeof testEnd === 'function') {
        testEnd();
    }
}());
</script>
</body>
</html>
