<!doctype html>
<meta charset="utf-8">
<title>Math functions in outline-offset</title>
<link rel="help" href="https://www.w3.org/TR/css-ui-3/#outline-offset">
<style>
#target { font-size: 40px; width: 100px; height: 20px; outline: 2px solid black; }
</style>
<div id="target"></div>
<script>
if (typeof testEnd !== 'function') {
  window.testEnd = function () { console.log('Test complete'); };
}
var target = document.getElementById('target');
[['calc(10px + 5px)', '15px'],
 ['calc(10px + 0.5em)', '30px'],
 ['calc(10px - 0.5em)', '-10px'],
 ['calc(-1 * 4px)', '-4px']
].forEach(function (values) {
  target.style.outlineOffset = values[0];
  console.assert(target.style.outlineOffset !== '', 'Accepted: ' + values[0]);
  console.assert(getComputedStyle(target).outlineOffset === values[1],
    'Computed outline-offset: ' + values[0]);
});
['calc(10%)', 'calc(1px + 10%)'].forEach(function (value) {
  target.style.outlineOffset = '';
  target.style.outlineOffset = value;
  console.assert(target.style.outlineOffset === '', 'Reject non-length: ' + value);
});
testEnd();
</script>
