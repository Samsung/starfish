<!DOCTYPE html>
<meta charset="utf-8">
<title>Background positions inherit without background images</title>
<link rel="help" href="https://drafts.csswg.org/css-backgrounds-3/#the-background-position">
<div id="parent" style="background-position: 10% 5px, 30% 15px">
  <div id="child" style="background-position: inherit"></div>
</div>
<script>
if (typeof testEnd !== 'function') {
  let pass = 0, fail = 0;
  const nativeAssert = console.assert.bind(console);
  console.assert = (condition, message) => {
    if (condition) {
      ++pass;
    } else {
      ++fail;
      nativeAssert(false, message);
    }
  };
  window.testEnd = () => {
    const verdict = (fail ? 'FAIL' : 'PASS') + ' (' + pass + ' passed, ' + fail + ' failed)';
    console.log('[background-position-inherit] ' + verdict);
    document.title = verdict;
  };
}

const ancestor = document.getElementById('parent');
const child = document.getElementById('child');

function check(expected) {
  // Flush style so this checks propagation from the updated parent.
  void document.body.offsetWidth;
  const actual = getComputedStyle(child).backgroundPosition;
  console.assert(actual === expected, 'Expected ' + expected + ', got ' + actual);
}

check('10% 5px, 30% 15px');
ancestor.style.backgroundPosition = '10% 5px, 10% 5px';
check('10% 5px, 10% 5px');
ancestor.style.backgroundPosition = '10% 5px';
check('10% 5px');
testEnd();
</script>
