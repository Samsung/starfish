<!DOCTYPE html>
<html>
<head>
<title>A box-shadow that grows inside a layer grows the layer</title>
<link rel="help" href="https://drafts.csswg.org/css-backgrounds/#box-shadow">
<style>
  body { margin: 0; background: white; }
  /* The translucent mask gives #layer a buffer of its own, sized to what
     it paints. The shadow paints outside the border box, so when it moves
     further out the buffer has to grow with it; the padding keeps the
     shadow inside the mask's border-box clip. */
  #layer { position: absolute; left: 70px; top: 70px; width: 300px;
           padding: 30px;
           mask-image: linear-gradient(black 50%, rgba(0, 0, 0, 0.99)); }
  #box { height: 40px; background: blue; box-shadow: 1px 0 0 0 green; }
  #box.far { box-shadow: 20px 0 0 0 green; }
</style>
</head>
<body>
<div id="layer"><div id="box"></div></div>
<script>
  var shot = "box-shadow-grown-in-layer.html.png";
  function change() {
    document.getElementById("box").className = "far";
  }
  window.onload = function () {
    if (typeof screenShot !== "function") {
      change();
      return;
    }
    setTimeout(function () {
      // The first capture settles the layer's rect from the 1px shadow.
      screenShot(shot, function () {
        change();
        screenShot(shot, function () {
          // The box is at 100..400 x 100..140, its shadow now reaches 420.
          console.assert(checkPixelColors(shot, [
            { x: 405, y: 120, r: 0, g: 128, b: 0, a: 255 },
            { x: 415, y: 120, r: 0, g: 128, b: 0, a: 255 },
            { x: 425, y: 120, r: 255, g: 255, b: 255, a: 255 },
          ], 3), "whole shadow painted");
          testEnd();
        });
      });
    }, 300);
  };
</script>
</body>
</html>
