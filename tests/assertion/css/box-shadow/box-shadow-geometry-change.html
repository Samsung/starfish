<!DOCTYPE html>
<html>
<head>
<title>A box-shadow whose spread or inset changes is repainted</title>
<link rel="help" href="https://drafts.csswg.org/css-backgrounds/#box-shadow">
<style>
  body { margin: 0; background: white; }
  .box { position: absolute; left: 100px; width: 300px; height: 40px;
         background: blue; }
  #spread { top: 100px; box-shadow: 0 0 0 1px green; }
  #spread.changed { box-shadow: 0 0 0 10px green; }
  #inset { top: 200px; box-shadow: 0 0 0 10px green; }
  #inset.changed { box-shadow: inset 0 0 0 10px green; }
</style>
</head>
<body>
<div class="box" id="spread"></div>
<div class="box" id="inset"></div>
<script>
  var shot = "box-shadow-geometry-change.html.png";
  function change() {
    // Only the spread, and only the inset keyword, differ from the old value.
    document.getElementById("spread").className = "box changed";
    document.getElementById("inset").className = "box changed";
  }
  window.onload = function () {
    if (typeof screenShot !== "function") {
      change();
      return;
    }
    setTimeout(function () {
      screenShot(shot, function () {
        change();
        screenShot(shot, function () {
          // #spread is at 100..400 x 100..140: the ring is 10px around it.
          console.assert(checkPixelColors(shot, [
            { x: 95, y: 120, r: 0, g: 128, b: 0, a: 255 },
            { x: 405, y: 120, r: 0, g: 128, b: 0, a: 255 },
            { x: 250, y: 95, r: 0, g: 128, b: 0, a: 255 },
            { x: 250, y: 145, r: 0, g: 128, b: 0, a: 255 },
          ], 3), "grown spread painted");
          // #inset is at 100..400 x 200..240: the ring moved inside it.
          console.assert(checkPixelColors(shot, [
            { x: 95, y: 220, r: 255, g: 255, b: 255, a: 255 },
            { x: 105, y: 220, r: 0, g: 128, b: 0, a: 255 },
            { x: 395, y: 220, r: 0, g: 128, b: 0, a: 255 },
          ], 3), "shadow turned inset");
          testEnd();
        });
      });
    }, 300);
  };
</script>
</body>
</html>
