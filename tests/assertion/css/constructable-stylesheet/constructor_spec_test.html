<!DOCTYPE html>
<html>

<head>
    <title>CSSStyleSheet Constructor Spec Test</title>
</head>

<body>
    <script>
        // Test: CSSStyleSheet constructor per spec
        // https://drafts.csswg.org/cssom/#create-a-constructed-cssstylesheet
        // https://drafts.csswg.org/cssom/#dom-cssstylesheet-cssstylesheet

        // ============================================
        // Test 1: Basic constructor - check default values
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            // 1.1: instanceof check
            console.assert(sheet instanceof CSSStyleSheet, 'sheet should be instance of CSSStyleSheet');

            // 1.2: ownerNode should be null (constructable stylesheets have no owner)
            console.assert(sheet.ownerNode === null, 'ownerNode should be null');

            // 1.3: ownerRule should be null
            console.assert(sheet.ownerRule === null, 'ownerRule should be null');

            // 1.4: title should be null
            console.assert(sheet.title === null, 'title should be null');

            // 1.5: disabled should be false by default
            console.assert(sheet.disabled === false, 'disabled should be false by default');

            // 1.6: media should be MediaList with empty mediaText
            console.assert(sheet.media !== null, 'media should not be null');
            console.assert(sheet.media instanceof MediaList, 'media should be MediaList instance');
            console.assert(sheet.media.mediaText === '', 'media.mediaText should be empty string');

            // 1.7: cssRules should be empty
            console.assert(sheet.cssRules.length === 0, 'cssRules.length should be 0');
        } catch (e) {
            console.error('Test 1: Error - ' + e.message);
        }

        // ============================================
        // Test 2: Constructor with disabled option
        // ============================================
        try {
            const sheet = new CSSStyleSheet({ disabled: true });
            console.assert(sheet.disabled === true, 'disabled should be true');
        } catch (e) {
            console.error('Test 2: Error - ' + e.message);
        }

        // ============================================
        // Test 3: Constructor with media option (string)
        // ============================================
        try {
            const sheet = new CSSStyleSheet({ media: 'screen' });

            // 3.1: media should be MediaList instance
            console.assert(sheet.media instanceof MediaList, 'media should be MediaList instance');

            // 3.2: mediaText should match the input
            console.assert(sheet.media.mediaText === 'screen', 'media.mediaText should be "screen"');
        } catch (e) {
            console.error('Test 3: Error - ' + e.message);
        }

        // ============================================
        // Test 4: Constructor with complex media query
        // ============================================
        try {
            const sheet = new CSSStyleSheet({ media: 'screen and (min-width: 500px) and (max-width: 1200px)' });

            console.assert(sheet.media instanceof MediaList, 'media should be MediaList instance');
            var mediaText = sheet.media.mediaText;
            console.assert(mediaText.indexOf('screen') !== -1, 'mediaText should contain "screen"');
            console.assert(mediaText.indexOf('min-width') !== -1, 'mediaText should contain "min-width"');
        } catch (e) {
            console.error('Test 4: Error - ' + e.message);
        }

        // ============================================
        // Test 5: Constructor with empty options
        // ============================================
        try {
            const sheet = new CSSStyleSheet({});

            console.assert(sheet.disabled === false, 'disabled should be false (default)');
            console.assert(sheet.media.mediaText === '', 'media.mediaText should be empty (default)');
            console.assert(sheet.ownerNode === null, 'ownerNode should be null');
            console.assert(sheet.title === null, 'title should be null');
        } catch (e) {
            console.error('Test 5: Error - ' + e.message);
        }

        // ============================================
        // Test 6: Constructor with media: MediaList object
        // ============================================
        try {
            const sourceSheet = new CSSStyleSheet({ media: 'print and (color)' });
            const mediaList = sourceSheet.media;
            const sheet = new CSSStyleSheet({ media: mediaList });

            console.assert(sheet.media instanceof MediaList, 'media should be MediaList instance');
            console.assert(sheet.media.mediaText.indexOf('print') !== -1, 'mediaText should contain "print"');
        } catch (e) {
            console.error('Test 6: Error - ' + e.message);
        }

        // ============================================
        // Test 7: Constructor with multiple options
        // ============================================
        try {
            const sheet = new CSSStyleSheet({
                disabled: true,
                media: 'all'
            });

            console.assert(sheet.disabled === true, 'disabled should be true');
            console.assert(sheet.media.mediaText === 'all', 'media.mediaText should be "all"');
            console.assert(sheet.ownerNode === null, 'ownerNode should be null');
            console.assert(sheet.title === null, 'title should be null');
        } catch (e) {
            console.error('Test 7: Error - ' + e.message);
        }

        // ============================================
        // Test 8: Verify cssRules is live CSSRuleList
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            const rules = sheet.cssRules;
            console.assert(rules instanceof CSSRuleList, 'cssRules should be CSSRuleList instance');
            console.assert(rules.length === 0, 'cssRules.length should be 0 initially');

            // Insert a rule and verify cssRules updates
            sheet.insertRule('div { color: red; }', 0);
            console.assert(rules.length === 1, 'cssRules.length should be 1 after insertRule');
            console.assert(rules[0] instanceof CSSStyleRule, 'cssRules[0] should be CSSStyleRule');
        } catch (e) {
            console.error('Test 8: Error - ' + e.message);
        }

        // ============================================
        // Test 9: Verify insertRule returns index
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            const index1 = sheet.insertRule('p { margin: 0; }', 0);
            console.assert(index1 === 0, 'insertRule should return 0');

            const index2 = sheet.insertRule('div { padding: 0; }', 1);
            console.assert(index2 === 1, 'insertRule should return 1');

            const index3 = sheet.insertRule('span { border: none; }', 0);
            console.assert(index3 === 0, 'insertRule at position 0 should return 0');
        } catch (e) {
            console.error('Test 9: Error - ' + e.message);
        }

        // ============================================
        // Test 10: Verify deleteRule works
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            sheet.insertRule('div { color: red; }', 0);
            sheet.insertRule('p { color: blue; }', 1);
            console.assert(sheet.cssRules.length === 2, 'Should have 2 rules');

            sheet.deleteRule(0);
            console.assert(sheet.cssRules.length === 1, 'Should have 1 rule after delete');
            console.assert(sheet.cssRules[0].selectorText === 'p', 'Remaining rule should be p');
        } catch (e) {
            console.error('Test 10: Error - ' + e.message);
        }

        // ============================================
        // Test 11: Exception - insertRule with invalid index
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            var caughtException = false;
            try {
                sheet.insertRule('div { color: red; }', 100);
            } catch (e) {
                caughtException = true;
                console.assert(e.name === 'IndexSizeError', 'Exception should be IndexSizeError');
            }
            console.assert(caughtException, 'Should throw exception for invalid index');
        } catch (e) {
            console.error('Test 11: Error - ' + e.message);
        }

        // ============================================
        // Test 12: Exception - deleteRule with invalid index
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            var caughtException = false;
            try {
                sheet.deleteRule(0);
            } catch (e) {
                caughtException = true;
                console.assert(e.name === 'IndexSizeError', 'Exception should be IndexSizeError');
            }
            console.assert(caughtException, 'Should throw exception for invalid index');
        } catch (e) {
            console.error('Test 12: Error - ' + e.message);
        }

        // ============================================
        // Test 13: Verify parentStyleSheet is null
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            console.assert(sheet.parentStyleSheet === null, 'parentStyleSheet should be null');
        } catch (e) {
            console.error('Test 13: Error - ' + e.message);
        }

        // ============================================
        // Test 14: Verify type is "text/css"
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            console.assert(sheet.type === 'text/css', 'type should be "text/css"');
        } catch (e) {
            console.error('Test 14: Error - ' + e.message);
        }

        // ============================================
        // Test 15: Verify href is null or empty
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            console.assert(sheet.href === null || sheet.href === '', 'href should be null or empty');
        } catch (e) {
            console.error('Test 15: Error - ' + e.message);
        }

        // ============================================
        // Test 16: CSSStyleRule properties after insertRule
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            sheet.insertRule('.test-class { color: red; background: blue; }', 0);
            const rule = sheet.cssRules[0];

            console.assert(rule instanceof CSSStyleRule, 'rule should be CSSStyleRule');
            console.assert(rule.selectorText === '.test-class', 'selectorText should be ".test-class"');
            console.assert(rule.style.color === 'red', 'style.color should be "red"');
            console.assert(rule.style.background === 'blue', 'style.background should be "blue"');
            console.assert(rule.parentStyleSheet === sheet, 'parentStyleSheet should be the sheet');
        } catch (e) {
            console.error('Test 16: Error - ' + e.message);
        }

        // ============================================
        // Test 17: Multiple rules maintain order
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            sheet.insertRule('a { color: red; }', 0);
            sheet.insertRule('b { color: green; }', 1);
            sheet.insertRule('c { color: blue; }', 2);

            console.assert(sheet.cssRules.length === 3, 'Should have 3 rules');
            console.assert(sheet.cssRules[0].selectorText === 'a', 'First rule should be "a"');
            console.assert(sheet.cssRules[1].selectorText === 'b', 'Second rule should be "b"');
            console.assert(sheet.cssRules[2].selectorText === 'c', 'Third rule should be "c"');
        } catch (e) {
            console.error('Test 17: Error - ' + e.message);
        }

        // ============================================
        // Test 18: Insert rule at specific position
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            sheet.insertRule('a { color: red; }', 0);
            sheet.insertRule('c { color: blue; }', 1);
            sheet.insertRule('b { color: green; }', 1); // Insert between a and c

            console.assert(sheet.cssRules.length === 3, 'Should have 3 rules');
            console.assert(sheet.cssRules[0].selectorText === 'a', 'First rule should be "a"');
            console.assert(sheet.cssRules[1].selectorText === 'b', 'Second rule should be "b"');
            console.assert(sheet.cssRules[2].selectorText === 'c', 'Third rule should be "c"');
        } catch (e) {
            console.error('Test 18: Error - ' + e.message);
        }


        if (typeof testEnd === 'function') {
            testEnd();
        }
    </script>
</body>

</html>
