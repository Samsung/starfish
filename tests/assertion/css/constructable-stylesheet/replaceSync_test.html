<!DOCTYPE html>
<html>

<head>
    <title>CSSStyleSheet replaceSync Test</title>
</head>

<body>
    <script>
        // Test: CSSStyleSheet.replaceSync() per spec
        // https://drafts.csswg.org/cssom/#dom-cssstylesheet-replacesync

        // ============================================
        // TC1: replaceSync on empty sheet - adds rules
        // ============================================
        try {
            const sheet = new CSSStyleSheet();
            sheet.replaceSync('div { color: red; } p { margin: 0; }');

            console.assert(sheet.cssRules.length === 2, 'TC1.1: should have 2 rules after replaceSync');
            console.assert(sheet.cssRules[0] instanceof CSSStyleRule, 'TC1.2: first rule should be CSSStyleRule');
            console.assert(sheet.cssRules[0].selectorText === 'div', 'TC1.3: first rule selector should be "div"');
            console.assert(sheet.cssRules[1].selectorText === 'p', 'TC1.4: second rule selector should be "p"');
        } catch (e) {
            console.error('TC1: Error - ' + e.message);
        }

        // ============================================
        // TC2: replaceSync replaces existing rules
        // ============================================
        try {
            const sheet = new CSSStyleSheet();
            sheet.insertRule('a { color: blue; }', 0);
            sheet.insertRule('b { color: green; }', 1);
            console.assert(sheet.cssRules.length === 2, 'TC2.1: should have 2 rules before replaceSync');

            sheet.replaceSync('span { padding: 10px; }');

            console.assert(sheet.cssRules.length === 1, 'TC2.2: should have 1 rule after replaceSync');
            console.assert(sheet.cssRules[0].selectorText === 'span', 'TC2.3: rule selector should be "span"');
        } catch (e) {
            console.error('TC2: Error - ' + e.message);
        }

        // ============================================
        // TC3: replaceSync with empty string removes all rules
        // ============================================
        try {
            const sheet = new CSSStyleSheet();
            sheet.insertRule('div { color: red; }', 0);

            sheet.replaceSync('');

            console.assert(sheet.cssRules.length === 0, 'TC3.1: should have 0 rules after replaceSync with empty string');
        } catch (e) {
            console.error('TC3: Error - ' + e.message);
        }

        // ============================================
        // TC4: replaceSync on non-constructed sheet throws NotAllowedError
        // ============================================
        try {
            // Get a non-constructed stylesheet from a style element
            const styleEl = document.createElement('style');
            styleEl.textContent = 'div { color: red; }';
            document.head.appendChild(styleEl);

            const sheet = styleEl.sheet;
            var caughtException = false;
            try {
                sheet.replaceSync('p { color: blue; }');
            } catch (e) {
                caughtException = true;
                console.assert(e.name === 'NotAllowedError', 'TC4.1: exception should be NotAllowedError, got: ' + e.name);
            }
            console.assert(caughtException, 'TC4.2: should throw exception for non-constructed sheet');

            // Verify original rules are unchanged
            console.assert(sheet.cssRules.length === 1, 'TC4.3: original rules should be unchanged after NotAllowedError');

            document.head.removeChild(styleEl);
        } catch (e) {
            console.error('TC4: Error - ' + e.message);
        }

        // ============================================
        // TC5: replaceSync - CSSOM access after replacement
        // ============================================
        try {
            const sheet = new CSSStyleSheet();
            sheet.replaceSync('.test { color: red; background: blue; }');

            console.assert(sheet.cssRules.length === 1, 'TC5.1: should have 1 rule');
            const rule = sheet.cssRules[0];
            console.assert(rule instanceof CSSStyleRule, 'TC5.2: rule should be CSSStyleRule');
            console.assert(rule.selectorText === '.test', 'TC5.3: selectorText should be ".test"');
            console.assert(rule.style.color === 'red', 'TC5.4: style.color should be "red"');
            console.assert(rule.style.background === 'blue', 'TC5.5: style.background should be "blue"');
            console.assert(rule.parentStyleSheet === sheet, 'TC5.6: parentStyleSheet should be the sheet');
        } catch (e) {
            console.error('TC5: Error - ' + e.message);
        }

        // ============================================
        // TC6: replaceSync - old CSSRule object still references original sheet
        // Spec does not require parentStyleSheet to be nulled on replaced rules.
        // The old CSSRule wrapper may still reference the sheet.
        // ============================================
        try {
            const sheet = new CSSStyleSheet();
            sheet.insertRule('div { color: red; }', 0);
            const oldRule = sheet.cssRules[0];
            console.assert(oldRule.parentStyleSheet === sheet, 'TC6.1: parentStyleSheet should be sheet before replaceSync');

            sheet.replaceSync('p { color: blue; }');

            // After replaceSync, the sheet has new rules.
            // The old CSSRule wrapper's parentStyleSheet is not guaranteed to be null
            // per spec - "Replace the rules" does not invoke "remove a CSS rule" algorithm.
            // Just verify the sheet has the new rules.
            console.assert(sheet.cssRules.length === 1, 'TC6.2: sheet should have 1 new rule after replaceSync');
            console.assert(sheet.cssRules[0].selectorText === 'p', 'TC6.3: new rule selector should be "p"');
        } catch (e) {
            console.error('TC6: Error - ' + e.message);
        }

        // ============================================
        // TC7: replaceSync with complex CSS (media query, keyframes)
        // ============================================
        try {
            const sheet = new CSSStyleSheet();
            sheet.replaceSync('@media screen and (min-width: 500px) { div { color: red; } } @keyframes fade { from { opacity: 0; } to { opacity: 1; } }');

            console.assert(sheet.cssRules.length === 2, 'TC7.1: should have 2 rules (media + keyframes)');

            // Verify media rule
            const mediaRule = sheet.cssRules[0];
            console.assert(mediaRule instanceof CSSMediaRule, 'TC7.2: first rule should be CSSMediaRule');
            console.assert(mediaRule.conditionText.indexOf('screen') !== -1, 'TC7.3: media conditionText should contain "screen"');
            console.assert(mediaRule.cssRules.length === 1, 'TC7.4: media rule should have 1 nested rule');
            console.assert(mediaRule.cssRules[0].selectorText === 'div', 'TC7.5: nested rule selector should be "div"');
            console.assert(mediaRule.cssRules[0].style.color === 'red', 'TC7.6: nested rule color should be "red"');

            // Verify keyframes rule
            const keyframesRule = sheet.cssRules[1];
            console.assert(keyframesRule instanceof CSSKeyframesRule, 'TC7.7: second rule should be CSSKeyframesRule');
            console.assert(keyframesRule.name === 'fade', 'TC7.8: keyframes name should be "fade"');
            console.assert(keyframesRule.cssRules.length === 2, 'TC7.9: keyframes should have 2 keyframes (from, to)');
        } catch (e) {
            console.error('TC7: Error - ' + e.message);
        }

        // ============================================
        // TC8: replaceSync preserves sheet identity (media, disabled)
        // ============================================
        try {
            const sheet = new CSSStyleSheet({ media: 'screen', disabled: true });
            sheet.replaceSync('div { color: red; }');

            console.assert(sheet.media.mediaText === 'screen', 'TC8.1: media should be preserved after replaceSync');
            console.assert(sheet.disabled === true, 'TC8.2: disabled should be preserved after replaceSync');
            console.assert(sheet.ownerNode === null, 'TC8.3: ownerNode should still be null');
            console.assert(sheet.title === null, 'TC8.4: title should still be null');
        } catch (e) {
            console.error('TC8: Error - ' + e.message);
        }

        // ============================================
        // TC9: replaceSync multiple times in sequence
        // ============================================
        try {
            const sheet = new CSSStyleSheet();

            sheet.replaceSync('a { color: red; }');
            console.assert(sheet.cssRules.length === 1, 'TC9.1: should have 1 rule after first replaceSync');

            sheet.replaceSync('b { color: green; } c { color: blue; }');
            console.assert(sheet.cssRules.length === 2, 'TC9.2: should have 2 rules after second replaceSync');
            console.assert(sheet.cssRules[0].selectorText === 'b', 'TC9.3: first rule should be "b"');

            sheet.replaceSync('');
            console.assert(sheet.cssRules.length === 0, 'TC9.4: should have 0 rules after empty replaceSync');
        } catch (e) {
            console.error('TC9: Error - ' + e.message);
        }

        // ============================================
        // TC10: replaceSync with invalid CSS - valid rules still added
        // ============================================
        try {
            const sheet = new CSSStyleSheet();
            // CSSParser should parse valid rules and skip invalid ones
            sheet.replaceSync('div { color: red; } {{{invalid p { margin: 0; }');

            // At minimum, the valid rule should be present
            // Exact behavior depends on CSSParser error recovery
            console.assert(sheet.cssRules.length >= 1, 'TC10.1: should have at least 1 valid rule');
        } catch (e) {
            console.error('TC10: Error - ' + e.message);
        }

        // ============================================
        // TC11: Spec Step 4 - completely invalid CSS results in empty sheet
        // "parse a stylesheet" always returns a list of rules (possibly empty).
        // Step 4 ("If rules is not a list of rules") only applies to extreme
        // edge cases (e.g., encoding errors), not normal parse failures.
        // For completely invalid CSS, the parser returns an empty list,
        // and Step 5 (remove all rules) + Step 6 (add each rule) applies,
        // resulting in an empty sheet.
        // ============================================
        try {
            const sheet = new CSSStyleSheet();
            sheet.insertRule('div { color: red; }', 0);
            sheet.insertRule('p { margin: 0; }', 1);
            console.assert(sheet.cssRules.length === 2, 'TC11.1: should have 2 rules before replaceSync');

            // Completely unparseable input - parser returns empty rule list
            sheet.replaceSync('{{{}}}');

            // Empty rule list from parser → all existing rules removed
            console.assert(sheet.cssRules.length === 0, 'TC11.2: should have 0 rules after replaceSync with completely invalid CSS');
        } catch (e) {
            console.error('TC11: Error - ' + e.message);
        }

        // ============================================
        // TC12: Spec Step 4 - partially valid CSS replaces rules
        // When input contains at least some valid rules, replaceSync
        // should replace all existing rules with the parsed result.
        // This distinguishes "partial parse success" from "complete parse failure".
        // ============================================
        try {
            const sheet = new CSSStyleSheet();
            sheet.insertRule('div { color: red; }', 0);
            console.assert(sheet.cssRules.length === 1, 'TC12.1: should have 1 rule before replaceSync');

            // Partially valid input - at least one valid rule exists
            sheet.replaceSync('span { color: blue; } {{{invalid');

            // Existing rules should be replaced with whatever was parsed
            console.assert(sheet.cssRules.length >= 1, 'TC12.2: should have at least 1 parsed rule');
            console.assert(sheet.cssRules[0].selectorText === 'span', 'TC12.3: first rule should be "span"');
        } catch (e) {
            console.error('TC12: Error - ' + e.message);
        }


        if (typeof testEnd === 'function') {
            testEnd();
        }
    </script>
</body>

</html>
