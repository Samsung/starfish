<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        #target {
            display: grid;
            width: 100%;
            height: 250px;
            grid-template-areas:
                "head head"
                "nav main"
                ". foot";
            grid-template-rows: 50px 1fr 30px;
            grid-template-columns: 150px 1fr;
        }

        #target>header {
            grid-area: head;
            background-color: #8ca0ff;
        }

        #target>nav {
            grid-area: nav;
            background-color: #ffa08c;
        }

        #target>main {
            grid-area: main;
            background-color: #ffff64;
        }

        #target>footer {
            grid-area: foot;
            background-color: #8cffa0;
        }
    </style>
</head>

<body>
    <section id="target">
        <header></header>
        <nav></nav>
        <main></main>
        <footer></footer>
    </section>

</body>
<script>
    function testStart() {
        testAssert(getComputedStyle(target)['grid-template-areas'] == '"head head" "nav main" ". foot"');
        testEnd();
    }
</script>

</html>
