<!doctype html>
<html>
 <head>
  <style>
.test1 {
    height:100px;
	--animation-speed: .25s;
	position: absolute;
	inset: 0;
    background: green;
}

.test2 {
	width: 100%;
	height: 100%;
	background: red;
	animation: animation1 var(--animation-speed) cubic-bezier(.65, 0, 1, 1) forwards;
}

.test3 {
	width: 100%;
	height: 50%;
	background: blue;
}

@keyframes animation1 {
    0% { width: 0; height: 0; }
    50% { width: 100%; height: 100%; }
    100% { width: 0; height: 0; }
}

 </style>
 </head>
 <body>
 <div class="test1" id="div1">
    <div class="test2" id="div2">
        <div class="test3" id="div3">
        </div>
    </div>
  </div>
 </body>
 <script>
  window.setTimeout(function() {
    div1 = document.getElementById("div1");
    div1.style.height="200px";
  },1);
  window.setTimeout(function() {
    cs = window.getComputedStyle(document.getElementById("div2"));
    console.log(cs.height);
    testAssert(cs.height == "0px");
    testEnd();
  },1000);
</script>
</html>
