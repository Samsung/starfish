<!DOCTYPE html>
<html>
<head>
<title>A paused animation with a negative delay shows its delayed time</title>
<link rel="help" href="https://drafts.csswg.org/css-animations/#animation-delay">
<style>
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .paused { animation-duration: 4s; animation-delay: -1s;
            animation-timing-function: linear; animation-play-state: paused; }
  #fade { animation-name: fade; }
</style>
</head>
<body>
<div id="fade" class="paused">fade</div>
<script>
  // A negative delay starts the animation part way through its run, paused
  // or not: here a quarter of the way.
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      var opacity = parseFloat(getComputedStyle(document.getElementById("fade")).opacity);
      console.assert(Math.abs(opacity - 0.25) < 0.01, "opacity paused at a quarter: " + opacity);
      if (window.testEnd) {
        testEnd();
      }
    });
  });
</script>
</body>
</html>
