<!DOCTYPE html>
<html>

<head>
    <style>
        .my-element {
            width: 100px;
            height: 100px;
            background-color: red;
            position: relative;
            top: 100px;
            left: 100px;
            animation: myAnimation 1s linear;
        }

        @keyframes myAnimation {
            0% {
                transform-origin: 0% 0%;
                transform: rotate(0deg);
            }

            50% {
                transform-origin: 50% 50%;
                transform: rotate(180deg);
            }

            100% {
                transform-origin: 100% 100%;
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="test" class="my-element"></div>
</body>
<script>
    let startTime, endTime;
    let frames = [];
    let state = "none"
    const reasonableExpectedFrameCount = 10; // 1초 동안 10프레임 이상이어야 함
    const epsilon = 100;

    function parseTransformOrigin(transformOrigin) {
        const [x, y] = transformOrigin.split(' ').map(value => {
            if (value.endsWith('%')) {
                return parseFloat(value) / 100; // %를 소수로 변환
            } else if (value.endsWith('px')) {
                return parseFloat(value); // px를 정수로 변환
            } else {
                return parseFloat(value); // 단위 없는 숫자
            }
        });
        return { x, y };
    }

    function captureFrame() {
        const elapsedTime = performance.now() - startTime;
        const progress = elapsedTime / 1000;
        const transformOrigin = getComputedStyle(test).transformOrigin;
        console.log(transformOrigin);
        const { x, y } = parseTransformOrigin(transformOrigin);

        frames.push({
            x,
            y,
        });

        if (progress < 1 || state == "start") {
            requestAnimationFrame(captureFrame);
        }
    }


    test.addEventListener('animationstart', (e) => {
        console.log("Animation started.")
        startTime = performance.now();
        state = "start";
        requestAnimationFrame(captureFrame);
    });

    test.addEventListener('animationend', function (event) {
        console.log("Animation ended.")
        state = "stop";
        endTime = performance.now();

        totalElapsedTime = endTime - startTime;
        let diff = 1000 - totalElapsedTime;

        if (!(Math.abs(diff) < epsilon)) {
            // 허용 오차 범위 100ms 보다 event 간격이 크면 테스트 실패
            console.log("The total time of the transition is not close to 1 second.");
            testAssert(false);
        }

        if (frames.length <= reasonableExpectedFrameCount) {
            // 1초 동안 10프레임 이상이어야 함
            console.log("The number of captured frames is less than expected. Expected at least " + reasonableExpectedFrameCount + " frames, but got " + frames.length + ".");
            testAssert(false);
        }

        // drop first frame due to m_isEveryAnimiatedValueResolved == false
        frames.shift()
        let oldX = frames[0].x;
        let oldY = frames[0].y;

        for (let i = 1; i < frames.length - 1; i++) {
            // 각 프레임의 x, y 좌표가 이전 프레임보다 커야 함
            let { x, y } = frames[i];
            if (!(oldX < x && oldY < y) && !oldX && !oldY) {
                console.log("frame index: ", i);
                console.log("old transformOrigin: ", oldX, oldY, "transformOrigin: ", x, y);
                testAssert(false);
            }
            oldX = x;
            oldY = y;
        }
        testEnd();
    });
</script>


</html>
