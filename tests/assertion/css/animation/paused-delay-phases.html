<!doctype html>
<meta charset="utf-8">
<title>A paused animation honours its delay, fill mode, iteration count and direction</title>
<link rel="help" href="https://drafts.csswg.org/css-animations/#animation-delay">
<link rel="help" href="https://drafts.csswg.org/web-animations-1/#calculating-the-active-time">
<style>
  @keyframes fade { from { opacity: 0.2; } to { opacity: 0.6; } }
  div { opacity: 1; animation: fade 4s linear paused; }
  #before { animation-delay: 1s; }
  #after { animation-delay: -5s; }
  #afterFill { animation-delay: -5s; animation-fill-mode: forwards; }
  #second { animation-delay: -5s; animation-iteration-count: 2; }
  #reverse { animation-delay: -1s; animation-direction: reverse; }
  #alternate { animation-delay: -1s; animation-iteration-count: 2;
               animation-direction: alternate; }
  #alternateReverse { animation-delay: -5s; animation-iteration-count: 2;
                      animation-direction: alternate-reverse; }
  #tiny { animation-duration: 0.0004s; animation-fill-mode: both; }
</style>
<div id="before"></div><div id="after"></div><div id="afterFill"></div>
<div id="second"></div><div id="reverse"></div>
<div id="alternate"></div><div id="alternateReverse"></div>
<div id="tiny"></div>
<script>
// css-animations-1 #animation-delay: a negative delay starts the animation
// that far into its run, also while paused; a positive one leaves it in the
// before phase. web-animations-1 #calculating-the-active-time: outside the
// active interval only a fill has an effect; the iteration count and
// direction apply as when running (#calculating-the-directed-progress).
// Each case is paused at a fixed point of a 4s run from 0.2 to 0.6.
function opacity(id) { return parseFloat(getComputedStyle(document.getElementById(id)).opacity); }
function check(id, expected) {
  console.assert(Math.abs(opacity(id) - expected) < 0.01, id + ": " + opacity(id) + " != " + expected);
}
requestAnimationFrame(function () { requestAnimationFrame(function () {
  check("before", 1);
  check("after", 1);
  check("afterFill", 0.6);
  check("second", 0.3);
  check("reverse", 0.5);
  // The first iteration of alternate and the second of alternate-reverse
  // play forwards.
  check("alternate", 0.3);
  check("alternateReverse", 0.3);
  // Shorter than a millisecond: at its start, or, on a clock of whole
  // milliseconds where it is zero long, after it (the fill keeps its end).
  var tiny = opacity("tiny");
  console.assert(Math.abs(tiny - 0.2) < 0.01 || Math.abs(tiny - 0.6) < 0.01,
                 "tiny: " + tiny);
  if (typeof testEnd === "function") testEnd();
}); });
</script>
