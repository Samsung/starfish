<!DOCTYPE html>
<html>

<head>
    <style>
        .flex-container {
            margin-inline-start: 10rem;
            margin-inline-end: 10rem;
            border-radius: 5px;
            background: #60B99A;
        }

        .test1 {
            margin: 20px;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            background: #4584b1;
            margin-top: 20px;
        }

        .test2 {
            margin: 20px 0px;
            margin-inline-start: 10rem;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            background: #4584b1;
            margin-top: 20px
        }

        .test3 {
            margin: 20px 0px;
            margin-inline-start: 10rem;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            background: #4584b1;
            direction: rtl;
            margin-top: 20px
        }

        .test4 {
            margin: 20px 0px;
            margin-inline-end: 10rem;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            background: #4584b1;
            margin-top: 20px
        }

        .test5 {
            margin: 20px 0px;
            margin-inline-end: 10rem;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            background: #4584b1;
            direction: rtl;
            margin-top: 20px
        }


        .test6 {
            margin: 20px 20px 20px 20px;
            margin-inline: 10rem;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            background: #4584b1;
            margin-top: 20px
        }
    </style>

</head>

<body>
    <div class="flex-container">
        <div id="target1" class="test1">1</div>
        <div id="target2" class="test2">2</div>
        <div id="target3" class="test3">3</div>
        <div id="target4" class="test4">4</div>
        <div id="target5" class="test5">5</div>
        <div id="target6" class="test6">6</div>
    </div>
</body>
<script>
    function testStart() {
        testAssert(getComputedStyle(target1)['margin'] == getComputedStyle(target1)['margin-inline-start']);

        testAssert(getComputedStyle(target2)['margin-left'] == getComputedStyle(target2)['margin-inline-start']);

        testAssert(getComputedStyle(target3)['margin-right'] == getComputedStyle(target3)['margin-inline-start']);

        testAssert(getComputedStyle(target4)['margin-right'] == getComputedStyle(target4)['margin-inline-end']);

        testAssert(getComputedStyle(target5)['margin-left'] == getComputedStyle(target5)['margin-inline-end']);

        testAssert(getComputedStyle(target6)['margin-left'] == getComputedStyle(target6)['margin-inline']);
        testAssert(getComputedStyle(target6)['margin-right'] == getComputedStyle(target6)['margin-inline']);
        testAssert(getComputedStyle(target6)['margin-inline-start'] == getComputedStyle(target6)['margin-inline-end']);
        testAssert(getComputedStyle(target6)['margin-inline-end'] == getComputedStyle(target6)['margin-inline']);
        testEnd();
    }
</script>

</html>
