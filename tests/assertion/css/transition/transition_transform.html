<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS </title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: blue;
            margin: 50px auto;
            transition: transform 1s linear;
        }
    </style>
</head>

<body>
    <div id="test1" class="box"></div>
    <script>
        if (window['testAssert'] === undefined) {
            testAssert = console.log
            testEnd = console.log
        }
        let startTime, endTime;
        let frames = [];
        let state = "none"
        const reasonableExpectedFrameCount = 40; // 1초 동안 40프레임 이상이어야 함
        const epsilon = 100;

        function getScaleAndRotate(element) {
            let style = window.getComputedStyle(element);
            let matrix = style.transform.match(/matrix\(([^)]+)\)/)[1].split(',').map(Number);
            let scaleX = Math.sqrt(matrix[0] * matrix[0] + matrix[1] * matrix[1]);
            let scaleY = Math.sqrt(matrix[2] * matrix[2] + matrix[3] * matrix[3]);

            let rotationAngle = Math.atan2(matrix[1], matrix[0]) * (180 / Math.PI); // Convert to degrees
            if (rotationAngle < 0) {
                rotationAngle += 360;
            }
            rotationAngle = rotationAngle % 360;
            console.log(`scaleX: ${scaleX}, scaleY: ${scaleY}, rotationAngle: ${rotationAngle}`);
            return { scaleX, scaleY, rotationAngle };

        }

        function captureFrame() {
            const elapsedTime = performance.now() - startTime;
            const progress = elapsedTime / 1000;
            const { scaleX, scaleY, rotationAngle } = getScaleAndRotate(test1);

            frames.push({
                scaleX,
                scaleY,
                rotationAngle,
            });

            if (progress < 1 || state == "start") {
                requestAnimationFrame(captureFrame);
            }
        }

        let test1StartCount = 0;
        test1.addEventListener('transitionstart', (e) => {
            test1StartCount++;
            startTime = performance.now();
            state = "start";
            requestAnimationFrame(captureFrame);
        });

        let test1EndCount = 0;
        test1.addEventListener('transitionend', function (event) {
            test1EndCount++
            state = "stop";
            endTime = performance.now();

            totalElapsedTime = endTime - startTime;
            let diff = 1000 - totalElapsedTime;

            if (!(Math.abs(diff) < epsilon)) {
                // 허용 오차 범위 100ms 보다 event 간격이 크면 테스트 실패
                console.log("1")
                testAssert(false);
            }

            if (frames.length <= reasonableExpectedFrameCount) {
                // 1초 동안 40프레임 이상이어야 함
                console.log("2")
                testAssert(false);
            }
            let oldScaleX = frames[0].scaleX;
            let oldScaleY = frames[0].scaleY;
            let oldRotationAngle = frames[0].rotationAngle;
            console.log(`frames.length: ${frames.length}`)
            for (let i = 1; i < frames.length - 1; i++) {
                // 각 프레임의 rx, ry 값이 이전 프레임보다 커져야 함
                let scaleX = frames[i].scaleX;
                let scaleY = frames[i].scaleY;
                let rotationAngle = frames[i].rotationAngle;
                if (!(oldScaleX < scaleX && oldScaleY < scaleY && oldRotationAngle < rotationAngle)) {
                    console.log("frame index: ", i);
                    console.log("oldScaleX: ", oldScaleX, "scaleX: ", scaleX);
                    console.log("oldScaleY: ", oldScaleY, "scaleY: ", scaleY);
                    console.log("oldRotationAngle: ", oldRotationAngle, "rotationAngle: ", rotationAngle);
                    testAssert(false);
                }
                oldScaleX = scaleX;
                oldScaleY = scaleY;
                oldRotationAngle = rotationAngle;
            }
        });

        window.onload = function () {
            test1.style.transform = 'rotate(359deg) scale(2)';
        }

        setTimeout(() => {
            console.log('test1StartCount expected[1] actual[' + test1StartCount + ']');
            console.log('test1EndCount expected[1] actual[' + test1EndCount + ']');
            testAssert(test1StartCount == 1);
            testAssert(test1EndCount == 1);
            testEnd();
        }, 1500);

    </script>
</body>

</html>
