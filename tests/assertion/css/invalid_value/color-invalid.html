function test_opacity(){
    // valid test - Normal
    for (var i = 0; i < as.length; i ++) {
        for(var j=0; j < 1; j+=0.1){
            property_test2(as[i],'opacity',j,j,'Opacity - normal - test');

    // invalid test

        as[i].style.opacity='';
        for(var j=-1; j < 0; j+=0.1){
            property_test2(as[i],'opacity',j,j,'Opacity - invalid - test');
        }
    }

    for (var i = 0; i < as.length; i ++) {
        as[i].style.opacity='';
        for(var j=1; j < 20; j++){
            property_test(as[i],'opacity',j,j,'Opacity - invalid - test');
        }
    }
}

function test_named_color_notation(){

    // valid test - Camel Case?

        for(var j=0; j < valid_colorNames_camelCase.length; j++){
            for(var k=0; k < color_use_property.length; k++){

            }
        }
    }

    // invalid test - Typo Case
    for (var i = 0; i < as.length; i ++) {
        var ref_value = 'red';
        for(var j=0; j < invalid_colorNames.length; j++){
            for(var k=0; k < color_use_property.length; k++){
                // initialize
                as[i].style[color_use_property[k]] = ref_value;
                //do test
                property_test(as[i],color_use_property[k],invalid_colorNames[j],ref_value,'NameColor - invalid Case - '+color_use_property[k]+' test');
            }
        }
    }
}

function test_3_character_dash_notation(){
    // valid test - Normal
    for (var i = 0; i < as.length; i ++) {
        for(var j=0;j<16;j++){
            for(var k=0;k<16;k++){
                for(var l=0;l<16;l++){
                    for(var m=0; m < color_use_property.length; m++){
                        var r=16*j+j;
                        var g=16*k+k;
                        var b=16*l+l;
                        property_test(as[i],color_use_property[m],convert3CH_notation(j,k,l),'rgb('+r+', '+g+', '+b+')','3-character dash notation - Normal - '+color_use_property[m]+' test');
                    }
                }
            }
        }
    }

    // invalid test
    for (var i = 0; i < as.length; i ++) {
        var ref_value = '#000';
        for(var j=0; j < invalid_3Notations.length; j++){
            for(var k=0; k < color_use_property.length; k++){
                // initialize
                as[i].style[color_use_property[k]] = ref_value;
                //do test
                property_test(as[i],color_use_property[k],invalid_3Notations[j],'rgb(0, 0, 0)','3-character dash notation - invalid - '+color_use_property[k]+' test');
            }
        }
    }
}

function property_test(element,property,testValue,expectedValue,description){
    element.style[property] = testValue;
    if(element.style[property]!=expectedValue){
        console.log("Test FAIL: DESC:"+description+" ,realValue: "+element.style[property]+" , expectedValue: "+expectedValue);
    }
}

function property_test2(element,property,testValue,expectedValue,description){
    element.style[property] = testValue;

    var prop = expectedValue = parseFloat(element.style[property]).toPrecision(1);
    expectedValue = parseFloat(expectedValue).toPrecision(1);

    // escargot bug : toPrecision(N) should provide N-digit of precision
    if(expectedValue == 0.10 || expectedValue == -0.10 )
        return;

    if(prop != expectedValue){
        console.log("Test FAIL: DESC:"+description+" ,realValue: "+prop+" , expectedValue: "+expectedValue);
    }
}

function convert9CH_notation(r,g,b,a){
    var result='#';
    if(r<16){
        result+='0'+r.toString(16);
    }else{
        result+=r.toString(16);
    }
    if(g<16){
        result+='0'+g.toString(16);
    }else{
        result+=g.toString(16);
    }
    if(b<16){
        result+='0'+b.toString(16);
    }else{
        result+=b.toString(16);
    }
    if(a<16){
        result+='0'+a.toString(16);
    }else{
        result+=a.toString(16);
    }
    return result;
}

function convert6CH_notation(r,g,b){
    var result='#';
    if(r<16){
        result+='0'+r.toString(16);
    }else{
        result+=r.toString(16);
    }
    if(g<16){
        result+='0'+g.toString(16);
    }else{
        result+=g.toString(16);
    }
    if(b<16){
        result+='0'+b.toString(16);
    }else{
        result+=b.toString(16);
    }
    return result;
}
function convert3CH_notation(r,g,b){
    var result='#';
    result+=r.toString(16);
    result+=g.toString(16);
    result+=b.toString(16);
    return result;
}

function convertFunc_notation(r,g,b,a){
    var result='rgba( ';
    result+=r+' ,';
    result+=g+' ,';
    result+=b+' ,';
    result+=a+' )';
    return result;
}
