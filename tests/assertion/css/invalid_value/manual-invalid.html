<!DOCTYPE html>
<html>
<meta name="pixel-test">

<style>
    div {
        background: red;
        border: 2px solid black;
    }
    span {
        background: blue;
        border: 4px solid black;
    }
</style>


<body>
    <div>
        <span>span1
        <span>span2
            <div class="a" id='testTagget'>
                This is TC which is generated by custom spec.
            </div>
        span2</span>
        span1</span>
    </div>
</body>


<script>

/*
var keyword_invalid=[
                    'aa',
                    'b01',
                    '02',
                    'abcdefgrhgisdjosipdfjgosispdiojsdgpiojsdgpaomspdomc',
                    '#&*%^$*&@#!^$%!(@*^',
                    '-999',
                    '0',
                    'space space',
                    '9999999999999999999999999999',
                    '-8888888888888888888888888888'
                ];
*/

var keyword_invalid=[
                    'aa',
                    'b01',
                    'abcdefgrhgisdjosipdfjgosispdiojsdgpiojsdgpaomspdomc',
                    '#&*%^$*&@#!^$%!(@*^',
                    'space space',
                ];

var length_units=[
                    'px',
                    'em',
                    'ex',
                    'in',
                    'cm',
                    'mm',
                    'pt',
                    'pc',
                    'rem',
                    'ch'
                ];

var length_units_invalid=[
                    'pxx',
                    'emm',
                    'ext',
                    'inch',
                    'cmm',
                    'mmm',
                    'kg',
                    'g',
                    'meter',
                    'km',
                    'pixel',
                    'dot',
                    'point',
                    'ppi',
                    'dpi'
                ];

var length_units_unsupported=[
                ];

var url_valid=[
                'url("noexists/test.gif")',
                // CSS Syntax returns the function at EOF even without ')'.
                // https://www.w3.org/TR/css-syntax-3/#consume-function
                'url( "noexists/gif" ',
                'url()'
               ];

var url_validResult=[
               'url("noexists/test.gif")',
               'url("noexists/gif")',
               'url("")'
              ];

var url_invalid=[
               'url( "noexists/gif") )',
               'urll( "noexists/gif" )',
               'url "noexists/gif" '
              ];


var targetElement = document.getElementById("testTagget");


function testStart() {
    // background

    // background-image
    test_background_image();

    // border-image-source
    test_border_image_source();

    // border-image-slice
    test_border_image_slice();

    // transform
    test_transform();

    // transform-origin
    test_transform_origin();

    if (typeof testEnd === 'function') {
        testEnd();
    }
}


function test_background_image(){

    //normal test
    for(var i=0; i < url_valid.length; i++){
        property_test(targetElement,'backgroundImage',url_valid[i],url_validResult[i],'background-image - normal - ('+url_valid[i]+')');
    }
    property_test(targetElement,'backgroundImage','none','none','background-image - normal - none - test');

    //invalid test
    for(var i=0; i < url_invalid.length; i++){
        targetElement.style.backgroundImage='';
        property_test(targetElement,'backgroundImage',url_invalid[i],'','background-image - invalid - ('+url_invalid[i]+')');
        // Invalid assignments preserve the previous declaration (CSSOM).
        // https://drafts.csswg.org/cssom/#dom-cssstyledeclaration-setproperty
        targetElement.style.backgroundImage=url_valid[0];
        property_test(targetElement,'backgroundImage',url_invalid[i],url_validResult[0],'background-image - preserve previous value - ('+url_invalid[i]+')');
    }

}

function test_border_image_source(){

    //normal test
    for(var i=0; i < url_valid.length; i++){
        property_test(targetElement,'borderImageSource',url_valid[i],url_validResult[i],'borderImageSource - normal - ('+url_valid[i]+')');
    }
    property_test(targetElement,'borderImageSource','none','none','borderImageSource - normal - none - test');

    //invalid test
    for(var i=0; i < url_invalid.length; i++){
        targetElement.style.borderImageSource='';
        property_test(targetElement,'borderImageSource',url_invalid[i],'','borderImageSource- invalid - ('+url_invalid[i]+')');
        targetElement.style.borderImageSource=url_valid[0];
        property_test(targetElement,'borderImageSource',url_invalid[i],url_validResult[0],'borderImageSource - preserve previous value - ('+url_invalid[i]+')');
    }

}


function test_border_image_slice(){

    //normal test - number
    for(var k=0; k < 200; k++){
        property_test(targetElement,'borderImageSlice',k,k,'borderImageSlice - normal - ('+k+')');
    }
    // If 'fill' keyword is used alone, any results don't happen.
    property_test(targetElement,'borderImageSlice',k+' fill',k+' fill','borderImageSlice - normal - fill');

    //invalid test
    targetElement.style.borderImageSlice='';
    for(var i=0; i < keyword_invalid.length; i++){
        property_test(targetElement,'borderImageSlice',keyword_invalid[i],'','borderImageSlice- invalid ');
    }

}


function test_transform(){

    // normal test
    property_test(targetElement,'transform','none','none','transform - normal - ');
    property_test(targetElement,'transform','matrix(1, 1, 1, 1, 1, 1)','matrix(1, 1, 1, 1, 1, 1)','transform - normal - ');

    // These are value-acceptance checks, not shortest-form serialization checks.
    // The second translate/skew argument defaults to zero; scale defaults to
    // its first argument. Only those equivalent forms are listed below.
    // https://drafts.csswg.org/css-transforms-1/#two-d-transform-functions
    for(var j=0; j < length_units.length; j++){
        for(var k=0; k < 100; k++){
            var translateValue = 'translate('+k+length_units[j]+', '+k+length_units[j]+')';
            var translateExpected = k === 0 ?
                [translateValue, 'translate(0'+length_units[j]+')'] : translateValue;
            property_test(targetElement,'transform',translateValue,translateExpected,'transform - normal - ');
            property_test(targetElement,'transform','translateX('+k+length_units[j]+')','translateX('+k+length_units[j]+')','transform - normal - ');
            property_test(targetElement,'transform','translateY('+k+length_units[j]+')','translateY('+k+length_units[j]+')','transform - normal - ');


        }
    }
    for(var k=0; k < 360; k++){
        property_test(targetElement,'transform','scale('+k+', '+k+')',['scale('+k+')', 'scale('+k+', '+k+')'],'transform - normal - ');
        property_test(targetElement,'transform','scaleX('+k+')','scaleX('+k+')','transform - normal - ');
        property_test(targetElement,'transform','scaleY('+k+')','scaleY('+k+')','transform - normal - ');

        property_test(targetElement,'transform','rotate('+k+'deg)','rotate('+k+'deg)','transform - normal - ');

        var skewValue = 'skew('+k+'deg, '+k+'deg)';
        var skewExpected = k === 0 ? ['skew(0deg)', skewValue] : skewValue;
        property_test(targetElement,'transform',skewValue,skewExpected,'transform - normal - ');
        property_test(targetElement,'transform','skewX('+k+'deg)','skewX('+k+'deg)','transform - normal - ');
        property_test(targetElement,'transform','skewY('+k+'deg)','skewY('+k+'deg)','transform - normal - ');
    }

    // Non-default second arguments must not be discarded.
    property_test(targetElement,'transform','translate(1px, 2px)','translate(1px, 2px)','transform - normal - distinct offsets');
    property_test(targetElement,'transform','scale(2, 3)','scale(2, 3)','transform - normal - distinct scale factors');
    property_test(targetElement,'transform','skew(1deg, 2deg)','skew(1deg, 2deg)','transform - normal - distinct angles');

    // invalid test

    targetElement.style.transform='';

    for(var j=0; j < length_units_invalid.length; j++){
        for(var k=0; k < 100; k++){
            property_test(targetElement,'transform','translate('+k+length_units_invalid[j]+', '+k+length_units_invalid[j]+')','','transform - normal - ');
            property_test(targetElement,'transform','translateX('+k+length_units_invalid[j]+')','','transform - invalid - ');
            property_test(targetElement,'transform','translateY('+k+length_units_invalid[j]+')','','transform - invalid - ');


        }
    }
    for(var j=0; j < length_units_unsupported.length; j++){
        for(var k=0; k < 100; k++){
            property_test(targetElement,'transform','translate('+k+length_units_unsupported[j]+', '+k+length_units_unsupported[j]+')','','transform - normal - ');
            property_test(targetElement,'transform','translateX('+k+length_units_unsupported[j]+')','','transform - invalid - ');
            property_test(targetElement,'transform','translateY('+k+length_units_unsupported[j]+')','','transform - invalid - ');

        }
    }

}

function test_transform_origin(){

    // The omitted second axis defaults to center (50%), and Z defaults to 0px.
    // Follow WPT's explicit alternatives for these equivalent values.
    // https://drafts.csswg.org/css-transforms-1/#transform-origin-property
    // https://wpt.live/css/css-transforms/parsing/transform-origin-valid.html
    //normal test - %
    for(var k=0; k < 100; k++){
        property_test(targetElement,'transformOrigin',k+'%',
            [k+'% center', k+'% center 0px', k+'% 50% 0px'],
            'transformOrigin - normal - ('+k+'%'+')');
    }

    for(var j=0; j < length_units.length; j++){
        for(var k=0; k < 100; k++){
            var originValue = k+length_units[j];
            property_test(targetElement,'transformOrigin',originValue,
                [originValue+' center', originValue+' center 0px', originValue+' 50% 0px'],
                'transformOrigin - normal - ('+length_units[j]+')');
        }
    }
    property_test(targetElement,'transformOrigin','top',
        ['center top', 'center top 0px', '50% top 0px'],'transformOrigin - normal - top - test');
    property_test(targetElement,'transformOrigin','right',
        ['right center', 'right center 0px', 'right 50% 0px'],'transformOrigin - normal - right - test');
    property_test(targetElement,'transformOrigin','bottom',
        ['center bottom', 'center bottom 0px', '50% bottom 0px'],'transformOrigin - normal - bottom - test');
    property_test(targetElement,'transformOrigin','left',
        ['left center', 'left center 0px', 'left 50% 0px'],'transformOrigin - normal - left - test');
    property_test(targetElement,'transformOrigin','center',
        ['center center', 'center center 0px', 'center 50% 0px'],'transformOrigin - normal - center - test');
    property_test(targetElement,'transformOrigin','top left',
        ['left top', 'left top 0px'],'transformOrigin - normal - top left - test');
    property_test(targetElement,'transformOrigin','top center',
        ['center top', 'center top 0px'],'transformOrigin - normal - top center - test');

    // A nonzero Z offset must be preserved.
    property_test(targetElement,'transformOrigin','1px 2px 3px','1px 2px 3px',
        'transformOrigin - normal - nonzero Z offset');

    // invalid test

    targetElement.style.transformOrigin='';
    for(var j=0; j < length_units_invalid.length; j++){
        for(var k=0; k < 100; k++){
            property_test(targetElement,'transformOrigin',k+length_units_invalid[j],'','transformOrigin - invalid - ('+length_units_invalid[j]+')');
        }
    }

    for(var j=0; j < length_units_unsupported.length; j++){
        for(var k=0; k < 100; k++){
            property_test(targetElement,'transformOrigin',k+length_units_unsupported[j],'','transformOrigin - invalid - ('+length_units_unsupported[j]+')');
        }
    }
    targetElement.style.transformOrigin='';
    property_test(targetElement,'transformOrigin','topp','','transformOrigin - invalid - test1');
    property_test(targetElement,'transformOrigin','1right','','transformOrigin - invalid - test2');
    property_test(targetElement,'transformOrigin','123','','transformOrigin - invalid - test3');
    property_test(targetElement,'transformOrigin','left right','','transformOrigin - invalid - test4');
    property_test(targetElement,'transformOrigin','center center center','','transformOrigin - invalid - test5');
    property_test(targetElement,'transformOrigin','1px left','','transformOrigin - invalid - test6');
    property_test(targetElement,'transformOrigin','top 1px','','transformOrigin - invalid - test7');
    // The Z component accepts a length, not a percentage.
    property_test(targetElement,'transformOrigin','1px 2px 3%','','transformOrigin - invalid - Z percentage');
}


testStart();

function property_test(element,property,testValue,expectedValue,description){
    element.style[property] = testValue;
    var actualValue = element.style[property];
    var expectedValues = Array.isArray(expectedValue) ? expectedValue : [String(expectedValue)];
    console.assert(expectedValues.indexOf(actualValue) !== -1,
        description+" ,input: "+JSON.stringify(testValue)+
        " ,realValue: "+JSON.stringify(actualValue)+
        " ,expectedValues: "+JSON.stringify(expectedValues));
}

</script>
</html>
