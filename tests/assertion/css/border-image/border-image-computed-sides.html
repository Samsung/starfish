<!DOCTYPE html>
<meta charset="utf-8">
<title>Computed border image widths and outsets use each side's value</title>
<link rel="help" href="https://drafts.csswg.org/css-backgrounds/#border-image-width">
<link rel="help" href="https://drafts.csswg.org/css-backgrounds/#border-image-outset">
<div id="target" style="font-size: 40px"></div>
<script>
if (typeof testEnd !== "function") {
  var passed = 0, failed = 0;
  var nativeAssert = console.assert.bind(console);
  console.assert = function (condition, message) {
    if (condition) {
      passed++;
    } else {
      failed++;
      nativeAssert(false, message);
    }
  };
  window.testEnd = function () {
    document.title = (failed ? "FAIL" : "PASS") + " (" + passed + " passed, " + failed + " failed)";
    console.log("[border-image-computed-sides] " + document.title);
  };
}

var target = document.getElementById("target");
function check(property, value, expected) {
  target.style.setProperty(property, value);
  var actual = getComputedStyle(target).getPropertyValue(property);
  console.assert(actual === (expected || value), property + ": " + value + " computed to " + actual);
}

check("border-image-width", "1 2 3 4");
check("border-image-width", "20% 10px auto 1");
check("border-image-outset", "1 2 3 4");
check("border-image-outset", "1px 2 3px 4");
check("border-image-width", "calc(20% + 1em)", "calc(20% + 40px)");
check("border-image-width", "calc(1 + 2)", "3");
check("border-image-outset", "0 calc(0.5em + 10px) 3 calc(-0.5em + 10px)", "0 30px 3 0px");
check("border-image-outset", "calc(1 + 2)", "3");
testEnd();
</script>
