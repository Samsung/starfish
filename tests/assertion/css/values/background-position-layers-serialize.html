<!doctype html>
<meta charset="utf-8">
<title>Multi-layer background-position serializes its layers with commas</title>
<script>
if (typeof testEnd !== "function") {
  var passed = 0, failed = 0;
  var nativeAssert = console.assert.bind(console);
  console.assert = function (condition, message) {
    if (condition) passed++;
    else { failed++; nativeAssert(false, message); }
  };
  window.testEnd = function () {
    document.title = (failed ? "FAIL" : "PASS") + " (" + passed + " passed, " + failed + " failed)";
    console.log("[background-position-layers-serialize] " + document.title);
  };
}
</script>
<div id="plain" style="background-position: 1% 3px, 4px 5px"></div>
<div id="minmax" style="background-position: 4px 5px, min(1%, 2%) 3px"></div>
<div id="mask" style="mask-position: 1px 2px, 3px 4px"></div>
<script>
// css-backgrounds-3 #background-position: one <bg-position> per layer,
// comma-separated; each longhand is a comma-separated list too.
window.addEventListener("load", function () {
  function is(actual, expected, what) {
    console.assert(actual === expected, what + ": " + actual + " != " + expected);
  }
  var plain = document.getElementById("plain").style;
  is(plain.backgroundPosition, "1% 3px, 4px 5px", "shorthand");
  is(plain.backgroundPositionX, "1%, 4px", "x longhand");
  is(plain.backgroundPositionY, "3px, 5px", "y longhand");
  var minmax = document.getElementById("minmax").style;
  is(minmax.backgroundPosition, "4px 5px, min(1%, 2%) 3px", "shorthand with min()");
  is(minmax.backgroundPositionX, "4px, min(1%, 2%)", "x longhand with min()");
  is(document.getElementById("mask").style.maskPosition, "1px 2px, 3px 4px",
     "mask-position");
  testEnd();
});
</script>
