<!doctype html>
<meta charset="utf-8">
<title>calc() summation serializes in canonical order (numbers, percentages, then dimensions by unit)</title>
<style>
  #target { font-size: 20px; }
</style>
<script>
if (typeof testEnd !== "function") {
  var passed = 0, failed = 0;
  var nativeAssert = console.assert.bind(console);
  console.assert = function (condition, message) {
    if (condition) passed++;
    else { failed++; nativeAssert(false, message); }
  };
  window.testEnd = function () {
    document.title = (failed ? "FAIL" : "PASS") + " (" + passed + " passed, " + failed + " failed)";
    console.log("[calc-serialization-order] " + document.title);
  };
}
</script>
<div id="target"></div>
<script>
// css-values-4 "Serialization": a calc() summation is serialized numbers
// first, then percentages, then dimensions sorted by unit, regardless of
// the order in the parsed value. Expectations cross-validated in Chrome
// (headless 157). Known gaps tracked apart: same-unit merging (Chrome
// simplifies calc(1s + 2ms) to calc(1.002s)), leading unary minus being
// rejected at parse, and invalid number/length mixing being accepted.
var target = document.getElementById("target");

// percentage before dimension even though the declaration wrote em first
target.style.paddingTop = "calc(2em + 3%)";
console.assert(target.style.paddingTop === "calc(3% + 2em)",
  "specified paddingTop: " + target.style.paddingTop);

// an already-canonical summation is unchanged
target.style.paddingTop = "calc(3% - 2em)";
console.assert(target.style.paddingTop === "calc(3% - 2em)",
  "specified paddingTop (canonical input): " + target.style.paddingTop);

// multiple dimensions sorted by unit (em < px)
target.style.width = "calc(1px + 1em + 2%)";
console.assert(target.style.width === "calc(2% + 1em + 1px)",
  "specified width: " + target.style.width);

// same-unit terms merge into one (numbers, percentages, equal-unit lengths)
target.style.paddingTop = "calc(1px + 2px)";
console.assert(target.style.paddingTop === "calc(3px)",
  "specified paddingTop (merged px): " + target.style.paddingTop);
target.style.paddingTop = "calc(1em + 2em)";
console.assert(target.style.paddingTop === "calc(3em)",
  "specified paddingTop (merged em): " + target.style.paddingTop);
target.style.paddingTop = "calc(2% + 1%)";
console.assert(target.style.paddingTop === "calc(3%)",
  "specified paddingTop (merged %): " + target.style.paddingTop);
target.style.paddingTop = "calc(2em + 1em + 3px)";
console.assert(target.style.paddingTop === "calc(3em + 3px)",
  "specified paddingTop (merged em + px): " + target.style.paddingTop);

// different units stay unmerged, sorted by unit
target.style.paddingTop = "calc(1px + 1em)";
console.assert(target.style.paddingTop === "calc(1em + 1px)",
  "specified paddingTop (unmerged units): " + target.style.paddingTop);

// time merges into the canonical unit (seconds)
target.style.animationDelay = "calc(1s + 2ms)";
console.assert(target.style.animationDelay === "calc(1.002s)",
  "specified animationDelay (merged time): " + target.style.animationDelay);

// angle merges into the canonical unit (degrees)
target.style.transform = "rotate(calc(1deg + 2turn))";
console.assert(target.style.transform === "rotate(calc(721deg))",
  "specified transform (merged angle): " + target.style.transform);

// the cssText round-trip serializes the same way
target.style.cssText = "padding-top: calc(2em + 3%)";
console.assert(target.style.cssText === "padding-top: calc(3% + 2em);",
  "cssText: " + target.style.cssText);

testEnd();
</script>
