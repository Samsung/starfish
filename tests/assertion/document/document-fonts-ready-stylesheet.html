<!DOCTYPE html>
<meta charset="utf-8">
<title>document.fonts.ready waits for a pending stylesheet</title>
<link rel="help" href="https://drafts.csswg.org/css-font-loading/#fontfaceset-pending-on-the-environment">
<span id="probe" style="font-size:30px">iiii</span>
<script>
if (typeof testEnd !== 'function') {
    var __pass = 0, __fail = 0;
    var __nativeAssert = console.assert.bind(console);
    console.assert = function (condition, message) {
        if (condition) {
            __pass++;
        } else {
            __fail++;
            __nativeAssert(false, message);
        }
    };
    window.testEnd = function () {
        var verdict = (__fail === 0 ? 'PASS' : 'FAIL') +
            ' (' + __pass + ' passed, ' + __fail + ' failed)';
        console.log('[document-fonts-ready-stylesheet] ' + verdict);
        document.title = verdict;
    };
}

var sheet = document.createElement('link');
sheet.rel = 'stylesheet';
sheet.href = 'resources/document-fonts-ready.css';
document.head.appendChild(sheet);
// Subscribe while the initial document and stylesheet are pending.
var ready = document.fonts.ready;
ready.then(function () {
    var status = document.fonts.status;
    console.assert(status === 'loaded',
        'stylesheet fonts finish loading before ready; observed ' + status);
    var width = document.getElementById('probe').offsetWidth;
    console.assert(width === 120,
        'ready includes fonts from the pending stylesheet; observed ' + width);
    console.assert(ready === document.fonts.ready,
        'stylesheet font loading preserves the pending promise; observed ' +
        (ready === document.fonts.ready));
    testEnd();
});
</script>
