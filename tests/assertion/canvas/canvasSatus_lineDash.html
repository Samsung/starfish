<canvas id="canvas"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    var dashes = [20, 10, 0, 0];

    ctx.setLineDash(dashes);
    ctx.lineDashOffset = 1;
    ctx.save();

    var zeroDashes = [0, 0, 0];
    ctx.setLineDash(zeroDashes);
    ctx.lineDashOffset = 3;
    
    testAssert(ctx.getLineDash() != zeroDashes);
    ctx.getLineDash().forEach(function(item, index, array){
        if (index < zeroDashes.length) {
            testAssert(zeroDashes[index] == item);
        } else {
            testAssert(zeroDashes[index - zeroDashes.length] == item);
        } 
    });

    testAssert(ctx.lineDashOffset == 3);

    ctx.restore();
    
    ctx.getLineDash().forEach(function(item, index, array){
        testAssert(dashes[index] == item);
    });

    testAssert(ctx.lineDashOffset == 1);
    testEnd();
</script>
