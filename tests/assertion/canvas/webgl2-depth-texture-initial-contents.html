<!doctype html>
<meta charset="utf-8">
<title>WebGL2 depth textures made from a null source start at depth 1.0</title>
<canvas id="canvas" width="4" height="4"></canvas>
<script>
if (typeof testEnd !== 'function') {
  var __pass = 0, __fail = 0, __firstError = '';
  var __nativeAssert = console.assert ? console.assert.bind(console) : function () {};
  console.assert = function (condition, message) {
    if (condition) {
      __pass++;
    } else {
      __fail++;
      if (!__firstError) __firstError = message;
      __nativeAssert(false, message);
    }
  };
  window.testEnd = function () {
    var verdict = (__fail === 0 ? 'PASS' : 'FAIL') +
      ' (' + __pass + ' passed, ' + __fail + ' failed)';
    console.log('[webgl2-depth-texture-initial-contents] ' + verdict);
    document.title = verdict + (__firstError ? ': ' + __firstError : '');
  };
}

// WebGL 1.0 §4.1: a depth resource made without data reads as depth 1.0, and
// its stencil as 0. That holds for every level, face and layer that
// texImage2D or texImage3D makes from a null source, also while the rest of
// the texture is not there yet. Each case is checked on a new texture, made
// after one of the same shape held other values and was deleted, and again
// after those values were written to it and its levels were made anew.

var SIZE = 32, LAYERS = 4, LEVELS = 3;

var gl = document.getElementById('canvas').getContext('webgl2');
console.assert(!!gl, 'WebGL2 context is required');

// internal format, format, type
var formats = [
  ['DEPTH_COMPONENT16', 'DEPTH_COMPONENT', 'UNSIGNED_SHORT'],
  ['DEPTH_COMPONENT16', 'DEPTH_COMPONENT', 'UNSIGNED_INT'],
  ['DEPTH_COMPONENT24', 'DEPTH_COMPONENT', 'UNSIGNED_INT'],
  ['DEPTH_COMPONENT32F', 'DEPTH_COMPONENT', 'FLOAT'],
  ['DEPTH24_STENCIL8', 'DEPTH_STENCIL', 'UNSIGNED_INT_24_8'],
  ['DEPTH32F_STENCIL8', 'DEPTH_STENCIL', 'FLOAT_32_UNSIGNED_INT_24_8_REV']
];

// The images a framebuffer attaches one at a time: faces or layers.
function imageCount(target) {
  if (target === gl.TEXTURE_CUBE_MAP) return 6;
  return target === gl.TEXTURE_2D_ARRAY ? LAYERS : 1;
}

// Makes every level of the bound texture from a null source, one level and
// one face at a time.
function define(target, format) {
  for (var level = 0; level < LEVELS; level++) {
    var size = SIZE >> level;
    if (target === gl.TEXTURE_2D_ARRAY) {
      gl.texImage3D(target, level, gl[format[0]], size, size, LAYERS, 0,
                    gl[format[1]], gl[format[2]], null);
      continue;
    }
    for (var image = 0; image < imageCount(target); image++) {
      gl.texImage2D(
          target === gl.TEXTURE_CUBE_MAP ?
              gl.TEXTURE_CUBE_MAP_POSITIVE_X + image : target,
          level, gl[format[0]], size, size, 0, gl[format[1]], gl[format[2]],
          null);
    }
  }
  // Only now is the texture complete, so that a framebuffer takes each of
  // its levels.
  gl.texParameteri(target, gl.TEXTURE_MAX_LEVEL, LEVELS - 1);
}

function attach(attachment, target, texture, level, image) {
  if (target === gl.TEXTURE_2D_ARRAY) {
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, attachment, texture, level,
                               image);
  } else {
    gl.framebufferTexture2D(
        gl.FRAMEBUFFER, attachment,
        target === gl.TEXTURE_CUBE_MAP ?
            gl.TEXTURE_CUBE_MAP_POSITIVE_X + image : target,
        texture, level);
  }
}

function forEachImage(target, callback) {
  for (var level = 0; level < LEVELS; level++) {
    for (var image = 0; image < imageCount(target); image++) {
      callback(level, image);
    }
  }
}

function dirty(target, texture, attachment) {
  gl.clearDepth(0.25);
  gl.clearStencil(90);
  forEachImage(target, function (level, image) {
    attach(attachment, target, texture, level, image);
    gl.clear(gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
  });
  attach(attachment, target, null, 0, 0);
  gl.clearDepth(1);
  gl.clearStencil(0);
  gl.finish();
}

// Draws just in front of the far plane where the stencil is 0, so a pixel
// is drawn only where the depth is 1.0 and the stencil 0.
function countWrong(target, texture, attachment, color) {
  var wrong = 0;
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LESS);
  gl.depthMask(false);
  gl.enable(gl.STENCIL_TEST);
  gl.stencilFunc(gl.EQUAL, 0, 0xff);
  forEachImage(target, function (level, image) {
    var size = SIZE >> level;
    gl.bindRenderbuffer(gl.RENDERBUFFER, color);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, size, size);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
                               gl.RENDERBUFFER, color);
    attach(attachment, target, texture, level, image);
    gl.viewport(0, 0, size, size);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    var pixels = new Uint8Array(size * size * 4);
    gl.readPixels(0, 0, size, size, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    for (var i = 0; i < pixels.length; i += 4) {
      if (pixels[i] !== 255) {
        wrong++;
      }
    }
  });
  attach(attachment, target, null, 0, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
                             gl.RENDERBUFFER, null);
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.disable(gl.STENCIL_TEST);
  return wrong;
}

function test(target, targetName, format, color) {
  var attachment = format[1] === 'DEPTH_STENCIL' ?
      gl.DEPTH_STENCIL_ATTACHMENT : gl.DEPTH_ATTACHMENT;
  var name = targetName + ' ' + format[0] + ' from ' + format[2];
  var texture = gl.createTexture();
  gl.bindTexture(target, texture);
  define(target, format);
  dirty(target, texture, attachment);
  gl.deleteTexture(texture);
  gl.finish();

  texture = gl.createTexture();
  gl.bindTexture(target, texture);
  define(target, format);
  var wrong = countWrong(target, texture, attachment, color);
  console.assert(wrong === 0, name + ': ' + wrong + ' pixels of a new ' +
                              'texture are not depth 1.0 and stencil 0');

  dirty(target, texture, attachment);
  define(target, format);
  wrong = countWrong(target, texture, attachment, color);
  console.assert(wrong === 0, name + ': ' + wrong + ' pixels of levels ' +
                              'made anew are not depth 1.0 and stencil 0');
  gl.deleteTexture(texture);
}

function makeProgram() {
  var sources = [
    [gl.VERTEX_SHADER, '#version 300 es\n' +
     'void main() {\n' +
     '  gl_Position = vec4(float((gl_VertexID & 1) * 4 - 1),\n' +
     '                     float((gl_VertexID & 2) * 2 - 1), 0.99, 1.0);\n' +
     '}'],
    [gl.FRAGMENT_SHADER, '#version 300 es\n' +
     'precision mediump float;\n' +
     'out vec4 color;\n' +
     'void main() { color = vec4(1.0, 0.0, 0.0, 1.0); }']
  ];
  var program = gl.createProgram();
  sources.forEach(function (source) {
    var shader = gl.createShader(source[0]);
    gl.shaderSource(shader, source[1]);
    gl.compileShader(shader);
    gl.attachShader(program, shader);
  });
  gl.linkProgram(program);
  console.assert(gl.getProgramParameter(program, gl.LINK_STATUS),
                 'the test program links');
  return program;
}

if (gl) {
  gl.useProgram(makeProgram());
  var color = gl.createRenderbuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, gl.createFramebuffer());
  ['TEXTURE_2D', 'TEXTURE_CUBE_MAP', 'TEXTURE_2D_ARRAY'].forEach(
      function (targetName) {
        formats.forEach(function (format) {
          test(gl[targetName], targetName, format, color);
        });
      });
  var error = gl.getError();
  console.assert(error === gl.NO_ERROR,
                 'no GL error, got 0x' + error.toString(16));
}
testEnd();
</script>
