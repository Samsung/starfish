<!DOCTYPE html>
<html>
<!--
  A fullscreen element's stacking context must be hoisted to the document
  root (top-layer emulation). The UA-forced z-index alone is confined to the
  nearest ancestor stacking context, so a sibling stacking context with a
  higher z-index (the overlay below) would otherwise paint above the
  fullscreen element and steal its input.
-->
<head>
<style>
  body {
    margin: 0;
  }

  #container {
    position: relative;
    z-index: 1;
    width: 200px;
    height: 150px;
    background-color: lightblue;
  }

  #target {
    width: 100px;
    height: 100px;
    background-color: orange;
  }

  #overlay {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 100;
    background-color: red;
  }
</style>
</head>
<body>
  <div id="container">
    <div id="target">target</div>
  </div>
  <div id="overlay"></div>
</body>

<script>
  var targetClicked = false;
  var overlayClicked = false;

  var target = document.getElementById("target");
  var overlay = document.getElementById("overlay");

  target.addEventListener("click", function() {
    targetClicked = true;
  });
  overlay.addEventListener("click", function() {
    overlayClicked = true;
  });

  function testStart() {
    target.requestFullscreen().then(function() {
      testAssert(document.fullscreenElement === target);
      setTimeout(function() {
        // The fullscreen element fills the viewport; a click anywhere must
        // reach it, not the z-index:100 overlay from the sibling stacking
        // context.
        simulateClick(400, 300);
        setTimeout(function() {
          testAssert(targetClicked === true);
          testAssert(overlayClicked === false);
          testEnd();
        }, 100);
      }, 300);
    });
  }
</script>
</html>
