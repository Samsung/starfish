<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @keyframes myAni {
            0% {
                rx: 0;
            }

            50% {
                rx: 2.5;
            }

            100% {
                rx: 5;
            }
        }

        #keyframesTarget {
            animation: myAni 1s linear forwards;
        }
    </style>
</head>

<body>
    <svg width="300px" height="150px" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
        <rect id="animateTarget" width="10" height="10">
            <animate id="animateOrigin" attributeName="rx" values="0;2.5;5" dur="1s" fill="freeze" />
        </rect>
    </svg>
    <svg width=" 300px" height="150px" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
        <rect id="keyframesTarget" width="10" height="10"> </rect>
    </svg>
</body>

<script>

    let startTime, endTime;
    let animateFrames = [];
    let keyframesFrames = [];
    let state = "none"

    let beginEventCount = 0;
    let endEventCount = 0;
    animateOrigin.addEventListener("beginEvent", (e) => {
        beginEventCount++;
        checkStart();
        testAssert(beginEventCount == 1);
    });
    animateOrigin.addEventListener("endEvent", (e) => {
        endEventCount++;
        checkEnd();
        testAssert(endEventCount == 1);
    });

    let animationstartCount = 0;
    let animationsendCount = 0;
    keyframesTarget.addEventListener("animationstart", (e) => {
        animationstartCount++;
        checkStart();
        testAssert(animationstartCount == 1);
    });
    keyframesTarget.addEventListener("animationend", (e) => {
        animationsendCount++;
        checkEnd()
        testAssert(animationsendCount == 1);
    });


    function checkStart() {
        if (beginEventCount == 1 && animationstartCount == 1 && state == 'none') {
            console.log('all begin event fired! start capturing frames...')
            state = 'start';
            startTime = performance.now();
            requestAnimationFrame(requestAnimationFrameCallback);
        }
    }

    function checkEnd() {
        if (endEventCount == 1 && animationsendCount == 1 && state == 'start') {
            console.log('all end event fired!')
            state = 'end';
            endTime = performance.now();
        }
    }

    function percentSTRToFloat(str) {
        return (parseFloat(str.replace("px", "")) / 100).toFixed(8);
    }
    function captureFrame(captureTarget, frameStore) {
        const rx = getComputedStyle(captureTarget).rx;
        frameStore.push({
            rx,
        });
    }



    const epsilonForFrames = 5; // frame count difference
    const epsilonForElapsedTime = 100;
    const epsilonForValueDiff = 0.005; // Computed style values ​​for each frame difference 


    function requestAnimationFrameCallback() {
        const elapsedTime = performance.now() - startTime;
        const progress = elapsedTime / 1000;

        captureFrame(animateTarget, animateFrames);
        captureFrame(keyframesTarget, keyframesFrames);

        if (progress < 1 || state == "start") {
            requestAnimationFrame(requestAnimationFrameCallback);
        } else if (state == 'end') {
            totalElapsedTime = endTime - startTime;
            let diff = 1000 - totalElapsedTime;
            if (!(Math.abs(diff) < epsilonForElapsedTime)) {
                // 허용 오차 범위 100ms 보다 event 간격이 크면 테스트 실패
                console.log("total elapsed time : ", totalElapsedTime, "diff : ", diff);
                testAssert(false);
            }
            if (Math.abs(animateFrames.length - keyframesFrames) > epsilonForFrames) {
                // frame count 차이가 허용 오차보다 크면 테스트 실패
                console.log("frame count diff : ", Math.abs(animateFrames.length - keyframesFrames));
                testAssert(false);
            }

            minFramesSize = Math.min(animateFrames.length, keyframesFrames.length);

            for (let i = 0; i < minFramesSize; i++) {
                rx1 = percentSTRToFloat(animateFrames[i].rx);
                rx2 = percentSTRToFloat(keyframesFrames[i].rx);
                // 두값의 차이가 허용 오차보다 크면 테스트 실패
                rxDiff = Math.abs(rx1 - rx2).toFixed(8);
                if (rxDiff > epsilonForValueDiff) {
                    console.log("frame index : ", i, "rx1 : ", rx1, "rx2 : ", rx2, 'diff: ', rxDiff);
                    testAssert(false);
                }
            }
            testEnd();
        }
    }

</script>

</html>
