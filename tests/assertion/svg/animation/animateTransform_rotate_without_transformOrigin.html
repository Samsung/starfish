<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animateTransform_rotate_without_transformOrigin</title>
    <style>
    </style>
</head>

<body>

    <svg id="my-svg" style="position: relative; left: 100px; top: 100px" width="300" height="300" viewBox="0 0 300 300"
        xmlns="http://www.w3.org/2000/svg">
        <rect id="test1" x="0" y="0" width="40" height="40" fill="red" class="rotation">
            <animateTransForm id="animateOrigin" attributeName="transform" attributeType="XML" type="rotate" from="0 "
                to="360 " dur="1s" repeatCount="1" />
        </rect>

    </svg>

    <script>
        if (window['testAssert'] === undefined) {
            testAssert = console.log
            testEnd = console.log
        }
        let startTime, endTime;
        let frames = [];
        let state = "none"
        const reasonableExpectedFrameCount = 10; // 1초 동안 10프레임 이상이어야 함
        const epsilon = 100;

        function getScaleAndRotate(element) {
            let style = window.getComputedStyle(element);
            if (style.transform == 'none') {
                return { scaleX: 1, scaleY: 1, rotationAngle: 0 }; // default values when no transformation applied
            }

            let matrix = style.transform.match(/matrix\(([^)]+)\)/)[1].split(',').map(Number);
            let scaleX = Math.sqrt(matrix[0] * matrix[0] + matrix[1] * matrix[1]);
            let scaleY = Math.sqrt(matrix[2] * matrix[2] + matrix[3] * matrix[3]);

            let rotationAngle = Math.atan2(matrix[1], matrix[0]) * (180 / Math.PI); // Convert to degrees
            if (rotationAngle < 0) {
                rotationAngle += 360;
            }
            rotationAngle = rotationAngle % 360;
            console.log(`rotationAngle: ${rotationAngle}`);
            return { scaleX, scaleY, rotationAngle };

        }

        function captureFrame() {
            const elapsedTime = performance.now() - startTime;
            const progress = elapsedTime / 1000;
            const { scaleX, scaleY, rotationAngle } = getScaleAndRotate(test1);

            frames.push({
                rotationAngle,
            });

            if (progress < 1 || state == "start") {
                requestAnimationFrame(captureFrame);
            }
        }

        animateOrigin.classList.add("rotation");

        animateOrigin.addEventListener('beginEvent', (e) => {
            startTime = performance.now();
            state = "start";
            requestAnimationFrame(captureFrame);
        });

        animateOrigin.addEventListener('endEvent', function (event) {
            state = "stop";
            endTime = performance.now();

            totalElapsedTime = endTime - startTime;
            let diff = 1000 - totalElapsedTime;

            if (!(Math.abs(diff) < epsilon)) {
                // 허용 오차 범위 100ms 보다 event 간격이 크면 테스트 실패
                console.log("The total time of the transition is not close to 1 second.");
                testAssert(false);
            }

            if (frames.length <= reasonableExpectedFrameCount) {
                console.log("The number of captured frames is less than expected. Expected at least " + reasonableExpectedFrameCount + " frames, but got " + frames.length + ".");
                testAssert(false);
            }
            // drop first frame due to m_isEveryAnimiatedValueResolved == false
            frames.shift()
            // drop last frame due to degree == 360
            frames.pop()
            let oldRotationAngle = frames[0].rotationAngle;
            for (let i = 1; i < frames.length - 1; i++) {
                // 각 프레임의 회전각도가 이전 프레임보다 커야 함
                let rotationAngle = frames[i].rotationAngle;
                if (!(oldRotationAngle < rotationAngle)&& !(oldRotationAngle && !rotationAngle)) {
                    console.log("frame index: ", i);
                    console.log("oldRotationAngle: ", oldRotationAngle, "rotationAngle: ", rotationAngle);
                    testAssert(false);
                }
                oldRotationAngle = rotationAngle;
            }

            testEnd();
        });

    </script>
</body>

</html>
