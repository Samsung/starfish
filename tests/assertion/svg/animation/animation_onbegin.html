<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" width="300px" height="100px">
        <title>SVG SMIL Animate with Path</title>
        <circle cx="0" cy="50" r="50" fill="blue" stroke="black" stroke-width="1">
            <animate id="target" attributeName="cx" from="50" to="300" dur="1s" repeatCount="1" />
        </circle>
    </svg>


</body>

<script>
    if (window['testAssert'] === undefined) {
        testAssert = console.log
        testEnd = console.log
    }

    function createResult(event) {
        return {
            event: null,
            callCount: 0,
        };
    }

    let beginEventResult = createResult();
    let onbeginResult = createResult();

    let createEventHandler = (eventHandleResult) => {
        let result = eventHandleResult;
        return function (e) {
            result.event = e;
            result.callCount++;
        }
    };

    target.addEventListener('beginEvent', createEventHandler(beginEventResult));

    let onbegin = createEventHandler(onbeginResult);
    target.onbegin = onbegin;

    target.addEventListener('endEvent', () => {
        testAssert(beginEventResult.event != null);
        testAssert(beginEventResult.callCount == 1);

        testAssert(onbeginResult.event != null);
        testAssert(onbeginResult.callCount == 1);

        testAssert(onbeginResult.event == beginEventResult.event);

        testAssert(target.onbegin == onbegin);
        testEnd();
    });
</script>

</html>
