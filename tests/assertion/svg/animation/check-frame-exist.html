<script>

function asdf()
{
  console.log(test.style.display)
  if (test.style.display) {
    test.style.display = "";
  } else {
    test.style.display = "none"
  }
}

function testStart()
{
    var oldRenderingCount = window.renderingCount();
    asdf();
    window.setTimeout(function() {
        console.log(oldRenderingCount);
        console.log(window.renderingCount());
        testAssert((oldRenderingCount + 1) == window.renderingCount());
        asdf();
        window.setTimeout(function() {
            console.log(oldRenderingCount);
            console.log(window.renderingCount());
            testAssert((oldRenderingCount + 3) < window.renderingCount());
            testEnd();
        }, 1000);
    }, 500);
}
