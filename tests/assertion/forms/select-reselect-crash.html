<!doctype html>
<meta charset="utf-8">
<title>Changing a collapsed select's selection repeatedly does not crash</title>
<script>
if (typeof testEnd !== "function") {
  var passed = 0, failed = 0;
  var nativeAssert = console.assert.bind(console);
  console.assert = function (condition, message) {
    if (condition) passed++;
    else { failed++; nativeAssert(false, message); }
  };
  window.testEnd = function () {
    document.title = (failed ? "FAIL" : "PASS") + " (" + passed + " passed, " + failed + " failed)";
    console.log("[select-reselect-crash] " + document.title);
  };
}
</script>
<select id="s"><option>A</option><option>B</option><option>C</option></select>
<script>
var s = document.getElementById("s");
var n = 0;
function step() {
  s.selectedIndex = (s.selectedIndex + 1) % 3;
  document.body.offsetHeight;
  requestAnimationFrame(function () {
    if (++n < 6) {
      step();
      return;
    }
    console.assert(s.selectedIndex === 0, "selection cycled back to the first option");
    testEnd();
  });
}
step();
</script>
