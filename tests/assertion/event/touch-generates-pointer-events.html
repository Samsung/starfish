<!DOCTYPE html>
<html>
<!--
  Pointer Events compatibility mapping for touch input: a tap must produce
  pointerdown and pointerup alongside the touch events and the synthesized
  click, mirroring what the mouse path already dispatches. Pointer-driven UI
  (e.g. a player progress bar seeking from pointerdown) otherwise never
  reacts to touch.
  https://w3c.github.io/pointerevents/#compatibility-mapping-with-mouse-events
-->
<head>
<style>
  body {
    margin: 0;
  }

  #target {
    width: 200px;
    height: 200px;
    background-color: orange;
  }
</style>
</head>
<body>
  <div id="target"></div>
</body>

<script>
  var events = [];

  var target = document.getElementById("target");
  ["pointerdown", "pointerup", "touchstart", "touchend", "click"].forEach(
    function(type) {
      target.addEventListener(type, function() {
        events.push(type);
      });
    });

  function testStart() {
    simulateClick(50, 50);

    setTimeout(function() {
      testAssert(events.indexOf("pointerdown") !== -1);
      testAssert(events.indexOf("pointerup") !== -1);
      testAssert(events.indexOf("click") !== -1);
      // pointerdown belongs to the touch-start sequence, pointerup to the
      // touch-end sequence. Spec order: touchend → pointerup → click.
      testAssert(events.indexOf("pointerdown") < events.indexOf("pointerup"));
      testAssert(events.indexOf("pointerdown") < events.indexOf("click"));
      testAssert(events.indexOf("touchend") < events.indexOf("click"));
      testAssert(events.indexOf("pointerup") < events.indexOf("click"));
      testEnd();
    }, 100);
  }
</script>
</html>
