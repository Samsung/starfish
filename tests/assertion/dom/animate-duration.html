<!doctype html>
<meta charset="utf-8">
<title>Numeric animation duration</title>
<body>
<script>
function testStart() {
    const root = document.documentElement;
    console.assert(root.animate([], 0) instanceof Animation);
    const frames = [{ opacity: 0 }, { opacity: 1 }];
    const animation = root.animate(frames, 250);
    console.assert(animation instanceof Animation);
    animation.cancel();
    console.assert(root.animate([{ opacity: 1 }], 20) instanceof Animation);
    function rejects(keyframes, timing, message) {
        let rejected = false;
        try {
            root.animate(keyframes, timing);
        } catch (error) {
            rejected = error instanceof TypeError;
        }
        console.assert(rejected, message);
    }

    console.assert(root.animate(frames, "250") instanceof Animation, "Numeric strings are durations");
    console.assert(root.animate(new Set(frames), {duration: 250}) instanceof Animation, "Iterable keyframes");
    console.assert(root.animate({ opacity: [0, 1], left: ["1px", "2px", "3px"],
        offset: [0, null, 1], easing: ["ease", "steps(2)"] }, 250) instanceof Animation,
        "Property-indexed keyframes accept lists of different lengths");
    const target = document.createElement("div");
    document.body.appendChild(target);
    for (const easing of ["steps(1, jump-start)", "steps(1, jump-end)"]) {
        const transform = target.animate({transform: ["none", "skewX(30deg) rotateZ(60deg)"]},
                                         {duration: 250, easing});
        console.assert(transform instanceof Animation, "Step aliases accept transform keyframes");
        transform.cancel();
    }
    target.remove();
    rejects(frames, "abc", "Nonnumeric durations must throw");
    rejects([{offset: 1}, {offset: 0}], 10, "Offsets must increase");
    rejects({opacity: [0, 1], offset: [0, 2]}, 10, "Indexed offsets must stay in range");
    rejects({opacity: [0], easing: ["linear", "inherit"]}, 10, "Even unused easings must parse");
    rejects([{opacity: 0, composite: "other"}], 10, "Invalid composite enum");
    const marker = {};
    let caught;
    try {
        root.animate([{ get opacity() { throw marker; } }], 10);
    } catch (error) {
        caught = error;
    }
    console.assert(caught === marker, "A throwing property getter must propagate its exception");
    for (const options of [-1, NaN, {duration: -1}, {duration: NaN},
                           {iterations: -1}, {iterationStart: -1}]) {
        rejects(null, options, "Invalid timing must throw even for null keyframes");
    }
    if (typeof testEnd === "function") testEnd();
}
</script>
