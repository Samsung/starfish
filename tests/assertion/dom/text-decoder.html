<script>
try
{
  let utf8decoder = new TextDecoder("utf-8", {fatal:true});
  let u8arr = new Uint8Array([240, -160, 174, 183]);
  console.log(utf8decoder.decode(u8arr));
  testAssert(false)
} catch(e) {
  testAssert(e instanceof TypeError)
}

let utf8decoder = new TextDecoder("utf-8"); // default 'utf-8' or 'utf8'

let u8arr = new Uint8Array([240, 160, 174, 183]);
let i8arr = new Int8Array([-16, -96, -82, -73]);
let u16arr = new Uint16Array([41200, 47022]);
let i16arr = new Int16Array([-24336, -18514]);
let i32arr = new Int32Array([-1213292304]);

testAssert(utf8decoder.decode(u8arr) == "𠮷");
testAssert(utf8decoder.decode(i8arr) == "𠮷");
testAssert(utf8decoder.decode(u16arr) == "𠮷");
testAssert(utf8decoder.decode(i16arr) == "𠮷");
testAssert(utf8decoder.decode(i32arr) == "𠮷");

let win1251decoder = new TextDecoder('windows-1251');
let bytes = new Uint8Array([207, 240, 232, 226, 229, 242, 44, 32, 236, 232, 240, 33]);
testAssert(win1251decoder.decode(bytes)=="Привет, мир!"); // Привет, мир!

testEnd();

</script>
