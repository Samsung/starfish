<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Resizing an iframe re-applies its viewport media queries</title>
<style>
iframe { border: 0; }
</style>
</head>
<body>
<script>
// Starfish's test build supplies testEnd()/console.assert. When that harness
// is absent (other browser), shim a testEnd() that tallies console.assert
// results and reports the verdict, so the same file runs and reports anywhere.
if (typeof testEnd !== 'function') {
  var __pass = 0, __fail = 0;
  var __nativeAssert = console.assert ? console.assert.bind(console) : function () {};
  console.assert = function (cond, msg) {
    if (cond) { __pass++; } else { __fail++; __nativeAssert(false, msg); }
  };
  window.testEnd = function () {
    var verdict = (__fail === 0 ? 'PASS' : 'FAIL') +
      ' (' + __pass + ' passed, ' + __fail + ' failed)';
    console.log('[iframe-resize-media-query] ' + verdict);
    document.title = verdict;
  };
}

// Media queries are evaluated against the iframe's viewport, so changing the
// iframe's width must re-apply the @media rules of the nested document, not
// only update matchMedia()
// (https://drafts.csswg.org/mediaqueries-4/#mq-width).
var steps = [
  { width: 100, matches: true, display: 'inline-block', height: '20px', rectWidth: 30 },
  { width: 64, matches: false, display: 'block', height: '50px', rectWidth: 64 },
  { width: 100, matches: true, display: 'inline-block', height: '20px', rectWidth: 30 }
];
var current = 0;

function check() {
  var frame = document.getElementById('frame');
  frame.width = steps[current].width;
  // Lay out the parent so the nested viewport takes the new width.
  frame.getBoundingClientRect();
  frame.contentWindow.postMessage('check', '*');
}

window.addEventListener('message', function (event) {
  if (event.data === 'ready') {
    check();
    return;
  }
  var expected = steps[current];
  var seen = event.data;
  var tag = 'iframe width ' + expected.width + ': ';
  console.assert(seen.innerWidth === expected.width,
                 tag + 'innerWidth ' + seen.innerWidth);
  console.assert(seen.matches === expected.matches,
                 tag + 'matchMedia ' + seen.matches);
  console.assert(seen.display === expected.display,
                 tag + 'display ' + seen.display);
  console.assert(seen.height === expected.height,
                 tag + 'height ' + seen.height);
  console.assert(seen.rectWidth === expected.rectWidth,
                 tag + 'box width ' + seen.rectWidth);
  current++;
  if (current < steps.length) {
    check();
  } else {
    testEnd();
  }
});
</script>
<iframe id="frame" width="100" height="100"
        src="resources/iframe-resize-media-query_iframe.html"></iframe>
</body>
</html>
