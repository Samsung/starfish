<!doctype html>
<meta charset="utf-8">
<title>An iframe inside an SVG image runs no script</title>
<script>
if (typeof testEnd !== 'function') {
  var __pass = 0, __fail = 0, __firstError = '';
  var __nativeAssert = console.assert ? console.assert.bind(console) : function () {};
  console.assert = function (condition, message) {
    if (condition) {
      __pass++;
    } else {
      __fail++;
      if (!__firstError) __firstError = message;
      __nativeAssert(false, message);
    }
  };
  window.testEnd = function () {
    var verdict = (__fail === 0 ? 'PASS' : 'FAIL') +
      ' (' + __pass + ' passed, ' + __fail + ' failed)';
    console.log('[svg-image-iframe-no-script] ' + verdict);
    document.title = verdict + (__firstError ? ': ' + __firstError : '');
  };
}

// An SVG document used as an image runs in SVG Integration's secure
// animated mode: no script, no external resources. An iframe in its
// <foreignObject> must not run script, which could otherwise reach the
// embedding page or any origin.
var messages = [];
addEventListener('message', function (e) { messages.push(String(e.data)); });

function inner(tag) {
  return '<script>top.postMessage("' + tag + '", "*");<\/script>';
}
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;')
          .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">' +
  '<rect width="20" height="20" fill="green"/>' +
  '<foreignObject width="20" height="20">' +
  '<div xmlns="http://www.w3.org/1999/xhtml">' +
  '<iframe srcdoc="' + esc(inner('srcdoc')) + '"></iframe>' +
  '<iframe src="' + esc('data:text/html,' + encodeURIComponent(inner('data'))) + '"></iframe>' +
  '</div></foreignObject></svg>';

var img = new Image();
img.onload = function () {
  setTimeout(function () {
    console.assert(messages.length === 0,
                   'script ran inside the SVG image: ' + messages.join(','));
    testEnd();
  }, 500);
};
img.onerror = function () {
  console.assert(false, 'the SVG image failed to load');
  testEnd();
};
img.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
</script>
