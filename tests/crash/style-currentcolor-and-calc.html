<!doctype html>
<meta charset="utf-8">
<title>currentcolor shadows, calc() offsets and length vertical-align do not crash</title>
<div style="color: blue; box-shadow: 0 0 0 1px currentcolor; text-shadow: 1px 1px currentColor">x</div>
<div style="color: red; box-shadow: inset currentcolor 1px 2px, 3px 4px currentColor">x</div>
<div style="outline: 1px solid; outline-offset: calc(10px - 20px)">x</div>
<svg width="10" height="10"><rect width="10" height="10" style="fill-opacity: calc(0.5 * 3)"/></svg>
<span id="aligned" style="vertical-align: calc(10% + 2px)">x</span>
<script>
// css-backgrounds-3 #box-shadow, css-text-decor-3 #text-shadow-property: a
// shadow <color> may be currentcolor. outline-offset takes a <length> and
// fill-opacity an <alpha-value>, so calc() of them too (css-values-4). A
// length vertical-align serializes as that length (cssom-1).
document.body.offsetWidth;
getComputedStyle(document.getElementById("aligned")).verticalAlign;
if (typeof testEnd === "function") testEnd();
</script>
