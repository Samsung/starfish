<!doctype html>
<meta charset="utf-8">
<title>currentcolor in canvas styles, SVG colors, gradients and legacy color attributes does not crash</title>
<style>
  html { color: currentcolor; }
  .cc { color: rgb(0, 128, 255); }
  #props { border: 2px solid currentcolor; outline: 1px solid currentcolor; column-rule: 1px solid currentcolor;
           text-decoration: underline currentcolor; caret-color: currentcolor; accent-color: currentcolor;
           background: linear-gradient(currentcolor, transparent), radial-gradient(currentcolor, red),
                       conic-gradient(currentcolor, red); border-image: linear-gradient(currentcolor, red) 1;
           -webkit-text-stroke: 1px currentcolor; -webkit-text-fill-color: currentcolor;
           scrollbar-color: currentcolor currentcolor; fill: currentcolor; stroke: currentcolor;
           stop-color: currentcolor; flood-color: currentcolor; lighting-color: currentcolor; }
  #styled stop { stop-color: currentColor; }
  #styled feFlood, #styled feDropShadow { flood-color: currentColor; }
  #styled feDiffuseLighting, #styled feSpecularLighting { lighting-color: currentColor; }
</style>
<div id="props" class="cc">text</div>
<font color="currentcolor">font</font>
<table bgcolor="currentColor" bordercolor="currentcolor"><tr><td bgcolor="CURRENTCOLOR">x</td></tr></table>
<hr color="currentcolor">
<canvas id="c" class="cc" width="20" height="20"></canvas>
<svg width="200" height="40" class="cc">
  <defs>
    <linearGradient id="lg"><stop offset="0" stop-color="currentcolor"/><stop offset="1" stop-color="currentColor" stop-opacity="0.5"/></linearGradient>
    <radialGradient id="rg" style="color: red"><stop offset="0" stop-color="currentcolor"/><stop offset="1" stop-color="blue"/></radialGradient>
    <filter id="flood"><feFlood flood-color="currentcolor" flood-opacity="0.5"/></filter>
    <filter id="shadow"><feDropShadow dx="2" dy="2" flood-color="currentColor"/></filter>
    <filter id="light"><feDiffuseLighting lighting-color="currentcolor"><feDistantLight azimuth="45" elevation="45"/></feDiffuseLighting></filter>
    <filter id="spec"><feSpecularLighting lighting-color="currentcolor"><fePointLight x="10" y="10" z="10"/></feSpecularLighting></filter>
  </defs>
  <rect width="20" height="20" fill="url(#lg)"/>
  <rect x="25" width="20" height="20" fill="url(#rg)"/>
  <rect x="50" width="20" height="20" filter="url(#flood)"/>
  <rect x="75" width="20" height="20" fill="currentcolor" filter="url(#shadow)"/>
  <rect x="100" width="20" height="20" filter="url(#light)"/>
  <rect x="125" width="20" height="20" filter="url(#spec)"/>
</svg>
<svg id="styled" width="100" height="40" style="color: green">
  <defs>
    <linearGradient id="slg"><stop offset="0"/><stop offset="1"/></linearGradient>
    <filter id="sflood"><feFlood/></filter>
    <filter id="sshadow"><feDropShadow dx="2" dy="2"/></filter>
    <filter id="slight"><feDiffuseLighting><feDistantLight/></feDiffuseLighting></filter>
  </defs>
  <rect width="20" height="20" fill="url(#slg)"/>
  <rect x="25" width="20" height="20" filter="url(#sflood)"/>
  <rect x="50" width="20" height="20" filter="url(#sshadow)"/>
  <rect x="75" width="20" height="20" filter="url(#slight)"/>
</svg>
<script>
// HTML #parse-a-css-color-value: canvas colors are parsed "with" the canvas
// element, so currentcolor is that element's color, or black without one
// (and addColorStop() parses with no element at all). css-color-4
// #currentcolor-color: currentcolor is valid wherever a <color> is, including
// the SVG stop-color, flood-color and lighting-color properties and their
// presentation attributes. The legacy color parser has no currentcolor
// keyword (HTML #rules-for-parsing-a-legacy-colour-value).
function paint(ctx) {
  ["currentcolor", "currentColor", "CURRENTCOLOR", "color-mix(in srgb, currentcolor, red)",
   "rgb(from currentcolor r g b)", "currentcolour"].forEach(function (value) {
    ctx.fillStyle = value;
    ctx.strokeStyle = value;
    ctx.shadowColor = value;
    ctx.shadowBlur = 2;
    ctx.fillRect(0, 0, 10, 10);
    ctx.strokeRect(2, 2, 6, 6);
    String(ctx.fillStyle) + ctx.strokeStyle + ctx.shadowColor;
    var gradients = [ctx.createLinearGradient(0, 0, 10, 0), ctx.createRadialGradient(5, 5, 0, 5, 5, 5)];
    if (ctx.createConicGradient) gradients.push(ctx.createConicGradient(0, 5, 5));
    gradients.forEach(function (g) {
      try {
        g.addColorStop(0, value);
        g.addColorStop(1, "red");
      } catch (e) {
        // An unparsable color throws SyntaxError.
      }
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 10, 10);
    });
  });
  ctx.getImageData(0, 0, 1, 1);
}
var canvas = document.getElementById("c");
paint(canvas.getContext("2d"));
var detached = document.createElement("canvas");
detached.style.color = "red";
paint(detached.getContext("2d"));
canvas.remove();
paint(canvas.getContext("2d"));
document.body.appendChild(canvas);
paint(canvas.getContext("2d"));
if (typeof OffscreenCanvas === "function") {
  paint(new OffscreenCanvas(10, 10).getContext("2d"));
}
// The same values through script, then read back.
var props = document.getElementById("props");
["color", "backgroundColor", "borderTopColor", "outlineColor", "columnRuleColor", "textDecorationColor",
 "caretColor", "accentColor", "backgroundImage", "borderImageSource", "fill", "stroke", "stopColor",
 "floodColor", "lightingColor", "webkitTextStrokeColor", "webkitTextFillColor", "scrollbarColor",
 "boxShadow", "textShadow", "filter"].forEach(function (name) {
  getComputedStyle(props)[name];
});
Array.prototype.forEach.call(document.querySelectorAll("stop, feFlood, feDropShadow, feDiffuseLighting, feSpecularLighting"),
  function (el) {
    var cs = getComputedStyle(el);
    cs.stopColor + cs.floodColor + cs.lightingColor;
  });
document.body.bgColor = "currentcolor";
document.fgColor = "currentcolor";
document.body.offsetWidth;
requestAnimationFrame(function () {
  // A color change repaints everything that used currentcolor.
  props.style.color = "red";
  document.getElementById("styled").style.color = "blue";
  document.querySelector("svg").style.color = "magenta";
  document.body.offsetWidth;
  requestAnimationFrame(function () {
    if (typeof testEnd === "function") testEnd();
  });
});
</script>
