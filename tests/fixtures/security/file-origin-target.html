<!doctype html>
<meta charset="utf-8">
<title>Local navigation security fixture</title>
<script>
console.log('FILE_ORIGIN_TARGET_LOADED');
parent.postMessage('file-origin-target-loaded', '*');
if (parent === window) {
  var allowed = new URLSearchParams(location.search).get('allowed') === 'true';
  console.assert(allowed, 'unexpected top-level local file navigation');
  console.log('PRODUCT_SECURITY:' + JSON.stringify({
    passed: allowed, testHooks: typeof testEnd === 'function'
  }));
  if (typeof testEnd === 'function') testEnd();
}
</script>
